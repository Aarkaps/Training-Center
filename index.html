  ${tab==='content'?`<div class="card"><div class="card-b" style="padding:28px 36px"><p class="muted" style="font-size:15px;margin-top:0">${esc(a.summary)}</p><div class="prose">${a.content}</div>${attList(a)}</div></div>`:''}
  ${tab==='details'?`<div class="grid g2"><div class="card"><div class="card-h"><h3>Article details</h3></div><div class="card-b kv2">${[['Article ID',a.id],['Category',a.cat+' › '+(a.sub||'—')],['Tags',a.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')||'—'],['Author',a.author],['Created',fD(a.created)],['Last updated',fD(a.updated)],['Published',fD(a.published)],['Status',badge(a.status)],['Views (informational)',a.views+' views']].map(([k,v])=>`<div class="k">${k}</div><div>${v}</div>`).join('')}</div></div>
    <div class="card"><div class="card-h"><h3>Visibility & acknowledgment</h3></div><div class="card-b kv2"><div class="k">Visible to</div><div>${esc(audLabel(a.vis))}<div class="small muted">${audResolve(a.vis).length} employees</div></div><div class="k">Acknowledgment</div><div>${a.ack?'Required when assigned':'Not required'}</div><div class="k">Mandatory assignments</div><div>${asg.length}</div></div></div></div>`:''}
  ${tab==='rev'?`<div class="card">${table('art-rev',[{k:'rev',label:'Revision',f:r=>`<b>rev ${r.rev}</b>${r.rev===a.rev&&a.status==='Published'?' '+badge('Published'):''}`},{k:'at',label:'Published',f:r=>fDT(r.at)},{k:'by',label:'By'},{k:'note',label:'Note'},{k:'n',label:'Acknowledgments on this revision',ns:1,f:r=>S.assignments.filter(x=>x.item===a.id&&x.ackRev===r.rev).length}],a.revisions.slice().reverse(),{nopage:1,empty:'Not yet published'})}</div>`:''}
  ${tab==='acks'?`<div class="card">${table('art-acks',[{k:'emp',label:'Employee',f:r=>empCell(r.emp),sv:r=>empName(r.emp)},{k:'assigned',label:'Assigned',f:r=>fD(r.assigned)},{k:'due',label:'Due',f:r=>fD(r.due)},{k:'st',label:'Status',f:r=>badge(r.completedAt?'Acknowledged':isOverdue(r)?'Overdue':'Pending'),sv:r=>r.completedAt?1:isOverdue(r)?3:2},{k:'completedAt',label:'Acknowledged on',f:r=>fDT(r.completedAt)},{k:'ackRev',label:'Revision',f:r=>r.ackRev?'rev '+r.ackRev:'—'}],asg,{empty:'This article has not been assigned as mandatory reading.'})}</div>`:''}</div>`; };
const attList = a => a.att?.length? `<div style="margin-top:24px;border-top:1px solid var(--line2);padding-top:14px"><div class="small b" style="margin-bottom:8px">Attachments</div>${a.att.map(f=>`<div class="media-ph" style="cursor:pointer" onclick="viewAttachment('${esc(f.name)}','${f.type}')">${ic(f.type==='pdf'?'file-text':f.type==='image'?'image':'paperclip')}<div style="flex:1"><b style="font-weight:500">${esc(f.name)}</b><div class="small muted">${esc(f.size)} · secure download (authorised users only)</div></div>${ic('eye')}</div>`).join('')}</div>` : '';
function viewAttachment(name,type){ openModal({title:esc(name),size:'lg',body:()=>`<div class="docv"><div class="pgp">${type==='image'?`<div style="height:320px;background:#e9eef6;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#7d8aa3">${ic('image')} Site map image</div>`:`<h3 style="margin-top:0">${esc(name.replace(/_/g,' ').replace(/\.\w+$/,''))}</h3><p>${S.ORG.name} – controlled document. This is a representative rendering of the attached file served through an authorised, time-limited URL.</p><p style="color:#9aa3b5">Page 1 of 3</p>`}</div></div>`,foot:()=>`<button class="btn" onclick="toast('Download authorised – file served via signed URL (simulated in prototype)','inf')">${ic('download')}Download</button><button class="btn pri" onclick="closeModal()">Close</button>`}); }
function artPreview(id, draft){ const a = draft || article(id); openModal({title:'Trainee preview',size:'lg',icon:'eye',body:()=>`${note('info','Preview only – this is exactly what an authorised employee sees. No view or acknowledgment is recorded.')}<div style="padding:4px 10px"><div class="small muted">${esc(a.cat)} › ${esc(a.sub||'')}</div><h2 style="margin:6px 0 4px;font-size:24px">${esc(a.title||'Untitled article')}</h2><div class="small muted" style="margin-bottom:14px">By ${esc(a.author)} · Updated ${fD(a.updated||now())}</div><p class="muted">${esc(a.summary||'')}</p><div class="prose">${a.content||'<p class="muted">No content yet.</p>'}</div>${attList(a)}
 ${a.ack?`<div class="card" style="margin-top:22px;padding:16px;background:#f8faff"><label class="chk"><input type="checkbox" disabled> I acknowledge that I have read and understood this article.</label><button class="btn pri" style="margin-top:12px" disabled>${ic('check')}Acknowledge</button></div>`:''}</div>`}); }

/* ---------- Create / edit article ---------- */
PAGES['tc-article-edit'] = p => {
  if(!can('articleEdit')) return denied('create or edit knowledge articles');
  if(!S.ad || S.ad._src!==p.id){ const src = p.id==='new'? {id:null,title:'',summary:'',content:'',cat:'',sub:'',tags:[],att:[],vis:{all:S.settings.kb.defaultVisibility==='all',targets:[]},ack:S.settings.kb.ackDefault,status:'Draft',author:me().name,rev:0} : JSON.parse(JSON.stringify(article(p.id)));
    S.ad = Object.assign(src,{_src:p.id, mand:false, due:toISO(addDays(now(),14)), notify:{...S.settings.general.defaultNotify}, _err:{}, _tag:''}); }
  const a=S.ad, e=a._err, isPub=a.status==='Published';
  const subs = a.cat? S.kbCats.find(c=>c.name===a.cat).subs : [];
  const pubOK = can('articlePublish');
  return `<div class="pg">${pageHead(p.id==='new'?'Create Article':'Edit Article',p.id==='new'?'New knowledge article':`<span class="mono">${a.id}</span> · ${badge(a.status)} ${isPub?`· editing creates revision ${a.rev+1}`:''}`,
   `<button class="btn gh" onclick="confirmDlg({title:'Discard changes?',msg:'Unsaved changes to this article will be lost.',danger:1,ok:'Discard',onOk:()=>{S.ad=null;S.modal=null;go('tc-kb')}})">Cancel</button><button class="btn" onclick="artPreview(null,S.ad)">${ic('eye')}Preview</button>
    ${isPub?'':`<button class="btn" onclick="saveArticle('draft')">${ic('save')}Save as Draft</button>`}${!pubOK&&!isPub || S.settings.kb.approvalRequired&&!isPub?`<button class="btn" onclick="saveArticle('submit')">${ic('send')}Submit for Approval</button>`:''}
    ${pubOK?`<button class="btn pri" onclick="saveArticle('publish')">${ic('globe')}${isPub?'Publish revision '+(a.rev+1):'Publish'}</button>`:''}`, crumbs(['Knowledge Base','tc-kb'],[p.id==='new'?'New article':a.id]))}
  ${!pubOK?note('info','Your role can create and edit drafts. Publishing requires approval by a Company Administrator'+(S.settings.perm.tmPublish?' or Training Manager':'')+'.'):''}
  ${isPub?note('warn',`This article is published (rev ${a.rev}). Saving publishes <b>revision ${a.rev+1}</b>. Existing acknowledgments remain linked to the revision employees actually read; you can re-assign the new revision as mandatory reading afterwards.`):''}
  <div class="grid" style="grid-template-columns:minmax(0,1fr) 360px;align-items:start">
   <div class="card"><div class="card-b">
    <div class="fld ${e.title?'inv':''}"><label>Article title <span class="rq">*</span></label><input type="text" value="${esc(a.title)}" oninput="S.ad.title=this.value" placeholder="e.g. Night Patrol Standard Operating Procedure">${e.title?`<div class="err">${e.title}</div>`:''}</div>
    <div class="fld"><label>Summary / description</label><textarea rows="2" oninput="S.ad.summary=this.value" placeholder="One or two sentences shown in search results">${esc(a.summary)}</textarea></div>
    <div class="fld ${e.content?'inv':''}"><label>Content <span class="rq">*</span> <span class="muted" style="font-weight:400">(required before publication)</span></label>${rte('art-ed', a.content, 'S.ad.content')}${e.content?`<div class="err">${e.content}</div>`:''}</div>
    <div class="fld"><label>Attachments</label><label class="drop">${ic('upload')} <b>Click to upload</b> PDFs, documents or images <div class="small">Max 25 MB</div><input type="file" multiple hidden accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.png,.jpg,.jpeg,.gif,.webp,.mp4,.mov" onchange="addAttach(this.files,'ad')"></label>
     <div style="margin-top:8px">${a.att.map((f,i)=>`<div class="media-ph" style="margin:6px 0">${ic(f.type==='pdf'?'file-text':f.type==='image'?'image':f.type==='video'?'video':'paperclip')}<div style="flex:1">${esc(f.name)} <span class="small muted">${esc(f.size)}</span></div><span class="icb" onclick="S.ad.att.splice(${i},1);render()">${ic('trash-2')}</span></div>`).join('')}</div></div>
   </div></div>
   <div>
    <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Classification</h3></div><div class="card-b">
     <div class="fld ${e.cat?'inv':''}"><label>Category <span class="rq">*</span></label><select onchange="S.ad.cat=this.value;S.ad.sub='';render()"><option value="">Select category</option>${S.kbCats.map(c=>`<option ${a.cat===c.name?'selected':''}>${c.name}</option>`).join('')}</select>${e.cat?`<div class="err">${e.cat}</div>`:''}</div>
     <div class="fld"><label>Subcategory</label><select onchange="S.ad.sub=this.value" ${a.cat?'':'disabled'}><option value="">None</option>${subs.map(s=>`<option ${a.sub===s?'selected':''}>${s}</option>`).join('')}</select></div>
     <div class="fld mb0"><label>Tags</label><div class="flex"><input type="text" id="tagin" placeholder="Add tag and press Enter" onkeydown="if(event.key==='Enter'&&this.value.trim()){S.ad.tags.push(this.value.trim());render()}"></div><div class="chips" style="margin-top:8px">${a.tags.map((t,i)=>`<span class="chip">${esc(t)}<span class="x" onclick="S.ad.tags.splice(${i},1);render()">${ic('x')}</span></span>`).join('')}</div></div></div></div>
    <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Visibility <span class="rq" style="color:var(--red)">*</span></h3></div><div class="card-b ${e.vis?'fld inv':''}" style="padding:12px">${audPicker('S.ad.vis')}${e.vis?`<div class="err" style="margin-top:6px">${e.vis}</div>`:''}</div></div>
    <div class="card"><div class="card-h"><h3>Acknowledgment & assignment</h3></div><div class="card-b">
     <div class="setrow" style="padding-top:0"><div class="sl"><b>Acknowledgment required</b><span>Trainees must deliberately confirm they have read it.</span></div><div class="sc" style="min-width:0"><label class="sw"><input type="checkbox" ${a.ack?'checked':''} onchange="S.ad.ack=this.checked;render()"><span></span></label></div></div>
     <div class="setrow"><div class="sl"><b>Mandatory reading on publish</b><span>Assign to the visibility audience when published.</span></div><div class="sc" style="min-width:0"><label class="sw"><input type="checkbox" ${a.mand?'checked':''} ${a.ack?'':'disabled'} onchange="S.ad.mand=this.checked;render()"><span></span></label></div></div>
     ${a.mand?`<div class="fld"><label>Due date</label><input type="date" value="${a.due}" onchange="S.ad.due=this.value"></div><div class="fld mb0"><label>Notification preference</label>${notifChecks('S.ad.notify')}</div>`:''}
     <div class="setrow" style="padding-bottom:0"><div class="sl"><b>Publication status</b><span>${S.settings.kb.approvalRequired?'Approval is required by organisation settings.':'Direct publishing allowed for authorised users.'}</span></div><div class="sc" style="min-width:0">${badge(a.status)}</div></div></div></div>
   </div></div></div>`; };
const notifChecks = path => `<div class="flex" style="gap:16px;flex-wrap:wrap">${[['inapp','In-app'],['email','Email'],['push','Mobile push']].map(([k,l])=>`<label class="chk"><input type="checkbox" ${getPath(path)[k]?'checked':''} onchange="setPath('${path}.${k}',this.checked)">${l}</label>`).join('')}</div>`;
function addAttach(files, key){ const bad=/\.(exe|bat|cmd|sh|js|msi|scr|com|vbs|jar|ps1)$/i; [...files].forEach(f=>{ if(bad.test(f.name)){ toast(`“${esc(f.name)}” rejected – unsupported or unsafe file type`,'err'); return; } if(f.size>25*1024*1024){ toast(`“${esc(f.name)}” exceeds 25 MB – upload failed. Compress the file and try again.`,'err'); return; }
  const type=/pdf$/i.test(f.name)?'pdf':/\.(png|jpe?g|gif|webp)$/i.test(f.name)?'image':/\.(mp4|mov|webm)$/i.test(f.name)?'video':'file'; S[key].att.push({name:f.name,size:(f.size/1024>1024?(f.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(f.size/1024))+' KB'),type}); }); render(); }
function saveArticle(mode){ const a=S.ad; a._err = artValidate(a, mode!=='draft'); if(mode==='draft') delete a._err.vis;
  if(Object.keys(a._err).length){ render(); toast('Please fix the highlighted fields','err'); return; }
  const t=now(); let tgt = a.id? article(a.id) : null;
  if(!tgt){ tgt={id:'KB-'+(1001+S.articles.length),created:t,views:0,revisions:[],rev:0,author:me().name}; S.articles.unshift(tgt); }
  const wasPub = tgt.status==='Published';
  Object.assign(tgt,{title:a.title.trim(),summary:a.summary,content:a.content,cat:a.cat,sub:a.sub,tags:a.tags.slice(),att:a.att.slice(),vis:JSON.parse(JSON.stringify(a.vis)),ack:a.ack,updated:t});
  if(mode==='draft'){ tgt.status='Draft'; logAudit('Saved article draft',tgt.id); toast('Draft saved – not visible to trainees'); }
  if(mode==='submit'){ tgt.status='Pending Approval'; logAudit('Submitted article for approval',tgt.id); notify('ca',`Article "${tgt.title}" is awaiting approval`,'file-check'); toast('Submitted for approval'); }
  if(mode==='publish'){ tgt.status='Published'; tgt.rev=(tgt.rev||0)+1; tgt.published=t; tgt.revisions.push({rev:tgt.rev,at:t,by:me().name,note:wasPub?'Revision published':'Published'}); logAudit(`Published article revision ${tgt.rev}`,tgt.id);
    let msg=`Published revision ${tgt.rev}`;
    if(a.mand && a.ack){ const res=createAssignments({type:'article',item:tgt.id,aud:a.vis,mandatory:true,assignDate:toISO(t),due:a.due,notify:a.notify}); msg+=` · mandatory reading assigned to ${res.ok.length} employees`; }
    toast(msg); }
  S.ad=null; go('tc-article',{id:tgt.id}); }

/* ---------- Rich text editor ---------- */
function rte(id, html, bind){ const b=(cmd,arg,icn,t)=>`<button type="button" title="${t}" onmousedown="event.preventDefault();rteCmd('${id}','${cmd}','${arg||''}')">${icn.startsWith('<')?icn:ic(icn)}</button>`;
  return `<div class="rte"><div class="rte-tb">${b('formatBlock','h2','heading-2','Heading')}${b('formatBlock','h3','heading-3','Subheading')}${b('formatBlock','p','pilcrow','Paragraph')}<span class="sep"></span>${b('bold','','bold','Bold')}${b('italic','','italic','Italic')}${b('underline','','underline','Underline')}<span class="sep"></span>${b('insertUnorderedList','','list','Bulleted list')}${b('insertOrderedList','','list-ordered','Numbered list')}<span class="sep"></span>
   <button type="button" title="Link" onmousedown="event.preventDefault();rteLink('${id}')">${ic('link')}</button><button type="button" title="Table" onmousedown="event.preventDefault();rteCmd('${id}','insertHTML','__table')">${ic('table')}</button>
   <label title="Image" style="display:inline-flex"><button type="button" onmousedown="event.preventDefault();rteSave();this.nextElementSibling.click()">${ic('image')}</button><input type="file" accept="image/*" hidden onchange="rteImage('${id}',this.files[0])"></label>
   <button type="button" title="Video" onmousedown="event.preventDefault();rteSave();rteMedia('${id}','video')">${ic('video')}</button><button type="button" title="PDF / file" onmousedown="event.preventDefault();rteSave();rteMedia('${id}','file')">${ic('paperclip')}</button>
   <span class="sep"></span>${b('undo','','undo-2','Undo')}${b('redo','','redo-2','Redo')}</div>
   <div class="rte-ed prose" id="${id}" contenteditable="true" oninput="${bind}=this.innerHTML">${html||''}</div></div>`; }
let RANGE=null; function rteSave(){ const s=window.getSelection(); if(s.rangeCount) RANGE=s.getRangeAt(0); }
function rteRestore(id){ const el=document.getElementById(id); el.focus(); if(RANGE && el.contains(RANGE.startContainer)){ const s=window.getSelection(); s.removeAllRanges(); s.addRange(RANGE);} }
function rteCmd(id,cmd,arg){ const el=document.getElementById(id); el.focus(); if(arg==='__table') arg='<table><tr><th>Column 1</th><th>Column 2</th><th>Column 3</th></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></table><p></p>'; try{ document.execCommand(cmd,false,arg||null);}catch(e){} el.dispatchEvent(new Event('input')); }
function rteLink(id){ rteSave(); S._lk={url:'https://',id}; openModal({title:'Insert link',size:'sm',body:()=>`<div class="fld"><label>URL</label><input type="text" value="${esc(S._lk.url)}" oninput="S._lk.url=this.value"></div>`,foot:()=>`<button class="btn" onclick="S.modal=null;render()">Cancel</button><button class="btn pri" onclick="const u=S._lk.url;S.modal=null;render();setTimeout(()=>{rteRestore('${id}');document.execCommand('createLink',false,u);document.getElementById('${id}').dispatchEvent(new Event('input'))},30)">Insert</button>`}); }
function rteImage(id,f){ if(!f) return; const r=new FileReader(); r.onload=()=>{ rteRestore(id); document.execCommand('insertHTML',false,`<img src="${r.result}" alt="${esc(f.name)}">`); document.getElementById(id).dispatchEvent(new Event('input')); }; r.readAsDataURL(f); }
function rteMedia(id,kind){ S._md={name:kind==='video'?'Training video.mp4':'Procedure.pdf'}; openModal({title:kind==='video'?'Embed video':'Embed PDF / file',size:'sm',body:()=>`<div class="fld"><label>${kind==='video'?'Video URL or uploaded file name':'File name'}</label><input type="text" value="${esc(S._md.name)}" oninput="S._md.name=this.value"><div class="hint">In production files are uploaded to secure storage and streamed to authorised users only.</div></div>`,
  foot:()=>`<button class="btn" onclick="S.modal=null;render()">Cancel</button><button class="btn pri" onclick="const n=S._md.name;S.modal=null;render();setTimeout(()=>{rteRestore('${id}');document.execCommand('insertHTML',false,'<div class=&quot;media-ph&quot; contenteditable=&quot;false&quot;>${kind==='video'?'▶ Video':'📄 File'}: '+n.replace(/</g,'')+'</div><p></p>');document.getElementById('${id}').dispatchEvent(new Event('input'))},30)">Embed</button>`}); }
</script>
<script>
/* ===================== QUESTIONS & ANSWERS (shared admin / trainee) ===================== */
function qaVisibleList(){ if(S.role==='emp') return S.qa.filter(q=>(!q.hidden && canSeeQ(q,meEmp())) || q.by===meEmp());
  if(S.role==='sup') return S.qa.filter(q=>!q.hidden && (canSeeQ(q,meEmp()) || inScope(q.by)) || can('qaModerate'));
  return S.qa; }
function qaListPage(learner){
  const pg='qa'; const f=F(pg); const tab=f.tab||'all'; const mine = S.role==='emp'? meEmp() : S.users[S.role].emp;
  let rows = qaVisibleList();
  const reported = S.qa.filter(q=>q.reports.length);
  if(tab==='mine') rows=rows.filter(q=>q.by===mine);
  if(tab==='rep') rows=reported;
  rows = rows.filter(q=>match(f.q,q.title,q.desc,...q.answers.map(a=>a.text)) && (!f.cat||q.cat===f.cat) && (!f.st||q.status===f.st) && (!f.d||q.at>=addDays(now(),-(+f.d))) && (!f.team||emp(q.by)?.team===f.team) && (!f.dept||emp(q.by)?.dept===f.dept) && (!f.site||emp(q.by)?.site===f.site));
  const r = learner? 'l-question':'tc-question';
  return `<div class="pg">${pageHead('Questions & Answers','Ask colleagues and experts, and find answers already shared across '+esc(S.ORG.name)+'.',`<button class="btn pri" onclick="askQuestion()">${ic('message-circle-plus')}Ask a Question</button>`)}
  <div class="tabs"><span class="tb ${tab==='all'?'on':''}" onclick="setF('qa','tab','all')">All questions</span><span class="tb ${tab==='mine'?'on':''}" onclick="setF('qa','tab','mine')">My questions <span class="cnt">${S.qa.filter(q=>q.by===mine).length}</span></span>${can('qaModerate')?`<span class="tb ${tab==='rep'?'on':''}" onclick="setF('qa','tab','rep')">${ic('flag')}Reported content <span class="cnt">${reported.length}</span></span>`:''}</div>
  <div class="card"><div class="fbar">${fsrch('qa','Search questions and answers…')}${fsel('qa','cat','All categories',S.qaCats)}${fsel('qa','st','All statuses',['Open','Answered','Resolved','Closed'])}${fsel('qa','d','Any date',[['7','Last 7 days'],['30','Last 30 days'],['90','Last 90 days']])}${learner?'':fsel('qa','team','All teams',optTeams())+fsel('qa','dept','All departments',S.depts)+fsel('qa','site','All locations',optSites())}</div>
  ${table('qa-list',[{k:'title',label:'Question',f:q=>`<b style="font-weight:500">${esc(q.title)}</b>${q.hidden?' '+badge('Hidden'):''}${q.reports.length&&can('qaModerate')?` <span class="bd b-red nodot">${ic('flag')} ${q.reports.length}</span>`:''}<div class="small muted">${esc(q.desc).slice(0,80)}${q.desc.length>80?'…':''}</div>`,sv:q=>q.title},
   {k:'cat',label:'Category',f:q=>`<span class="tag">${esc(q.cat)}</span>`},{k:'by',label:'Asked by',f:q=>empCell(q.by,!learner),sv:q=>empName(q.by)},{k:'at',label:'Created',f:q=>fD(q.at)},{k:'n',label:'Answers',f:q=>`<span class="flex">${ic('message-circle')}${q.answers.filter(a=>!a.hidden).length}</span>`,sv:q=>q.answers.length},
   {k:'status',label:'Status',f:q=>badge(q.status)},{k:'acc',label:'Accepted',ns:1,f:q=>q.answers.some(a=>a.accepted)?`<span class="yes" title="Has accepted answer">${ic('circle-check')}</span>`:`<span class="no">${ic('minus')}</span>`},{k:'vis',label:'Visibility',f:q=>`<span class="small">${q.vis.all?'All employees':esc(audLabel(q.vis))}</span>`,sv:q=>audLabel(q.vis)}],
   rows,{click:q=>`go('${r}',{id:'${q.id}'})`,sort:'at',dir:-1,empty:tab==='mine'?'You have not asked any questions yet.':'No questions match your search.'})}</div></div>`; }
PAGES['tc-qa'] = () => qaListPage(false);
PAGES['l-qa'] = () => qaListPage(true);
function askQuestion(){ S.qd={title:'',desc:'',cat:'',vis:{all:true,targets:[]},err:{}}; openModal({title:'Ask a Question',size:'lg',icon:'message-circle-plus',body:()=>{ const d=S.qd,e=d.err; return `
  <div class="fld ${e.title?'inv':''}"><label>Question title <span class="rq">*</span></label><input type="text" value="${esc(d.title)}" oninput="S.qd.title=this.value" placeholder="Summarise your question in one line">${e.title?`<div class="err">${e.title}</div>`:''}</div>
  <div class="fld ${e.desc?'inv':''}"><label>Description <span class="rq">*</span></label><textarea rows="4" oninput="S.qd.desc=this.value" placeholder="Add details: site, equipment, what you have tried…">${esc(d.desc)}</textarea>${e.desc?`<div class="err">${e.desc}</div>`:''}</div>
  <div class="fld ${e.cat?'inv':''}"><label>Category <span class="rq">*</span></label><select onchange="S.qd.cat=this.value"><option value="">Select category</option>${S.qaCats.map(c=>`<option ${d.cat===c?'selected':''}>${c}</option>`).join('')}</select>${e.cat?`<div class="err">${e.cat}</div>`:''}</div>
  <div class="fld"><label>Audience / visibility <span class="rq">*</span></label>${audPicker('S.qd.vis',{kinds:['dept','team','site']})}</div>`; },
  foot:()=>`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="submitQuestion()">${ic('send')}Submit Question</button>`}); }
function submitQuestion(){ const d=S.qd; d.err={}; if(!d.title.trim()) d.err.title='Question title is required'; if(!d.desc.trim()) d.err.desc='Description is required'; if(!d.cat) d.err.cat='Category is required'; if(!d.vis.all&&!d.vis.targets.length) toast('Select an audience','err');
  if(Object.keys(d.err).length || (!d.vis.all&&!d.vis.targets.length)){ render(); return; }
  const by = S.role==='emp'? meEmp() : (S.users[S.role].emp || S.role.toUpperCase());
  const q={id:'QA-'+(501+S.qa.length),title:d.title.trim(),desc:d.desc.trim(),cat:d.cat,by,at:now(),status:'Open',vis:JSON.parse(JSON.stringify(d.vis)),answers:[],reports:[],hidden:false}; S.qa.unshift(q); S.modal=null;
  toast('Question posted – you will be notified when someone answers'); go(S.role==='emp'?'l-question':'tc-question',{id:q.id}); }
function qPage(p, trainee){ const q=S.qa.find(x=>x.id===p.id); if(!q) return denied('view this question');
  const meId = S.role==='emp'? meEmp() : (S.users[S.role].emp || S.role.toUpperCase());
  if(S.role==='emp' && !canSeeQ(q,meId)) return denied('view this restricted discussion');
  const mod=can('qaModerate'), owner=q.by===meId; const canAcc = mod||owner;
  const ans=q.answers.filter(a=>!a.hidden||mod);
  const sorted=ans.slice().sort((a,b)=>(b.accepted?1:0)-(a.accepted?1:0)||a.at-b.at);
  return `<div class="pg">${pageHead(esc(q.title),`${badge(q.status)} · <span class="tag">${esc(q.cat)}</span> · Asked by ${esc(empName(q.by))} on ${fD(q.at)} · Visible to ${esc(audLabel(q.vis))}`,
   `${mod&&q.status!=='Closed'?`<button class="btn" onclick="qaClose('${q.id}',true)">${ic('lock')}Close question</button>`:''}${mod&&q.status==='Closed'?`<button class="btn" onclick="qaClose('${q.id}',false)">${ic('lock-open')}Reopen</button>`:''}${mod?`<button class="btn ${q.hidden?'':'dng'}" onclick="qaHide('${q.id}',null)">${ic(q.hidden?'eye':'eye-off')}${q.hidden?'Unhide':'Hide'} question</button>`:''}<button class="btn gh" onclick="qaReport('${q.id}',null)">${ic('flag')}Report</button>`, crumbs(['Questions & Answers',learner?'l-qa':'tc-qa'],[q.id]))}
  ${q.hidden?note('err','This question is hidden by a moderator and is not visible to employees.'):''}
  ${q.reports.length&&mod?note('warn',`<b>${q.reports.length} report(s):</b> ${q.reports.map(r=>`${esc(empName(r.by))} – “${esc(r.reason)}” (${fD(r.at)})`).join('; ')} <a onclick="S.qa.find(x=>x.id==='${q.id}').reports=[];logAudit('Dismissed Q&A reports','${q.id}');toast('Reports reviewed and dismissed');render()">Dismiss reports</a>`):''}
  <div class="card" style="margin-bottom:16px"><div class="card-b" style="display:flex;gap:14px">${av(q.by)}<div style="flex:1"><div class="b">${esc(empName(q.by))}</div><div class="small muted">${fDT(q.at)}</div><p style="line-height:1.6;margin:10px 0 0">${esc(q.desc)}</p></div></div></div>
  <h3 style="font-size:15px;margin:22px 0 10px">${ans.length} Answer${ans.length===1?'':'s'}</h3>
  ${sorted.map(a=>`<div class="card" style="margin-bottom:10px;${a.accepted?'border-color:#9bd8b2;background:#f7fdf9':''}"><div class="card-b" style="display:flex;gap:14px">${av(a.by)}<div style="flex:1"><div class="flex"><b>${esc(empName(a.by))}</b><span class="small muted">${fDT(a.at)}</span>${a.accepted?`<span class="bd b-green">${ic('circle-check')} Accepted answer</span>`:''}${a.hidden?badge('Hidden'):''}<span class="sp"></span>
   ${canAcc&&!a.hidden&&q.status!=='Closed'?`<button class="btn xs ${a.accepted?'':'pri'}" onclick="qaAccept('${q.id}','${a.id}')">${ic(a.accepted?'x':'check')}${a.accepted?'Unaccept':'Accept answer'}</button>`:''}
   <details class="dd"><summary class="icb">${ic('ellipsis')}</summary><div class="ddm"><a onclick="qaReport('${q.id}','${a.id}')">${ic('flag')}Report inappropriate</a>${mod?`<a class="dng" onclick="qaHide('${q.id}','${a.id}')">${ic(a.hidden?'eye':'eye-off')}${a.hidden?'Unhide':'Hide'} answer</a>`:''}</div></details></div>
   <p style="line-height:1.6;margin:8px 0 0">${esc(a.text)}</p>${q.reports.some(r=>r.target===a.id)&&mod?`<div class="small dn" style="margin-top:6px">${ic('flag')} Reported</div>`:''}</div></div></div>`).join('') || `<div class="card"><div class="empty-st">${ic('message-circle')}<div>No answers yet – be the first to help.</div></div></div>`}
  <div class="card mt"><div class="card-h"><h3>Your answer</h3></div><div class="card-b">${q.status==='Closed'?note('grey','This question is closed. New answers are disabled unless a moderator reopens it.','lock'):`<textarea id="ansbox" rows="4" style="width:100%" placeholder="Share what you know…" oninput="S._ans=this.value">${esc(S._ans||'')}</textarea><div class="flex" style="margin-top:10px"><span class="small muted">${ic('bell')} ${esc(empName(q.by))} will be notified of your answer.</span><span class="sp"></span><button class="btn pri" onclick="qaAnswer('${q.id}')">${ic('send')}Submit answer</button></div>`}</div></div></div>`; }

PAGES['l-question'] = p => qPage(p,true);
function qaRecalc(q){ if(q.status==='Closed') return; const vis=q.answers.filter(a=>!a.hidden); q.status = vis.some(a=>a.accepted)?'Resolved': vis.length?'Answered':'Open'; }
function qaAnswer(id){ const q=S.qa.find(x=>x.id===id); const t=(S._ans||'').trim(); if(!t){ toast('Answer cannot be empty','err'); return; } if(q.status==='Closed'){ toast('Question is closed','err'); return; }
  const by = S.role==='emp'? meEmp() : (S.users[S.role].emp || S.role.toUpperCase());
  q.answers.push({id:'AN-'+(S.seq++ + 100),by,at:now(),text:t,accepted:false,hidden:false}); qaRecalc(q); S._ans='';
  if(q.by!==by){ notify(q.by.startsWith('E')?q.by:q.by.toLowerCase(),`${empName(by)} answered your question "${q.title}"`,'message-circle'); toast(`Answer posted · ${esc(empName(q.by))} notified (in-app, email, push)`); } else toast('Answer posted'); render(); }
function qaAccept(qid,aid){ const q=S.qa.find(x=>x.id===qid); const a=q.answers.find(x=>x.id===aid); const was=a.accepted; q.answers.forEach(x=>x.accepted=false); a.accepted=!was; qaRecalc(q); logAudit(was?'Unaccepted answer':'Accepted answer',qid); toast(was?'Accepted answer removed':'Marked as the accepted answer – only one answer can be accepted'); render(); }
function qaClose(id,close){ const q=S.qa.find(x=>x.id===id); if(close){ confirmDlg({title:'Close question?',msg:'Closing prevents new answers until an authorised user reopens it.',ok:'Close question',onOk:()=>{ q.status='Closed'; logAudit('Closed question',id); S.modal=null; toast('Question closed'); render(); }}); } else { q.status='Open'; qaRecalc(q); logAudit('Reopened question',id); toast('Question reopened'); render(); } }
function qaHide(qid,aid){ closeDD(); const q=S.qa.find(x=>x.id===qid); const t=aid? q.answers.find(a=>a.id===aid):q; t.hidden=!t.hidden; qaRecalc(q); logAudit(`${t.hidden?'Hid':'Unhid'} ${aid?'answer':'question'}`,aid||qid); toast(`${aid?'Answer':'Question'} ${t.hidden?'hidden from employees':'visible again'} · action logged`); render(); }
function qaReport(qid,aid){ closeDD(); S._rep={reason:'Inappropriate or offensive'}; openModal({title:'Report content',size:'sm',icon:'flag',body:()=>`<div class="fld"><label>Reason</label><select onchange="S._rep.reason=this.value">${['Inappropriate or offensive','Off-topic','Shares personal or confidential information','Incorrect / unsafe advice','Spam'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="small muted">Moderators will review this report. Your identity is visible to moderators only.</div>`,
  foot:()=>`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="S.qa.find(x=>x.id==='${qid}').reports.push({target:${aid?`'${aid}'`:'null'},by:${S.role==='emp'?`'${meEmp()}'`:`'${S.users[S.role].emp||'E002'}'`},reason:S._rep.reason,at:now()});notify('tm','Content reported in Q&A','flag');S.modal=null;toast('Thanks – reported to moderators');render()">Submit report</button>`}); }

const enrolls = cid => S.assignments.filter(a=>a.type==='course'&&a.item===cid);
/* ---------- Assign course to people, teams, departments, job roles or job sites ---------- */
const ASN_T=[['people','People','user'],['team','Teams','users'],['dept','Departments','building-2'],['role','Job roles','briefcase'],['site','Job sites','map-pin']];
const asnPool = () => S.emps.filter(e=>e.status==='Active'&&!e.syncError&&inScope(e.id));
/* eligibility of one employee for this course: 'new' (never taken), 'ref' (completed before), null (currently enrolled – not offered) */
function asnElig(cid,id){ const en=S.assignments.filter(a=>a.type==='course'&&a.item===cid&&a.emp===id); if(en.some(a=>!a.completedAt)) return null; return en.length?'ref':'new'; }
function asnLastDone(cid,id){ const d=S.assignments.filter(a=>a.type==='course'&&a.item===cid&&a.emp===id&&a.completedAt).map(a=>a.completedAt).sort((x,y)=>y-x)[0]; return d; }
/* v2.00: the same Assign window serves courses and assessments (S.asn.kind) */
const asnK = () => !!(S.asn&&S.asn.kind==='assess');
const AL = (c,a) => asnK()?a:c;
function asmLastPass(aid,id){ return S.attempts.filter(t=>t.emp===id&&t.aid===aid&&t.passed&&!t.practice).map(t=>t.submittedAt).sort((x,y)=>y-x)[0]; }
/* assessment eligibility: null = already assigned and not passed yet, 'ref' = passed before, 'new' = never passed */
function asmElig(aid,id){ if(!aid) return 'new'; const lp=asmLastPass(aid,id);
  const open=S.asmAsg.some(r=>r.aid===aid&&r.emp===id&&!(lp&&lp>=r.assigned)) || S.assignments.some(a=>a.type==='course'&&!a.completedAt&&a.emp===id&&course(a.item)?.assessment?.id===aid);
  return open?null:(lp?'ref':'new'); }
const asnE = id => asnK()? asmElig(S.asn.cid,id) : asnElig(S.asn.cid,id);
const asnLD = id => asnK()? asmLastPass(S.asn.cid,id) : asnLastDone(S.asn.cid,id);
function asnCur(id){ if(!asnK()){ const cur=S.assignments.find(a=>a.type==='course'&&a.item===S.asn.cid&&a.emp===id&&!a.completedAt); const pr=Math.round(aProgress(cur)); return {b:badge(learnStatus(cur)),t:`${pr>=100?'Content done · assessment pending':pr+'% done'} · ${cur.source==='assigned'?'assigned by '+esc(cur.by):'self-enrolled'} ${fD(cur.assigned)}`}; }
  const aid=S.asn.cid, r=S.asmAsg.filter(x=>x.aid===aid&&x.emp===id).sort((x,y)=>y.assigned-x.assigned)[0], viaC=!r&&S.assignments.find(a=>a.type==='course'&&!a.completedAt&&a.emp===id&&course(a.item)?.assessment?.id===aid);
  const att=S.attempts.filter(t=>t.emp===id&&t.aid===aid&&!t.practice&&(!r||t.startedAt>=r.assigned)); const open=att.find(t=>t.status==='In Progress'); const used=att.filter(t=>t.status!=='In Progress').length;
  return {b:badge(open?'In Progress':used?'Failed':'Not Started'),t:`${used?used+' attempt'+(used>1?'s':'')+' used · ':''}${r?'assigned by '+esc(r.by)+' '+fD(r.assigned):'via course '+esc(viaC?course(viaC.item).title:'')}`}; }
function asnGroups(t){ const A=asnPool();
  if(t==='people'){ const w=S.asn, pk=w.pk||'fw', pf=(w.pf||{})[pk]||{}; const cats=Object.keys(pf.cat||{}), dps=Object.keys(pf.dept||{});
    return A.filter(e=>(e.kind==='bo'?'bo':'fw')===pk&&(!cats.length||cats.includes(e.role))&&(pk==='bo'||!dps.length||dps.includes(e.dept))).map(e=>({k:e.id,l:e.name,s:e.kind==='bo'?`${e.role} · Back office`:`${e.role} · ${e.dept} · ${(S.teams.find(x=>x.id===e.team)||{}).name||''}`,ids:[e.id]})); }
  if(t==='team') return S.teams.map(x=>({k:x.id,l:x.name,s:x.dept,ids:A.filter(e=>e.team===x.id).map(e=>e.id)}));
  if(t==='dept') return S.depts.map(d=>({k:d,l:d,s:'Department',ids:A.filter(e=>e.dept===d).map(e=>e.id)}));
  if(t==='role') return S.jobRoles.map(r=>({k:r,l:r,s:'Job role',ids:A.filter(e=>e.role===r).map(e=>e.id)}));
  return S.sites.map(x=>({k:x.id,l:x.name,s:'Job site',ids:A.filter(e=>e.site===x.id).map(e=>e.id)})); }
/* Individually picked people are always assigned (a completed person picked by name = re-assign).
   Members of selected groups who completed the course before are included only when "include re-assign" is on. */
function asnResolve(){ const w=S.asn, cid=w.cid, picked=new Set(Object.keys(w.sel.people)), grp=new Set();
  ASN_T.slice(1).forEach(([t])=>{ const G=asnGroups(t); Object.keys(w.sel[t]).forEach(k=>{ const g=G.find(x=>x.k===k); if(g) g.ids.forEach(i=>grp.add(i)); }); });
  const nw=[], ref=[], refOut=[], enr=[]; new Set([...picked,...grp]).forEach(id=>{ const e=asnE(id); if(!e){ enr.push(id); return; } if(e==='new') nw.push(id); else if(picked.has(id)||w.reassign) ref.push(id); else refOut.push(id); });
  return {nw,ref,refOut,enr,add:[...nw,...ref],grpRef:[...grp].filter(id=>asnE(id)==='ref'&&!picked.has(id)).length}; }
function assignCourse(cid){ closeDD&&closeDD(); const c=course(cid); if(!c||c.status!=='Published'){ toast('Only published courses can be assigned','err'); return; }
  S.asn={cid,t:'people',sel:{people:{},team:{},dept:{},role:{},site:{}},reassign:false,open:{},n:{...S.settings.notif},msg:''};
  openModal({title:`Assign Course <span class="asnsub">${esc(c.title)}</span>`,size:'drawer',body:asnForm,foot:asnFoot2}); }
function asnRow(g){ const w=S.asn, on=!!w.sel[w.t][g.k]; let right='', dis=false;
  if(w.t==='people'){ const el=asnE(g.k);
    if(!el){ dis=true; const cu=asnCur(g.k); right=`<span class="asnpst">${cu.b}<span class="small muted">${cu.t}</span></span>`; }
    else { const d=asnLD(g.k); right=d?`<span class="asnpst"><span class="bd b-green nodot">${AL('Completed','Passed')}</span><span class="small muted">${fD(d)}</span></span>`:`<span class="asnpst"><span class="bd b-grey nodot">Not taken</span></span>`; } }
  else { const el=g.ids.map(i=>asnE(i)); const nn=el.filter(x=>x==='new').length, rr=el.filter(x=>x==='ref').length, ee=el.filter(x=>!x).length; dis=!(nn+rr);
    right= !g.ids.length?'<span class="small muted nowrap">No employees</span>':`<span class="asncnt">${[nn?`<b>${nn}</b> new`:'',rr?`<span class="muted">${rr} ${AL('completed','passed')} before</span>`:'',ee?`<span class="asnenr">${ee} already ${AL('enrolled','assigned')}</span>`:''].filter(Boolean).join('<span class="muted"> · </span>')}</span>`; }
  const lead = w.t==='people'? av(g.k) : `<span class="asnic">${ic(ASN_T.find(x=>x[0]===w.t)[2])}</span>`;
  return `<label class="asnrow ${on?'on':''} ${dis?'dis':''}" data-q="${esc((g.l+' '+g.s).toLowerCase())}"><input type="checkbox" ${on?'checked':''} ${dis?'disabled':''} onchange="asnTog('${w.t}','${g.k}')">${lead}<div class="asnrt"><div class="asnrn">${esc(g.l)}</div><div class="small muted">${esc(g.s)}</div></div>${right}</label>`; }
function asnBody(){ const w=S.asn, c=course(w.cid); let G=asnGroups(w.t); const r=asnResolve(); if(!r.grpRef&&w.reassign) w.reassign=false;
  let list;
  if(w.t==='people'){ G.sort((a,b)=>a.l.localeCompare(b.l)); const A=G.filter(g=>asnE(g.k)==='new'), B=G.filter(g=>asnE(g.k)==='ref'), Cc=G.filter(g=>!asnE(g.k));
    list = (A.length?`<div class="asngh">Not taken yet <span>${A.length}</span></div>${A.map(asnRow).join('')}`:'') + (B.length?`<div class="asngh">${AL('Completed','Passed')} before – re-assign <span>${B.length}</span></div>${B.map(asnRow).join('')}`:'') + (Cc.length?`<div class="asngh">${AL('Already enrolled','Already assigned – not passed yet')} – cannot be assigned again <span>${Cc.length}</span></div>${Cc.map(asnRow).join('')}`:''); }
  else list = G.map(asnRow).join('');
  const chips=ASN_T.flatMap(([t])=>Object.keys(w.sel[t]).map(k=>{ const g=t==='people'?(e=>e&&{l:e.name})(emp(k)):asnGroups(t).find(x=>x.k===k); return g?`<span class="asnchip">${ic(ASN_T.find(x=>x[0]===t)[2])}${esc(g.l)}<span class="x" onclick="asnTog('${t}','${k}')">${ic('x')}</span></span>`:''; })).join('');
  const nSel=ASN_T.reduce((s,[t])=>s+Object.keys(w.sel[t]).length,0);
  return `<div class="asnwrap">
  <section class="asnl"><div class="asnst">1 · Choose trainees</div>
   <div class="asnseg">${ASN_T.map(([t,l,i])=>{ const n=Object.keys(w.sel[t]).length; return `<span class="${w.t===t?'on':''}" onclick="S.asn.t='${t}';render()">${ic(i)}${l}${n?`<em>${n}</em>`:''}</span>`; }).join('')}</div>
   ${w.t==='people'?asnPeopleBar():''}<div class="asntool"><div class="srch" style="flex:1">${ic('search')}<input type="search" id="asnq" placeholder="Search ${ASN_T.find(x=>x[0]===w.t)[1].toLowerCase()}…" oninput="asnFilter(this.value)"></div><a class="small" onclick="asnAll(1)">Select all</a><span class="muted">·</span><a class="small" onclick="asnAll(0)">Clear</a></div>
   <div class="asnlist" id="asnlist">${list||'<div class="empty-st" style="padding:30px">'+ic('users')+`<div>Everyone here already has this ${AL('course','assessment')}.</div></div>`}</div></section>
  <section class="asnr"><div class="asnst">2 · Review & send</div>
   <div class="asnbox"><div class="asnbl">Selected${nSel?`<span class="muted" style="margin-left:5px;font-weight:500">(${nSel})</span>`:''}${nSel?`<a class="small" style="margin-left:auto" onclick="S.asn.sel={people:{},team:{},dept:{},role:{},site:{}};render()">Clear all</a>`:''}</div><div class="asnchips">${chips||'<span class="small muted">No people or groups selected yet.</span>'}</div></div>
   <div class="asnbox"><div class="asnbl">Assignment Status</div>
    ${asnLine('nw',AL('New to this course','New to this assessment'),r.nw)}
    ${asnLine('ref','Re-assigned',r.ref)}
    <div class="asnln tot"><span>Total</span><b>${r.add.length}</b></div>
    ${r.grpRef?`<div class="asntgw"><label class="asntg"><span class="sw"><input type="checkbox" ${w.reassign?'checked':''} onchange="S.asn.reassign=this.checked;render()"><span></span></span><span>Include ${r.grpRef} group member${r.grpRef===1?'':'s'} who already ${AL('completed this course','passed this assessment')} to re-assign</span></label>${w.reassign?'':`<a class="small asnshow" onclick="S.asn.open.out=!S.asn.open.out;render()">${ic(w.open.out?'chevron-up':'chevron-down')}${w.open.out?'Hide':'Show'} who</a>${w.open.out?asnWho(r.refOut):''}`}</div>`:''}
    ${r.enr.length?`<div class="asnenrw">${asnLine('enr',AL('Already enrolled','Already assigned')+' – not assigned again',r.enr)}</div>`:''}</div>
   <div class="asnbox"><div class="asnbl">Notify trainees</div><div class="asnnt">${[['inapp','In-app','bell'],['email','Email','mail'],['sms','SMS','messages-square'],['push','Push','smartphone']].map(([k,l,i])=>`<label class="${w.n[k]?'on':''}"><input type="checkbox" ${w.n[k]?'checked':''} onchange="S.asn.n.${k}=this.checked;render()">${ic(i)}${l}</label>`).join('')}</div>
    <textarea rows="2" class="asnmsg" oninput="S.asn.msg=this.value" placeholder="Optional message, e.g. Please complete before your next shift.">${esc(w.msg)}</textarea></div>
  </section></div>`; }
function asnPeopleBar(){ const w=S.asn; w.pk=w.pk||'fw'; w.pf=w.pf||{fw:{cat:{},dept:{}},bo:{cat:{}}}; const A=asnPool(); const nfw=A.filter(e=>e.kind!=='bo').length, nbo=A.filter(e=>e.kind==='bo').length;
  const pool=A.filter(e=>(e.kind==='bo'?'bo':'fw')===w.pk); const pf=w.pf[w.pk];

function courseErrors(c){ const e=[]; if(!c.title.trim()) e.push('Course title is required'); if(!c.desc.trim()) e.push('Description is required'); if(!c.cat) e.push('Category is required'); if(!lessonsOf(c).length) e.push('At least one content item is required'); if(lessonsOf(c).some(l=>!l.title.trim())) e.push('Every content item needs a title'); if(c.sections.some(s=>!s.lessons.length)) e.push('Remove empty sections or add content to them'); if(c.assessment && !c.assessment.id) e.push('Select the linked assessment or turn it off'); if(c.assessment && c.assessment.id && assess(c.assessment.id) && assess(c.assessment.id).status!=='Published') e.push('Publish the linked assessment '+c.assessment.id+' first (it was created as a draft)'); return e; }

function saveCourse(mode){ const c=S.cb; if(mode==='publish'){ const err=courseErrors(c); if(err.length){ c._step=4; render(); toast('Cannot publish: '+err[0],'err'); return; } }

  if(tgt.status==='Published'){ toast('Draft changes saved for '+tgt.id+' – trainees continue on revision '+tgt.rev+' until you publish','inf'); S._cbDraft=JSON.parse(JSON.stringify(c)); return; }
  Object.assign(tgt,clean,{status:'Draft',updated:t}); c.id=tgt.id; c._src=tgt.id; S.route.p.id=tgt.id; logAudit('Saved course draft',tgt.id); toast('Draft saved'); render(); }

<script>
/* ===================== LESSON CONTENT & COURSE PLAYER ===================== */
const LESSON_TEXT = {
 'Why Safety Matters':'<h2>Why safety matters</h2><p>Every year, preventable incidents at client sites cause injuries, lost shifts and damaged trust. At Feb Protection, safety is part of the service we deliver – clients rely on us to keep their people and property safe, and that starts with keeping ourselves safe.</p><div class="callout"><b>Remember:</b> you always have the right – and the duty – to stop work that is unsafe.</div><h3>In this course you will learn to</h3><ul><li>spot hazards before they cause harm</li><li>report hazards and near misses correctly</li><li>choose and wear the right PPE</li><li>find emergency contacts at any job site</li></ul>',
 'Reporting Hazards and Near Misses':'<h2>Reporting hazards and near misses</h2><p>A <b>near miss</b> is an event that could have caused injury or damage but did not. Near misses are early warnings and must always be reported.</p><ol><li>Make the area safe if you can do so without risk.</li><li>Inform your supervisor by radio or phone.</li><li>Create an incident report in the EntraField Field Worker App within 30 minutes – add a photo.</li></ol><table><tr><th>Event</th><th>Report?</th><th>Timeline</th></tr><tr><td>Injury</td><td>Yes</td><td>Immediately</td></tr><tr><td>Near miss</td><td>Yes</td><td>Within 30 minutes</td></tr><tr><td>Unsafe condition</td><td>Yes</td><td>Before end of shift</td></tr></table>',
};
function lessonDefault(L){ return LESSON_TEXT[L.title] || `<h2>${esc(L.title)}</h2><p>This content explains the key points of <b>${esc(L.title.toLowerCase())}</b> as they apply to Feb Protection job sites and client premises.</p><ul><li>Understand the procedure and why it exists</li><li>Apply it consistently on every shift</li><li>Ask your supervisor or use Questions &amp; Answers if anything is unclear</li></ul><div class="callout">Tip: you can return to this content at any time from <b>My Courses</b>.</div>`; }
const SLIDES = ['Overview','Key risks','What good looks like','Do’s and don’ts','Summary'];
function lessonView(L, st){ const k=L.type;

  if(k==='video') return videoView(L);

/* ---- Video lessons: full watch required, no skipping ahead, resume from last position ---- */
const durSec = d => { const p=String(d||'5:00').split(':').map(Number); return p.length===2? p[0]*60+p[1] : (p[0]*3600+p[1]*60+p[2]); };
const fmtS = x => { x=Math.max(0,Math.floor(x)); return Math.floor(x/60)+':'+String(x%60).padStart(2,'0'); };
let VT=null;

  const a=myCourseAssign(st.cid); a.vpos=a.vpos||{}; if(!a.vpos[L.id]) a.vpos[L.id]={pos:0,max:a.lessonsDone.includes(L.id)?dur:0}; return a.vpos[L.id]; }

   <div style="margin-top:12px;font-size:13px">${esc(L.title)}</div>${resume?`<div class="vres">Resume from ${fmtS(v.pos)}</div>`:''}
   <div class="vb"><span class="vbi" onclick="vToggle('${L.id}')">${ic(playing?'pause':'play')}</span><span id="vt">${fmtS(v.pos)}</span>
    <div class="vtrack" onclick="vSeek(event,'${L.id}')" title="${pv||full?'Click to jump':'You can move back, but not ahead of what you have watched'}"><i class="vw" id="vmax" style="width:${v.max/dur*100}%"></i><i class="vpb" id="vbar" style="width:${v.pos/dur*100}%"></i></div>
    <span>${fmtS(dur)}</span>${ic('volume-2')}${ic('captions')}${ic('maximize')}</div></div>
   <div class="small ${full?'':'muted'}" style="margin-top:8px">${full?`<span class="yes">${ic('circle-check')} Watched in full</span>`:`${ic('lock')} Watch the full video to complete this content – skipping ahead is not allowed.`}</div>${L.notes?`<p>${esc(L.notes)}</p>`:''}`; }
function vLesson(lid){ return lessonsOf(S.pl._c||course(S.pl.cid)).find(l=>l.id===lid); }
function vPause(noRender){ if(VT){ clearInterval(VT); VT=null; } if(S.vid){ S.vid=null; if(!S.pl?.preview){ const a=S.pl&&myCourseAssign(S.pl.cid); if(a) a.lastActivity=now(); } if(!noRender) render(); } }
function vToggle(lid){ if(S.vid&&S.vid.lid===lid&&VT){ vPause(); return; } vPause(true);
  const L=vLesson(lid), dur=durSec(L.dur), v=vState(L); if(v.pos>=dur) v.pos=0;
  S.vid={lid}; VT=setInterval(()=>{ const v=vState(L); const rate=1; v.pos=Math.min(dur,v.pos+0.25*rate); v.max=Math.max(v.max,v.pos);
   const t=document.getElementById('vt'), b=document.getElementById('vbar'), m=document.getElementById('vmax');
   if(!t){ vPause(true); return; } t.textContent=fmtS(v.pos); b.style.width=(v.pos/dur*100)+'%'; m.style.width=(v.max/dur*100)+'%';
   if(v.pos>=dur){ clearInterval(VT); VT=null; S.vid=null; const done=S.pl.preview? S.pl.done.includes(lid) : myCourseAssign(S.pl.cid).lessonsDone.includes(lid); if(!done) markLesson(lid); else render(); } },250);
  render(); }
function vSeek(e,lid){ const L=vLesson(lid), dur=durSec(L.dur), v=vState(L); const r=e.currentTarget.getBoundingClientRect(); const t=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*dur;
  if(!S.pl.preview && t>v.max+0.5){ toast('You can’t skip ahead – keep watching to unlock the rest of the video','err'); return; }
  v.pos=t; v.max=Math.max(v.max, S.pl.preview?t:v.max); if(!VT) render(); }
afterRender.push(()=>{ if(VT && S.vid && !document.getElementById('vp-'+S.vid.lid)) vPause(true); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden && VT) vPause(); });
/* ---- Document lessons: the trainee must scroll through the whole document before marking it complete ---- */
const DOC_PAGES = L => [
 ['1. Scope and purpose',`<p>This document sets out the procedure, responsibilities and contacts referenced in the content <b>${esc(L.title)}</b>. It applies to every Feb Protection employee working at a client job site, including relief and temporary staff.</p><p>Read every section carefully; your supervisor may ask you to explain it during a site briefing.</p><table class="tbl" style="font-size:12px"><tr><th>Section</th><th>Content</th></tr><tr><td>1</td><td>Scope and purpose</td></tr><tr><td>2</td><td>Responsibilities</td></tr><tr><td>3</td><td>Step-by-step procedure</td></tr><tr><td>4</td><td>Contacts and sign-off</td></tr></table>`],
 ['2. Responsibilities',`<p><b>Field employees</b> follow this procedure on every shift, report deviations to their supervisor and keep their training current.</p><p><b>Supervisors</b> brief new starters on site-specific details, check that the procedure is followed and escalate repeated issues to the Training Manager.</p><p><b>Training Manager</b> keeps this document current and assigns refresher training when the procedure changes.</p>`],
 ['3. Step-by-step procedure',`<ol><li>Confirm the job site and any client-specific instructions at the start of the shift.</li><li>Check the equipment and contact list for the site are available and up to date.</li><li>Follow the procedure in the order shown in the content; do not skip steps.</li><li>Record any incident or deviation in the EntraField Field Worker App before the end of the shift.</li><li>Hand over open items to the next shift in person or by radio.</li></ol><div class="callout">If you are unsure about any step, stop and contact your supervisor before continuing.</div>`],
 ['4. Contacts and sign-off',`<table class="tbl" style="font-size:12px"><tr><th>Role</th><th>When to contact</th></tr><tr><td>Shift supervisor</td><td>Any question about this procedure</td></tr><tr><td>Operations control room</td><td>Incidents, emergencies, out-of-hours</td></tr><tr><td>Training Manager</td><td>Questions about this document or training</td></tr></table><p style="margin-top:18px">By marking this content complete you confirm you have read and understood this document.</p><p class="muted" style="text-align:center;margin-top:24px">— End of document —</p>`]];
function dState(L){ const st=S.pl; if(st.preview){ st.dprev=st.dprev||{}; return st.dprev[L.id]=st.dprev[L.id]||{top:0,max:0}; }
  const a=myCourseAssign(st.cid); a.dpos=a.dpos||{}; if(!a.dpos[L.id]) a.dpos[L.id]={top:0,max:a.lessonsDone.includes(L.id)?1:0}; return a.dpos[L.id]; }
const dRead = L => dState(L).max>=0.995;
function docView(L, rev){ const d=dState(L), pages=DOC_PAGES(L), full=d.max>=0.995;
  return `<div class="docv dscroll" id="dv-${L.id}" onscroll="docScroll(this,'${L.id}')"><div style="width:100%;max-width:620px">${pages.map(([h,b],i)=>`<div class="pgp" style="min-height:0;margin-bottom:16px">${i===0?`<div class="flex" style="margin-bottom:18px">${ic('file-text')}<b>${esc(L.file||L.title+'.pdf')}</b></div><h2 style="margin-top:0;color:var(--blue-d)">${esc(L.title)}</h2><p>Feb Protection · Controlled document · Rev ${rev||1}</p>`:''}<h3 style="margin-top:0">${h}</h3>${b}<div class="small muted" style="text-align:right;margin-top:16px">Page ${i+1} of ${pages.length}</div></div>`).join('')}</div></div>
   <div class="flex small" style="margin-top:8px"><span id="dmsg" class="${full?'yes':'muted'}">${full?`${ic('circle-check')} Read to the end`:`${ic('lock')} Scroll through the whole document to complete this lesson.`}</span><span class="sp"></span><span class="muted" id="dpct">${Math.round(d.max*100)}% read</span></div>`; }

afterRender.push(()=>{ document.querySelectorAll('.dscroll').forEach(el=>{ const L=S.pl&&vLesson(el.id.slice(3)); if(L){ const d=dState(L); if(el.scrollTop!==d.top) el.scrollTop=d.top; } }); });
/* ---- Presentation lessons: the trainee must reach the last slide before marking it complete ---- */
function pState(L){ const st=S.pl, n=L.slides||4; if(st.preview){ st.sprev=st.sprev||{}; return st.sprev[L.id]=st.sprev[L.id]||{cur:0,max:0}; }
  const a=myCourseAssign(st.cid); a.spos=a.spos||{}; if(!a.spos[L.id]) a.spos[L.id]={cur:0,max:a.lessonsDone.includes(L.id)?n-1:0}; return a.spos[L.id]; }
const pSeen = L => pState(L).max>=(L.slides||4)-1;
function slideView(L){ const n=L.slides||4, p=pState(L), i=Math.min(p.cur,n-1), full=p.max>=n-1;

function playerPage(c, a, preview){

  const pctv = ls.length? done.length/ls.length*100 : 0; const as=c.assessment&&c.assessment.id?assess(c.assessment.id):null;
  const passed = a && as? S.attempts.some(t=>t.emp===a.emp&&t.aid===as.id&&t.passed&&!t.practice&&t.submittedAt>=a.assigned) : false;

  let main;

  else { const isDone=done.includes(L.id);
   main = `<div class="small muted">Content ${st.idx+1} of ${ls.length} · ${LTYPE[L.type][0]} · ${L.mins} min</div><h2 style="margin:6px 0 18px;font-size:22px">${esc(L.title)}</h2><div style="flex:1">${lessonView(L,{...st,rev:a?.rev})}</div>

    ${isDone?`<span class="bd b-green">${ic('check')} Completed</span>`:((L.type==='video'&&!vWatched(L))||(L.type==='document'&&!preview&&!dRead(L))||(L.type==='presentation'&&!preview&&!pSeen(L))?`<button class="btn pri" disabled title="${L.type==='video'?'Watch the full video':L.type==='document'?'Scroll through the whole document':'View every slide'} to complete this content">${ic('circle-check')}Mark as Complete</button>`:`<button class="btn pri" onclick="markLesson('${L.id}')">${ic('circle-check')}Mark as Complete</button>`)}
    <button class="btn" ${st.idx>=ls.length-1&&!as?'disabled':''} onclick="${st.idx>=ls.length-1?'S.pl.idx=-1':'S.pl.idx++'};S.pl.vp=0;S.pl.ap=0;S.pl.sl=0;render()">${st.idx>=ls.length-1?'Go to assessment':'Next Content'}${ic('arrow-right')}</button></div>`; }
  const statusLine = preview? badge('Preview',1) : `${badge(learnStatus(a))} <span class="small muted">Enrolled ${fD(a.assigned)} · revision ${a.rev}</span>`;
  const incomplete = !preview && pctv>=100 && !a.completedAt && c.assessment?.required;
  return `<div class="pg">${pageHead(esc(c.title),`${statusLine}`, preview? `<button class="btn" onclick="go(${c.id==='__draft'?"'tc-course-edit',{id:S.cb._src}":`'tc-course',{id:'${c.id}'}`})">${ic('x')}Exit preview</button>`:`<button class="btn" onclick="go('my-courses')">${ic('arrow-left')}My Courses</button>`, preview?crumbs(['Courses','tc-courses'],['Preview']):crumbs(['My Courses','my-courses'],[c.title]))}
   ${preview?note('info','Preview mode – nothing is recorded for any trainee.'):''}
   ${a&&a.completedAt?note('ok',`You completed this course on ${fD(a.completedAt)}.`):''}
   ${incomplete?note('warn',`All content is complete (100% content progress) but the course is <b>not complete</b> until you pass <b>${esc(as.title)}</b>.`):''}

function markLesson(lid){ const st=S.pl; const LL=vLesson(lid); if(LL&&LL.type==='video'&&!vWatched(LL)){ toast('Watch the full video to complete this content','err'); return; } if(LL&&LL.type==='presentation'&&!st.preview&&!pSeen(LL)){ toast('View every slide up to the last one to complete this content','err'); return; } if(LL&&LL.type==='document'&&!st.preview&&!dRead(LL)){ toast('Scroll through the whole document to complete this content','err'); return; } if(st.preview){ if(!st.done.includes(lid)) st.done.push(lid); toast('Content marked complete (preview)','inf'); render(); return; }
  const a=myCourseAssign(st.cid); if(!a.lessonsDone.includes(lid)) a.lessonsDone.push(lid); a.lastActivity=now(); const c=course(st.cid);
  toast('Content completed · progress saved – you can resume on any device'); evalCourseCompletion(a);
  const ls=lessonsOf(c); if(st.idx<ls.length-1){ st.idx++; st.vp=0; st.ap=0; st.sl=0; } render(); }
function evalCourseCompletion(a){ if(a.completedAt) return; const c=course(a.item); const ls=lessonsOf(c); if(!ls.every(l=>a.lessonsDone.includes(l.id))) return;
  let qa=null; if(c.assessment?.required){ const p=S.attempts.filter(t=>t.emp===a.emp&&t.aid===c.assessment.id&&t.passed&&!t.practice&&t.submittedAt>=a.assigned).sort((x,y)=>x.submittedAt-y.submittedAt)[0]; if(!p) return; qa=p.id; }
  a.completedAt=now(); a.qa=qa; a.lastActivity=now(); notify(a.emp,`Course completed: ${c.title}`,'circle-check-big');
  toast(`🎓 Course completed: <b>${esc(c.title)}</b>`); const def=S.certDefs.find(d=>d.course===c.id&&d.status==='Active'); if(def) issueCertificate(def,a,true); }
function issueCertificate(def, a, auto){ // idempotent issuance for the same qualifying completion
  const steps=[]; steps.push(['Trainee completed required course',!!a.completedAt]);
  const c=course(def.course); let assessOK=true; if(def.reqAssessment && c.assessment){ assessOK = !!a.qa && S.attempts.find(t=>t.id===a.qa)?.passed; } steps.push(['Required assessment result validated',assessOK]);
  const eligible = !!a.completedAt && assessOK; steps.push(['Eligibility confirmed',eligible]);
  const dup = S.certs.find(x=>x.ref===a.id && x.def===def.id); steps.push(['No existing certificate for this qualifying completion',!dup]);
  let cert=null; if(eligible && !dup){ const t=a.completedAt; cert={id:`FP-${def.code}-${t.getFullYear()}-${String(200+S.certs.length).padStart(5,'0')}`,def:def.id,emp:a.emp,issued:now(),expires:def.validity?addMonths(now(),def.validity):null,revoked:null,ref:a.id}; S.certs.push(cert); notify(a.emp,`Certificate issued: ${def.name}`,'award'); logAudit('Issued certificate (automatic)',cert.id); if(auto) toast(`🏅 Certificate issued: <b>${esc(def.name)}</b> – available in My Certificates`); }
  steps.push(['Certificate generated (PDF)',!!cert]); steps.push(['Available in employee profile',!!cert]); steps.push(['Employee notified (in-app · email)',!!cert]);
  return {steps,cert,dup,eligible}; }
const myCourseAssign = cid => S.assignments.filter(a=>a.type==='course'&&a.item===cid&&a.emp===meEmp()).sort((x,y)=>y.assigned-x.assigned)[0];

function editQuestion(id,hook){ closeDD(); S.qeHook=hook||null; const src=id?JSON.parse(JSON.stringify(ques(id))):{id:null,text:'',type:'single',cat:'',opts:['','','',''],correct:[],marks:1,expl:'',status:'Active'}; S.qe=Object.assign(src,{_err:[]});

function qeType(t){ const q=S.qe; q.type=t; if(t==='tf'){ q.opts=['True','False']; q.correct=q.correct.filter(i=>i<2).slice(0,1); } else { if(q.opts[0]==='True'&&q.opts[1]==='False') q.opts=['','','','']; if(t==='single') q.correct=q.correct.slice(0,1); } render(); }
function qeCorrect(i,on){ const q=S.qe; if(q.type==='multiple'){ q.correct = on? [...new Set([...q.correct,i])].sort() : q.correct.filter(x=>x!==i); } else q.correct=[i]; qeLive(); }
function qeDelOpt(i){ const q=S.qe; q.opts.splice(i,1); q.correct=q.correct.filter(x=>x!==i).map(x=>x>i?x-1:x); render(); }
function saveQuestion(){ const q=S.qe; const e=[]; if(!q.text.trim()) e.push('Question text is required'); if(!q.cat.trim()) e.push('Category is required'); if(!(q.marks>0)) e.push('Marks must be greater than zero');
  if(q.opts.some(o=>!o.trim())) e.push('All answer options need text'); if(q.opts.length<2) e.push('At least two options are required');
  if(q.type!=='multiple' && q.correct.length!==1) e.push('Select exactly one correct answer'); if(q.type==='multiple' && q.correct.length<1) e.push('Select at least one correct answer');
  q._err=e; if(e.length){ render(); return; }
  const data={text:q.text.trim(),type:q.type,cat:q.cat.trim(),opts:q.opts.map(o=>o.trim()),correct:q.correct.slice(),marks:q.marks,expl:q.expl,status:q.status,updated:now()};
  if(q.id){ const t=ques(q.id); Object.assign(t,data); t.rev=(t.rev||1)+1; logAudit('Edited question',q.id); toast(`${q.id} saved (rev ${t.rev}) – historical results unchanged`); }
  else { const id='Q'+(301+S.questions.length); S.questions.unshift({id,by:me().name,rev:1,...data}); logAudit('Created question',id); toast(`Question ${id} created`); }
  const hk=S.qeHook; S.qeHook=null; S.modal=null; if(hk) hk(q.id||S.questions[0].id); render(); }

function asmCommit(a,what){ const pub=a.status==='Published'; if(pub){ a.snaps=a.snaps||{}; a.snaps[a.rev]={snapshot:JSON.parse(JSON.stringify(a.snapshot)),marks:{...a.marks},pass:a.pass}; a.rev=(a.rev||0)+1; }
  a.snapshot=a.qids.map(id=>JSON.parse(JSON.stringify(ques(id)))); const m={}; a.qids.forEach(id=>m[id]=(a.marks&&a.marks[id]!=null&&what!=='edit')?a.marks[id]:ques(id).marks); a.marks=m; a.updated=now();
  logAudit(`${what==='rules'?'Updated rules':'Updated questions'} – ${pub?'published revision '+a.rev:'draft'}`,a.id);
  toast(pub?`Saved as revision ${a.rev} – past attempts keep the revision they were taken on`:'Draft updated'); render(); }

  ${ed&&a.status==='Published'?`<div style="padding:12px 20px 0">${note('info',`Changes are published immediately as <b>revision ${(a.rev||0)+1}</b>. Attempts already taken keep the revision they were taken on.`)}</div>`:''}
  <div class="card-b">${a.snapshot.map((q,i)=>`<div class="asmq"><div class="asmqn">${i+1}</div><div style="flex:1;min-width:0"><div class="asmqt">${esc(q.text)}</div>
    <div class="small muted" style="margin:3px 0 8px">${QTYPE[q.type]} · ${a.marks[q.id]} mark${a.marks[q.id]===1?'':'s'} · <span class="mono">${q.id}</span>${q.cat?' · '+esc(q.cat):''}</div>
    <div class="asmopts">${q.opts.map((o,k)=>`<span class="asmo ${q.correct.includes(k)?'ok':''}">${ic(q.correct.includes(k)?'circle-check':'circle')}${esc(o)}</span>`).join('')}</div></div>
    ${ed?`<div class="asmqa"><span class="icb" title="Move up" ${i?`onclick="asmMove('${a.id}',${i},-1)"`:'style="opacity:.3"'}>${ic('arrow-up')}</span><span class="icb" title="Move down" ${i<a.qids.length-1?`onclick="asmMove('${a.id}',${i},1)"`:'style="opacity:.3"'}>${ic('arrow-down')}</span><span class="icb" title="Edit question" onclick="editQuestion('${q.id}',()=>asmCommit(assess('${a.id}'),'edit'))">${ic('pencil')}</span><span class="icb dng" title="Remove from assessment" onclick="asmDel('${a.id}','${q.id}')">${ic('trash-2')}</span></div>`:''}</div>`).join('')||'<div class="muted small">No questions yet.</div>'}</div></div>`; }
function asmMove(aid,i,d){ const a=assess(aid); const q=a.qids; [q[i],q[i+d]]=[q[i+d],q[i]]; asmCommit(a,'order'); }
function asmDel(aid,qid){ const a=assess(aid); if(a.qids.length<=1){ toast('An assessment needs at least one question','err'); return; }

function asmRules(a){ const ed=can('assessManage')&&a.status!=='Archived'; if(!S.ar||S.ar.id!==a.id) S.ar={id:a.id,pass:a.pass,attempts:a.attempts||0,duration:a.duration||0,randomize:!!a.randomize,shuffle:!!a.shuffle,showCorrect:!!a.showCorrect,showExpl:!!a.showExpl,practice:!!a.practice};

  ${ed&&a.status==='Published'&&dirty?`<div style="padding:12px 20px 0">${note('warn',`Saving publishes <b>revision ${(a.rev||0)+1}</b>. Attempts already taken are not re-graded.`)}</div>`:''}
  <div class="card-b asmrules">${num('pass','Passing percentage','Minimum score to pass.',1,100,'%')}${num('attempts','Maximum attempts','0 = unlimited attempts.',0,20,'attempts')}${num('duration','Time limit','0 = untimed. Server-enforced when set.',0,240,'minutes')}
   ${sw('randomize','Randomize question order','Each attempt gets a different question order.')}${sw('shuffle','Shuffle answer options','Options appear in a different order per attempt (not for True/False).')}${sw('showCorrect','Show correct answers after submission','Trainees see the answer key on their result.')}${sw('showExpl','Show explanations','Explanations appear with each question on the result.')}${sw('practice','Practice assessment','Attempts are not graded for pass rate or certification.')}

function asmSaveRules(aid){ const a=assess(aid), r=S.ar; if(!(r.pass>=1&&r.pass<=100)){ toast('Passing percentage must be between 1 and 100','err'); return; } if(r.attempts<0||r.duration<0){ toast('Values cannot be negative','err'); return; }

function seededOrder(n, seed){ const r=rng(seed); const idx=[...Array(n).keys()]; for(let i=n-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; } return idx; }
function assessLanding(as, a, preview, c){ const empId=a?.emp; const used=empId?attemptsFor(empId,as.id).filter(t=>!as.practice).length:0; const left=as.attempts?as.attempts-used:Infinity; const prog=empId&&S.attempts.find(t=>t.emp===empId&&t.aid===as.id&&t.status==='In Progress');
  const hist=empId?S.attempts.filter(t=>t.emp===empId&&t.aid===as.id&&t.status!=='In Progress').sort((x,y)=>y.submittedAt-x.submittedAt):[]; const passed=hist.some(t=>t.passed&&!t.practice);

  ${hist.length?`<h3 style="font-size:14px;margin:22px 0 8px">Your attempt history</h3>${table('pl-hist',[{k:'no',label:'Attempt',f:t=>'#'+t.no+(t.practice?' (practice)':'')},{k:'submittedAt',label:'Date',f:t=>fDT(t.submittedAt)},{k:'pct',label:'Score',f:t=>p1(t.pct)},{k:'passed',label:'Result',f:t=>badge(t.passed?'Passed':'Failed')}],hist,{nopage:1,click:t=>`go('result',{id:'${t.id}'})`})}`:''}`; }
function startAttempt(aid){ const as=assess(aid); const empId=meEmp();
  // server-side validation
  if(as.status!=='Published'){ toast('This assessment is not published','err'); return; }
  const authorised = S.assignments.some(a=>a.emp===empId&&a.type==='course'&&course(a.item).assessment?.id===aid) || S.asmAsg.some(r=>r.emp===empId&&r.aid===aid); if(!authorised){ toast('Not assigned to you','err'); return; }
  const used=attemptsFor(empId,aid).length; if(!as.practice && as.attempts && used>=as.attempts){ toast('Attempt limit reached','err'); return; }
  const open=S.attempts.find(t=>t.emp===empId&&t.aid===aid&&t.status==='In Progress'); if(open){ go('take',{id:open.id}); return; }
  const n=as.snapshot.length; const seed=S.seq*7919+used; const t={id:'AT-'+(7000+S.attempts.length),aid,arev:as.rev,emp:empId,no:used+1,startedAt:now(),submittedAt:null,deadline:as.duration?new Date(now().getTime()+as.duration*60000):null,answers:{},status:'In Progress',practice:as.practice,
    order: as.randomize? seededOrder(n,seed) : [...Array(n).keys()], optOrder: as.snapshot.map((q,i)=> as.shuffle&&q.type!=='tf'? seededOrder(q.opts.length,seed+i+1):[...Array(q.opts.length).keys()]), cur:0, savedAt:null};
  S.attempts.push(t); logAudit('Started assessment attempt',t.id); go('take',{id:t.id}); }
PAGES['take'] = p => { const t=S.attempts.find(x=>x.id===p.id); if(!t||t.emp!==meEmp()) return denied('open this attempt'); if(t.status!=='In Progress') return PAGES['result']({id:t.id}); const a=assess(t.aid);
  if(t.deadline && now()>t.deadline){ finalizeAttempt(t,'expired'); return PAGES['result']({id:t.id}); }
  return takeUI(a,t,false); };

  const ans=t.answers[q.id]; const sel=ans==null?[]:[].concat(ans); const answered=Object.keys(t.answers).filter(k=>{const v=t.answers[k]; return v!=null&&(!Array.isArray(v)||v.length);}).length;

   <button class="btn" style="width:100%;margin-top:12px;justify-content:center" onclick="tReview('${t.id}',${preview?1:0},true)">${ic('list-checks')}Review answers</button>

   ${preview?`<button class="btn" style="width:100%;justify-content:center" onclick="S.prev=null;go(${a.id==='__draft'?"'tc-assess-edit',{id:S.ab._src,step:4}":`'tc-assessment',{id:'${a.id}'}`})">${ic('x')}Exit preview</button>`:''}</div></div></div>`; }
function reviewList(a,t,order){ return `<div class="flex" style="margin-bottom:12px"><h3 style="margin:0;font-size:16px">Review your answers</h3><span class="sp"></span><span class="small muted">Click a question to change it</span></div>${order.map((qi,i)=>{ const q=a.snapshot[qi]; const v=t.answers[q.id]; const sel=v==null?[]:[].concat(v); return `<div class="media-ph" style="cursor:pointer;margin:0 0 8px" onclick="tNav('${t.id}',${i},${t.id?0:1})"><b>${i+1}.</b><div style="flex:1;min-width:0"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(q.text)}</div><div class="small ${sel.length?'muted':'dn'}">${sel.length? 'Your answer: '+sel.map(j=>esc(q.opts[j])).join(', ') : 'Not answered'}</div></div>${ic('pencil')}</div>`; }).join('')}`; }
const fmtLeft = ms => { ms=Math.max(0,ms); const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; };
const curT = (id,prev) => prev? S.prev : S.attempts.find(x=>x.id===id);
function answer(id,qid,j,on,prev){ const t=curT(id,prev); if(!prev && (t.status!=='In Progress')) { toast('This attempt has been submitted – answers can no longer be changed','err'); render(); return; }
  if(!prev && t.deadline && now()>t.deadline){ finalizeAttempt(t,'expired'); go('result',{id:t.id}); return; }
  const a=prev?null:assess(t.aid); const q=(prev?(S.route.p.id==='__draft'?S.ab.qids.map(x=>ques(x)):assess(S.route.p.id).snapshot):a.snapshot).find(x=>x.id===qid);
  if(q.type==='multiple'){ const cur=[].concat(t.answers[qid]||[]); t.answers[qid]= on? [...new Set([...cur,j])].sort() : cur.filter(x=>x!==j); } else t.answers[qid]=j;
  if(!prev){ t.savedAt=now(); } render(); }
function tNav(id,i,prev){ const t=curT(id,prev); t._review=false; t.cur=i; render(); }
function tReview(id,prev,on){ const t=curT(id,prev); t._review=on; render(); }
function tSubmit(id,prev){ const t=curT(id,prev); const a=prev? (S.route.p.id==='__draft'?{...S.ab,snapshot:S.ab.qids.map(x=>ques(x))}:assess(S.route.p.id)) : assess(t.aid);

    if(prev){ const g=S.grade(a.snapshot,t.answers,a.marks); t.done=g; openModal({title:'Preview result',body:()=>`<div class="grid g3">${[['Marks',`${g.got} / ${g.tot}`],['Score',p1(g.pct)],['Result',badge(g.pct>=a.pass?'Passed':'Failed')]].map(([k,v])=>`<div><div class="small muted">${k}</div><div class="b" style="font-size:18px">${v}</div></div>`).join('')}</div><div class="mt">${answerReview(a,{answers:t.answers},true,true)}</div>`,foot:()=>`<button class="btn" onclick="S.prev=null;closeModal()">Restart preview</button><button class="btn pri" onclick="S.modal=null;S.prev=null;go(${a.id==='__draft'||!a.id?"'tc-assess-edit',{id:S.ab._src,step:3}":`'tc-assessment',{id:'${a.id}'}`})">Done</button>`}); return; }
    finalizeAttempt(t,'submitted'); go('result',{id:t.id}); }}); }
function finalizeAttempt(t, how){ if(t.status!=='In Progress'){ toast('Duplicate submission ignored – this attempt was already graded','inf'); return; } const a=assess(t.aid);

  const g=S.grade(a.snapshot,t.answers,a.marks); Object.assign(t,{got:g.got,tot:g.tot,pct:g.pct,passed:g.pct>=a.pass,submittedAt:end,status:how==='expired'?'Expired':'Submitted',mins:Math.max(1,Math.round((end-t.startedAt)/60000))});

setInterval(()=>{ if(!S || S.route.n!=='take') return; const t=S.attempts.find(x=>x.id===S.route.p.id); if(!t||!t.deadline||t.status!=='In Progress') return; const left=t.deadline-now(); const el=document.getElementById('tleft'); if(el){ el.textContent=fmtLeft(left); document.getElementById('timer').classList.toggle('low',left<60000); } if(left<=0){ finalizeAttempt(t,'expired'); go('result',{id:t.id}); } }, 1000);
PAGES['result'] = p => { const t=S.attempts.find(x=>x.id===p.id); if(!t) return denied('view this result'); if(t.emp!==meEmp() && !can('viewOthers')) return denied('view another employee’s results'); const a=assess(t.aid);

  const c=a.course?course(a.course):null; const asg=c?S.assignments.filter(x=>x.emp===t.emp&&x.item===c.id).sort((x,y)=>y.assigned-x.assigned)[0]:null; const cert=asg?S.certs.find(x=>x.ref===asg.id):null;
  return `<div class="pg" style="max-width:1100px">${pageHead('Assessment Result',esc(a.title),`<button class="btn" onclick="go('my-assessments')">${ic('arrow-left')}My Assessments</button>${c&&asg?`<button class="btn" onclick="go('player',{id:'${c.id}'})">${ic('library')}Back to course</button>`:''}`,crumbs(['My Assessments','my-assessments'],['Result']))}
  <div class="card" style="margin-bottom:16px;${t.passed?'border-color:#9bd8b2':'border-color:#f2b8b8'}"><div class="card-b" style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;padding:24px">
   <div class="kic ${t.passed?'t-green':'t-red'}" style="width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center">${ic(t.passed?'party-popper':'circle-x')}</div>
   <div style="flex:1;min-width:220px"><div style="font-size:24px;font-weight:700">${t.passed?'Passed':'Not passed'}${t.practice?' (practice)':''}</div><div class="muted">${t.status==='Expired'?'Time expired – attempt finalised automatically with saved answers. ':''}${t.passed?(asg&&asg.completedAt?'Course requirement satisfied.':'Well done!'):(left>0?`You have ${left===Infinity?'unlimited':left} attempt${left===1?'':'s'} remaining.`:'Attempt limit reached – contact your Training Manager.')}</div></div>
   ${!t.passed&&left>0&&t.emp===meEmp()?`<button class="btn pri" onclick="startAttempt('${a.id}')">${ic('rotate-ccw')}Retake assessment</button>`:''}</div></div>
  ${cert && t.passed && asg.completedAt && Math.abs(cert.issued-now())<36e5*24*365 ? note('ok',`🏅 <b>${esc(certDef(cert.def).name)}</b> issued on ${fD(cert.issued)} · <a onclick="viewCert('${cert.id}')">View certificate</a>`):''}
  <div class="card" style="margin-bottom:16px"><div class="card-b kv2" style="grid-template-columns:repeat(2,170px 1fr)">${[['Assessment',esc(a.title)],['Employee',esc(empName(t.emp))],['Attempt number',`${t.no}${a.attempts?' of '+a.attempts:''}`],['Marks obtained',`${t.got}`],['Total marks',t.tot],['Score percentage',`${p1(t.pct)} <span class="small muted">(raw ${t.pct.toFixed(4)})</span>`],['Passing percentage',a.pass+'%'],['Pass / fail',badge(t.passed?'Passed':'Failed')],['Time taken',t.mins+' min'],['Submission date',fDT(t.submittedAt)]].map(([k,v])=>`<div class="k">${k}</div><div>${v}</div>`).join('')}</div></div>
  <h3 style="font-size:15px">Answer review</h3>${a.showCorrect? answerReview(a,t,true,a.showExpl) : note('grey','Correct answers are not shown for this assessment (configured by the Training Manager). Your score and result are shown above.','eye-off')}
  <h3 style="font-size:15px;margin-top:22px">Attempt history</h3><div class="card">${table('res-hist',[{k:'no',label:'Attempt',f:x=>'#'+x.no+(x.id===t.id?' (this)':'')},{k:'submittedAt',label:'Submitted',f:x=>fDT(x.submittedAt)},{k:'got',label:'Marks',f:x=>`${x.got}/${x.tot}`},{k:'pct',label:'Score',f:x=>p1(x.pct)},{k:'passed',label:'Result',f:x=>badge(x.passed?'Passed':'Failed')},{k:'mins',label:'Time',f:x=>x.mins+' min'}],hist,{nopage:1,click:x=>`go('result',{id:'${x.id}'})`})}</div></div>`; };

/* ===================== v2.00: assign an assessment directly to trainees ===================== */
const asnNew = (kind,cid,builder) => ({kind,cid,builder:!!builder,t:'people',sel:{people:{},team:{},dept:{},role:{},site:{}},reassign:false,open:{},n:{...S.settings.notif},msg:''});
function assignAssess(aid){ closeDD&&closeDD(); const a=assess(aid); if(!a||a.status!=='Published'){ toast('Only published assessments can be assigned','err'); return; }
  S.asn=asnNew('assess',aid); openModal({title:`Assign Assessment <span class="asnsub">${esc(a.title)}</span>`,size:'drawer',body:asnForm,foot:asnFoot2}); }
function asmGrpText(w){ return ASN_T.map(([t,l])=>{ const k=Object.keys(w.sel[t]).length; return k?`${k} ${k===1?({People:'person',Teams:'team',Departments:'department','Job roles':'job role','Job sites':'job site'})[l]:l.toLowerCase()}`:''; }).filter(Boolean).join(', '); }
function asmCreate(a,w,ids){ const by=me().name; let n=Math.max(1000,...S.asmAsg.map(r=>+String(r.id).replace(/\D/g,'')||0));
  ids.forEach(id=>{ S.asmAsg.push({id:'AAS-'+(++n),aid:a.id,emp:id,by,assigned:now(),rev:a.rev,note:w.msg||'',notify:Object.keys(w.n).filter(k=>w.n[k]&&['inapp','email','sms','push'].includes(k))});
    if(w.n.inapp||w.n.email||w.n.sms||w.n.push) notify(id,`Assessment assigned: ${a.title}${w.msg?' – '+w.msg:''}`,'clipboard-check'); });
  logAudit(`Assigned assessment to ${ids.length} trainee${ids.length===1?'':'s'} (${asmGrpText(w)})`,a.id); }
function asmAsnSubmit(){ const w=S.asn, a=assess(w.cid), r=asnResolve(); if(!r.add.length) return; asmCreate(a,w,r.add); S.modal=null;
  toast(`${a.title} assigned to ${r.add.length} trainee${r.add.length===1?'':'s'}${r.ref.length?` (${r.ref.length} re-assigned)`:''}`); render(); }
/* pending selection made in the builder is applied when the assessment is published */
function asmApplyPending(t){ const w=t.pendAsg; if(!w) return 0; const keep=S.asn; S.asn=Object.assign(w,{kind:'assess',cid:t.id}); const r=asnResolve(); if(r.add.length) asmCreate(t,w,r.add); S.asn=keep; delete t.pendAsg; return r.add.length; }
function abAssign(){ const a=S.ab; if(!a.pendAsg) a.pendAsg=asnNew('assess',a.id||null,true); a.pendAsg.cid=a.status==='Published'?a.id:null; S.asn=a.pendAsg; const r=asnResolve(); const nSel=ASN_T.reduce((s,[t])=>s+Object.keys(a.pendAsg.sel[t]).length,0);
  return `<div class="card"><div class="card-h"><h3>Assign trainees <span class="small muted" style="font-weight:400">– optional</span></h3><div class="r small muted">${nSel?`<b style="color:var(--ink)">${r.add.length}</b> trainee${r.add.length===1?'':'s'} will be assigned when you publish`:'You can also assign later from the assessment’s Trainees section'}</div></div>
   <div class="card-b">${note('info','Choose field workers or back office employees, narrow the list by category, department or job site, then pick the trainees. The assessment is assigned when you <b>publish</b> – saving a draft keeps your selection.')}<div class="asninl2">${asnForm()}</div></div></div>`; }
function asmTrainees(a){ const by={}; S.asmAsg.filter(r=>r.aid===a.id&&inScope(r.emp)).forEach(r=>{ if(!by[r.emp]||by[r.emp].assigned<r.assigned) by[r.emp]=r; });
  return Object.values(by).map(r=>{ const att=S.attempts.filter(t=>t.emp===r.emp&&t.aid===a.id&&!t.practice&&t.startedAt>=r.assigned); const open=att.find(t=>t.status==='In Progress'); const done=att.filter(t=>t.status!=='In Progress'); const best=done.sort((x,y)=>y.pct-x.pct)[0]; const passed=done.find(t=>t.passed);
    return {...r,status:passed?'Passed':open?'In Progress':done.length?'Failed':'Not Started',used:done.length,best,passedAt:passed&&passed.submittedAt}; }); }
function asmTraineesTab(a){ const rows=asmTrainees(a); const c=a.course?course(a.course):null;
  return `${c?note('grey',`Trainees enrolled in the linked course <a onclick="go('tc-course',{id:'${c.id}',tab:'trainees'})">${esc(c.title)}</a> take this assessment as part of the course. This list shows trainees assigned to the assessment directly.`):''}
  <div class="card">${table('as-trn',[{k:'emp',label:'Trainee',f:r=>empCell(r.emp),sv:r=>empName(r.emp)},{k:'assigned',label:'Assigned',f:r=>`${fD(r.assigned)}<div class="small muted">by ${esc(r.by)}</div>`},{k:'rev',label:'Revision',f:r=>'rev '+r.rev},{k:'used',label:'Attempts used',f:r=>`${r.used}${a.attempts?' of '+a.attempts:''}`},{k:'best',label:'Best score',f:r=>r.best?p1(r.best.pct):'—',sv:r=>r.best?r.best.pct:-1},{k:'status',label:'Status',f:r=>badge(r.status)+(r.passedAt?`<div class="small muted">${fD(r.passedAt)}</div>`:'')},{k:'notify',label:'Notified via',f:r=>`<span class="small">${(r.notify||[]).map(k=>({inapp:'In-app',email:'Email',sms:'SMS',push:'Push'})[k]).join(', ')||'—'}</span>`}],rows,{sort:'assigned',dir:-1,empty:a.status==='Published'?'No trainees assigned to this assessment yet – use Assign to add them.':'Publish the assessment to assign trainees.'})}</div>`; }
</script>
<script>

function certHTML(o){ const T=S.tpl; const st=o.status||'Valid';
