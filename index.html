  ${T.logo&&T.logoImg?`<div style="display:flex;align-items:center;justify-content:center;margin-top:1cqw;height:6cqw"><img src="${T.logoImg}" alt="Company logo" style="max-height:6cqw;max-width:32cqw;object-fit:contain"></div>`:T.logo?`<div style="display:flex;align-items:center;gap:1.2cqw;margin-top:1cqw">${CREST.replace('width="28" height="30"','width="34" height="36" style="width:4.2cqw;height:auto"')}<span style="font-family:Roboto;font-weight:700;font-size:2cqw;letter-spacing:.12em;color:#13265c">${esc(S.ORG.name.toUpperCase())}</span></div>`:''}
  <div class="ct">${esc(T.title)}</div><div class="cs">${esc(T.subtitle)}</div><div class="cx" style="margin-top:2.4cqw">This is to certify that</div><div class="cn">${esc(o.learner)}</div><div class="cx">${esc(T.body)}</div><div class="cco">${esc(o.course)}</div><div class="cx" style="font-size:1.7cqw">${esc(o.certName)}</div>
  <div class="cf"><div style="text-align:left"><div>Certificate ID: <b>${esc(o.id)}</b></div><div>Issued: <b>${typeof o.issued==='string'?esc(o.issued):fD(o.issued)}</b></div><div>${o.expires?`Valid until: <b>${typeof o.expires==='string'?esc(o.expires):fD(o.expires)}</b>`:'No expiry'}</div></div>${T.seal?`<div class="seal">VERIFIED<br>TRAINING<br>RECORD</div>`:''}<div><div class="sigs">${esc(T.signName)}</div><div class="sig">${esc(T.signName)}<br>${esc(T.signTitle)}, ${esc(S.ORG.name)}</div></div></div></div>`; }
const certData = c => ({id:c.id,learner:empName(c.emp),course:course(certDef(c.def).course).title,certName:certDef(c.def).name,issued:c.issued,expires:c.expires,status:certStatus(c)});
function viewCert(id){ closeDD(); const c=S.certs.find(x=>x.id===id); if(!c) return; if(c.emp!==meEmp() && !can('certView')) { toast('Not authorised to view this certificate','err'); return; }
  const def=certDef(c.def); const hist=S.certs.filter(x=>x.emp===c.emp&&x.def===c.def).sort((a,b)=>b.issued-a.issued);
  openModal({title:'Certificate details',size:'xl',icon:'award',body:()=>`<div class="grid" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start"><div style="border:1px solid var(--line);border-radius:8px;overflow:hidden">${certHTML(certData(c))}</div>
   <div><div class="kv2" style="grid-template-columns:120px 1fr">${[['Certificate ID',`<span class="mono">${c.id}</span>`],['Certificate',esc(def.name)],['Trainee',S.role==='emp'?esc(empName(c.emp)):`<a onclick="S.modal=null;go('ef-worker',{id:'${c.emp}',tab:'training'})">${esc(empName(c.emp))}</a>`],['Linked course',esc(course(def.course).title)],['Issue date',fD(c.issued)],['Expiration',c.expires?fD(c.expires):'No expiry'],['Status',badge(certLabel(c))],['Issuance ref.',`<span class="mono">${c.ref}</span>`]].map(([k,v])=>`<div class="k">${k}</div><div>${v}</div>`).join('')}</div>
   ${certStatus(c)==='Superseded'?note('grey','Superseded – this certificate has been renewed. The new certificate is the current one.'):''}${c.revoked?note('err',`Revoked ${fD(c.revoked.at)} by ${esc(c.revoked.by)} – ${esc(c.revoked.reason)}`):''}${certStatus(c)==='Expired'?note('warn',isRenewed(c)?'Expired – superseded by a renewed certificate (history retained).':'Expired – renewal requires a new qualifying completion of the linked course.'):''}
   <div class="b small" style="margin:14px 0 6px">Certificate history (${hist.length})</div>${hist.map(h=>`<div class="flex small" style="padding:6px 0;border-bottom:1px solid var(--line2);cursor:pointer" onclick="viewCert('${h.id}')"><span class="mono" style="flex:1">${h.id}</span>${fD(h.issued)} ${badge(certLabel(h))}</div>`).join('')}</div></div>`,
   foot:()=>`${can('revoke')&&!c.revoked?`<div class="l"><button class="btn dng" onclick="revokeCert('${c.id}')">${ic('ban')}Revoke certificate</button></div>`:''}<button class="btn" onclick="closeModal()">Close</button><button class="btn pri" onclick="pdfPreview('${c.id}')">${ic('file-down')}Download PDF</button>`}); }
function pdfPreview(id, sample){ if(S.role==='emp'&&!can('download')){ toast('Certificate download is turned off by your administrator','inf'); return; } const d= sample? {id:'[Certificate ID]',learner:'[Employee Name]',course:'[Course Name]',certName:'[Certification Name]',issued:'[Issue Date]',expires:'[Expiry Date]',status:'Valid'} : certData(S.certs.find(x=>x.id===id));
  openModal({title:`PDF – ${esc(d.id)}.pdf`,size:'xl',icon:'file-down',body:()=>`<div style="background:#525659;padding:24px;border-radius:8px"><div style="max-width:900px;margin:0 auto;box-shadow:0 4px 20px rgba(0,0,0,.4)">${certHTML(d)}</div><div style="text-align:center;color:#ddd;font-size:12px;margin-top:10px">A4 landscape · 1 page${sample?' · sample data':''}</div></div>`,
   foot:()=>`<span class="small muted" style="margin-right:auto"></span><button class="btn" onclick="closeModal()">Close</button><button class="btn pri" onclick="toast('PDF download authorised – ${esc(d.id)}.pdf (simulated)','inf')">${ic('download')}Download</button>`}); }
function revokeCert(id){ const c=S.certs.find(x=>x.id===id); S._rv=''; openModal({title:'Revoke certificate',size:'sm',body:()=>`${note('warn','Revocation is permanent, recorded in the audit log, and the certificate will no longer appear as valid anywhere.')}<div class="fld"><label>Reason <span class="rq">*</span></label><textarea oninput="S._rv=this.value"></textarea></div>`,
  foot:()=>`<button class="btn" onclick="viewCert('${id}')">Cancel</button><button class="btn dngf" onclick="if(!S._rv.trim()){toast('A reason is required','err');return;} const c=S.certs.find(x=>x.id==='${id}'); c.revoked={at:now(),by:me().name,reason:S._rv.trim()}; logAudit('Revoked certificate','${id}'); notify(c.emp,'Certificate revoked: '+certDef(c.def).name,'ban'); S.modal=null; toast('Certificate revoked and logged'); render()">Revoke</button>`}); }
PAGES['tc-certs'] = p => { if(!can('certView')) return denied('view certifications'); applyP('ct',p,['tab','st','rng','irng']); const f=F('ct'); const tab=f.tab||(can('certManage')?'defs':'issued');

  return `<div class="card"><div class="fbar">${fsrch('ctd','Search certifications…')}${fsel('ctd','st','All statuses',['Active','Inactive'])}</div>${table('ctd-list',[{k:'id',label:'ID',f:d=>`<span class="mono">${d.id}</span>`},{k:'name',label:'Certificate name',f:d=>`<b style="font-weight:500">${esc(d.name)}</b><div class="small muted">Valid ${d.validity} months · reminder ${d.reminder} days before</div>`},{k:'course',label:'Linked course',f:d=>esc(course(d.course).title),sv:d=>course(d.course).title},
   {k:'tot',label:'Total issued',f:d=>S.certs.filter(c=>c.def===d.id).length,sv:d=>S.certs.filter(c=>c.def===d.id).length},{k:'v',label:'Valid',f:d=>`<span class="yes b">${S.certs.filter(c=>c.def===d.id&&certStatus(c)==='Valid'&&!expiringSoon(c)).length}</span>`,ns:1},{k:'e',label:'Expiring',ns:1,f:d=>`<span style="color:var(--amber)" class="b">${S.certs.filter(c=>c.def===d.id&&expiringSoon(c)).length}</span>`},{k:'x',label:'Expired',ns:1,f:d=>`<span class="dn b">${S.certs.filter(c=>c.def===d.id&&certStatus(c)==='Expired').length}</span>`},{k:'status',label:'Status',f:d=>badge(d.status)},
   {k:'a',label:'',ns:1,f:d=>ddMenu([['pencil','Configure',`go('tc-cert-def',{id:'${d.id}'})`],['scroll-text','View issued',`F('ct').tab='issued';F('ct').def='${d.id}';render()`]])}],rows,{click:d=>`go('tc-cert-def',{id:'${d.id}'})`,nopage:1})}</div>`; }
function issuedList(scope){ const f=F('ct'); const rows=scope.filter(c=>match(f.q,c.id,empName(c.emp),certDef(c.def).name)&&(!f.def||c.def===f.def)&&(!f.st||certLabel(c)===f.st||(f.st==='Expired'&&certStatus(c)==='Expired'&&!isRenewed(c)))&&(!f.team||emp(c.emp).team===f.team)&&(f.st==='Expired'?!isRenewed(c):true)&&(!f.rng||(c.expires&&c.expires>=rangeBounds(f.rng)[0]&&c.expires<=rangeBounds(f.rng)[1]))&&(!f.irng||(c.issued>=rangeBounds(f.irng)[0]&&c.issued<=rangeBounds(f.irng)[1])));
  return `<div class="card"><div class="fbar">${fsrch('ct','Search certificate ID or employee…')}${fsel('ct','def','All certifications',S.certDefs.map(d=>[d.id,d.name]))}${fsel('ct','st','All statuses',['Valid','Expiring Soon','Superseded','Expired','Revoked'])}${fsel('ct','team','All teams',optTeams())}</div>
  ${f.rng||f.irng?`<div style="padding:8px 14px 0" class="chips">${f.rng?`<span class="chip">Expired: ${RANGES[f.rng][0]}<span class="x" onclick="setF('ct','rng','')">${ic('x')}</span></span>`:''}${f.irng?`<span class="chip">Issued: ${RANGES[f.irng][0]}<span class="x" onclick="setF('ct','irng','')">${ic('x')}</span></span>`:''}</div>`:''}
  ${f.st==='Expired'?`<div style="padding:8px 16px 0" class="small muted">${ic('info')} Showing expired certificates not yet renewed (matches the dashboard KPI).</div>`:''}
  ${table('ct-list',[{k:'id',label:'Certificate ID',f:c=>`<span class="mono">${c.id}</span>`},{k:'emp',label:'Trainee',f:c=>empCell(c.emp),sv:c=>empName(c.emp)},{k:'def',label:'Certificate',f:c=>esc(certDef(c.def).name),sv:c=>certDef(c.def).name},{k:'issued',label:'Issue date',f:c=>fD(c.issued)},{k:'expires',label:'Expiration date',f:c=>fD(c.expires)},{k:'st',label:'Status',f:c=>badge(certLabel(c))+(isRenewed(c)&&certStatus(c)==='Expired'?' <span class="small muted">renewed</span>':''),sv:c=>certLabel(c)},
   {k:'a',label:'',ns:1,f:c=>ddMenu([['eye','View certificate',`viewCert('${c.id}')`],['file-down','Download PDF',`pdfPreview('${c.id}')`],['user','View trainee',`go('ef-worker',{id:'${c.emp}',tab:'training'})`],...(can('revoke')&&!c.revoked?[['ban','Revoke',`revokeCert('${c.id}')`,1]]:[])])}],rows,{click:c=>`viewCert('${c.id}')`,sort:'issued',dir:-1})}</div>`; }

  <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start"><div class="card"><div class="card-b">

/* ---------- Assignment engine (shared by wizard, article publish, rules, scheduler) ---------- */
function createAssignments(o){ // o:{type,item,aud,emps?,mandatory,assignDate,due,notify,by,rule}
  const ids = o.emps || audResolve(o.aud); const res={ok:[],dup:[],inel:[],fail:[],notifFail:[]};
  const itm = o.type==='course'? course(o.item) : article(o.item);
  ids.forEach(id=>{ const e=emp(id);
    if(o.type==='course' && itm.status!=='Published') return res.inel.push([id,'Course is not published']);
    if(o.type==='article' && itm.status!=='Published') return res.inel.push([id,'Archived or unpublished article cannot be assigned']);
    if(e.syncError) return res.fail.push([id,'Invalid user reference from EntraField – profile not synchronised']);
    if(e.status!=='Active') return res.inel.push([id,'Employee is deactivated']);
    if(S.role==='sup' && !o.rule && !inScope(id)) return res.inel.push([id,'Outside your authorised scope']);
    if(o.type==='article' && !audResolve(itm.vis).includes(id)) return res.inel.push([id,'Article is not visible to this employee’s audience']);
    const dup=S.assignments.find(a=>a.emp===id&&a.item===o.item&&!a.completedAt); if(dup) return res.dup.push([id,`Active assignment ${dup.id} already exists`]);
    const a={id:'ENR-'+(5000+S.assignments.length),type:o.type,item:o.item,emp:id,by:o.by||me().name,source:o.rule?'rule':'manual',rule:o.rule||null,assigned:o.assignDate?new Date(o.assignDate+'T09:00:00+05:30'):now(),due:o.due?new Date(o.due+'T23:59:00+05:30'):null,mandatory:!!o.mandatory,rev:itm.rev,lessonsDone:[],completedAt:null,qa:null,lastActivity:null,cycle:'2026',viewed:false,ackRev:null,notif:'Delivered'};
    // notification delivery is independent – a failure never rolls back the assignment
    const ch=o.notify||{inapp:1,email:1,push:1}; if(e.id==='E019' && ch.push){ a.notif='Failed – push token expired (retry queued)'; res.notifFail.push([id,'Push notification failed – assignment kept']); }
    S.assignments.push(a); res.ok.push([id,a.id]); if(ch.inapp) notify(id,`New ${o.mandatory?'mandatory ':''}training assigned: ${itm.title}${a.due?' (due '+fD(a.due)+')':''}`,o.type==='course'?'book-open':'file-text'); });
  if(res.ok.length) logAudit(`Created ${res.ok.length} assignment(s)`,o.item);
  return res; }

/* ---------- Automation rules, execution history, reminders ---------- */
const TRIG={onboarding:'Employee onboarding',site:'Employee assigned to job site / work location',job:'Employee assigned to job type',recurring:'Recurring training cycle'};
const JOBTYPES=['Electrical Maintenance','HVAC Maintenance','Security Patrol','Event Security'];
function ruleSummary(r){ const it=r.item.type==='course'?course(r.item.id)?.title:article(r.item.id)?.title; const who=r.aud.all?'an employee':`an employee in ${audLabel(r.aud)}`;
  const when = r.trigger==='onboarding'?`When ${who} is onboarded`: r.trigger==='site'?`When ${who} is assigned to ${site(r.site)?.name||'[site]'}`: r.trigger==='job'?`When ${who} is assigned to a ${r.jobType||'[job type]'} job`:`Every ${r.recur||'[n]'} months for ${r.aud.all?'all employees':audLabel(r.aud)}`;
  return `${when}, automatically assign ${r.mandatory?'mandatory':'optional'} ${r.item.type} “${it||'[select item]'}” due ${r.dueDays} days later${r.trigger==='recurring'?' as a new cycle':''}, if the employee does not already have an equivalent active assignment.`; }
PAGES['tc-rules'] = p => { if(!can('rules')) return denied('manage automation rules'); const tab=p.tab||'rules';
  return `<div class="pg">${pageHead('Training Assignments','Automation rules run on EntraField events. They never block scheduling or job acceptance.',`${tab==='rules'?`<button class="btn pri" onclick="editRule()">${ic('plus')}Create Rule</button>`:''}`)}
  <div class="tabs"><span class="tb" onclick="go('tc-assign',{})">${ic('clipboard-list')}Assignments</span><span class="tb ${tab==='rules'?'on':''}" onclick="go('tc-rules',{})">${ic('workflow')}Automation rules</span><span class="tb ${tab==='history'?'on':''}" onclick="go('tc-rules',{tab:'history'})">${ic('history')}Execution history <span class="cnt">${S.runs.filter(r=>r.result==='Failed'&&!r.resolved).length} failed</span></span><span class="tb ${tab==='rem'?'on':''}" onclick="go('tc-rules',{tab:'rem'})">${ic('bell-ring')}Reminders</span></div>
  ${tab==='rules'?`<div class="grid" style="gap:12px">${S.rules.map(r=>`<div class="card"><div class="card-b flex" style="align-items:flex-start;gap:16px"><span class="kic ${r.active?'t-blue':'t-grey'}" style="width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center">${ic({onboarding:'user-plus',site:'map-pin',job:'briefcase',recurring:'repeat'}[r.trigger])}</span>
   <div style="flex:1"><div class="flex"><b>${esc(r.name)}</b>${badge(r.active?'Active':'Inactive')}<span class="tag">${TRIG[r.trigger]}</span></div><div style="margin:6px 0;line-height:1.5;color:var(--ink2)">${esc(ruleSummary(r))}</div><div class="small muted">${S.runs.filter(x=>x.rule===r.id).length} executions · ${S.runs.filter(x=>x.rule===r.id&&x.result==='Failed').length} failed · created ${fD(r.created)} by ${esc(r.by)} · notify ${Object.entries(r.notify).filter(([k,v])=>v).map(([k])=>k).join(', ')}</div></div>
   <label class="sw" title="Enable / disable"><input type="checkbox" ${r.active?'checked':''} onchange="toggleRule('${r.id}',this.checked)"><span></span></label>${ddMenu([['pencil','Edit rule',`editRule('${r.id}')`],['history','View execution history',`go('tc-rules',{tab:'history',rule:'${r.id}'})`]])}</div></div>`).join('')}</div>`:''}
  ${tab==='history'?runHistory(p):''}${tab==='rem'?reminders():''}</div>`; };
function toggleRule(id,on){ const r=S.rules.find(x=>x.id===id); r.active=on; logAudit((on?'Enabled':'Disabled')+' automation rule',id); toast(`Rule ${on?'enabled':'disabled'}`); render(); }
function editRule(id){ closeDD(); const src=id?JSON.parse(JSON.stringify(S.rules.find(r=>r.id===id))):{id:null,name:'',trigger:'site',site:'S1',jobType:JOBTYPES[0],aud:{all:true,targets:[]},item:{type:'course',id:''},mandatory:true,dueDays:14,recur:12,notify:{inapp:true,email:true,push:true},active:true};
  S.re=src; openModal({title:id?'Edit automation rule':'Create automation rule',size:'lg',icon:'workflow',body:()=>{ const r=S.re; return `
  <div class="row"><div class="fld" style="flex:2"><label>Rule name <span class="rq">*</span></label><input type="text" value="${esc(r.name)}" oninput="S.re.name=this.value"></div><div class="fld"><label>Status</label><select onchange="S.re.active=this.value==='1'"><option value="1" ${r.active?'selected':''}>Active</option><option value="0" ${!r.active?'selected':''}>Inactive</option></select></div></div>
  <div class="row"><div class="fld"><label>Trigger event</label><select onchange="S.re.trigger=this.value;render()">${Object.entries(TRIG).map(([k,l])=>`<option value="${k}" ${r.trigger===k?'selected':''}>${l}</option>`).join('')}</select></div>
   ${r.trigger==='site'?`<div class="fld"><label>Job site / work location</label><select onchange="S.re.site=this.value;render()">${optSites().map(([v,l])=>`<option value="${v}" ${r.site===v?'selected':''}>${l}</option>`).join('')}</select></div>`:''}
   ${r.trigger==='job'?`<div class="fld"><label>Job type</label><select onchange="S.re.jobType=this.value;render()">${JOBTYPES.map(j=>`<option ${r.jobType===j?'selected':''}>${j}</option>`).join('')}</select></div>`:''}
   ${r.trigger==='recurring'?`<div class="fld"><label>Recurrence</label><select onchange="S.re.recur=+this.value;render()">${[6,12,24].map(v=>`<option value="${v}" ${r.recur==v?'selected':''}>Every ${v} months</option>`).join('')}</select></div>`:''}</div>
  <div class="fld"><label>Training item</label><select onchange="const [t,i]=this.value.split(':');S.re.item={type:t,id:i};render()"><option value="">Select published course</option>${itemOpts().map(([k,l])=>`<option value="${k}" ${r.item.type+':'+r.item.id===k?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
  <div class="fld"><label>Applicable audience</label>${audPicker('S.re.aud')}</div>
  <div class="row"><div class="fld"><label>Mandatory / optional</label><select onchange="S.re.mandatory=this.value==='1';render()"><option value="1" ${r.mandatory?'selected':''}>Mandatory</option><option value="0" ${!r.mandatory?'selected':''}>Optional</option></select></div><div class="fld"><label>Due date</label><div class="flex"><input type="number" min="1" style="width:90px" value="${r.dueDays}" oninput="S.re.dueDays=+this.value"><span>days after trigger</span></div></div></div>
  <div class="fld"><label>Notification settings</label>${notifChecks('S.re.notify')}</div>
  <div class="note n-info">${ic('sparkles')}<div><b>Rule summary:</b> <span id="rsum">${esc(ruleSummary(r))}</span></div></div>`; },
  foot:()=>`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveRule()">${ic('save')}Save rule</button>`}); }
function saveRule(){ const r=S.re; if(!r.name.trim()||!r.item.id){ toast('Rule name and training item are required','err'); return; } if(!r.aud.all&&!r.aud.targets.length){ toast('Select an audience','err'); return; }
  if(r.id){ Object.assign(S.rules.find(x=>x.id===r.id),r); toast('Rule updated'); } else { r.id='R'+(S.rules.length+1); r.created=now(); r.by=me().name; S.rules.push(r); toast('Rule created – it will run on the next matching event'); } logAudit('Saved automation rule',r.id); S.modal=null; render(); }
function runHistory(p){ const f=F('rh'); if(p.rule&&!p._ap){ f.rule=p.rule; p._ap=1; } const rows=S.runs.filter(r=>(!f.rule||r.rule===f.rule)&&(!f.res||(f.res==='Failed'?r.result==='Failed'||String(r.notif).startsWith('Failed'):r.result.startsWith(f.res))));
  return `<div class="card"><div class="fbar">${fsel('rh','rule','All rules',S.rules.map(r=>[r.id,r.name]))}${fsel('rh','res','All results',['Created','Skipped','Failed'])}</div>
  ${table('rh-list',[{k:'at',label:'Executed',f:r=>fDT(r.at)},{k:'rule',label:'Rule',f:r=>esc(S.rules.find(x=>x.id===r.rule)?.name)},{k:'event',label:'Event',f:r=>`<span class="mono">${r.event}</span>`},{k:'emp',label:'Employee',f:r=>esc(empName(r.emp))},{k:'result',label:'Result',f:r=>badge(r.result)+(r.resolved?' <span class="small muted">resolved</span>':'')},{k:'detail',label:'Detail',f:r=>`<span class="small">${esc(r.detail)}</span>`},{k:'notif',label:'Notification',f:r=>r.notif==='—'?'—':badge(r.notif.startsWith('Failed')?'Failed':'Delivered')+(r.notif.startsWith('Failed')?`<div class="small muted">${esc(r.notif)}</div>`:'')},
   {k:'x',label:'',ns:1,f:r=>(r.result==='Failed'||String(r.notif).startsWith('Failed'))&&!r.resolved?`<button class="btn xs" onclick="retryRun('${r.id}')">${ic('rotate-ccw')}Retry</button>`:''}],rows,{sort:'at',dir:-1})}</div>`; }
function retryRun(id){ const r=S.runs.find(x=>x.id===id); if(r.result==='Failed'){ const e=emp(r.emp); if(e.status!=='Active'||e.syncError){ toast(`Retry failed again: ${esc(r.detail)}. Fix the employee record in EntraField first.`,'err'); return; } } r.resolved=true; if(String(r.notif).startsWith('Failed')) r.notif='Delivered (retry)'; logAudit('Retried automation job',id); toast('Retry succeeded – safe to repeat, no duplicate assignment created'); render(); }
function reminders(){ const N=S.settings.notif; const rows=[['New training assignment','On assignment','Trainee','In-app, email, push',S.notifs.filter(n=>/assigned/.test(n.text)).length],['Upcoming deadline',`${N.deadlineDays} days before due date`,'Trainee','In-app, email, push',S.assignments.filter(a=>!a.completedAt&&a.due>now()&&a.due<=addDays(now(),N.deadlineDays)).length],['Overdue mandatory training',`Every ${N.overdueEvery} days while overdue`,'Trainee + supervisor','In-app, email, push',S.assignments.filter(a=>a.mandatory&&isOverdue(a)).length],['Upcoming certificate expiration',`${N.certDays} days before expiry`,'Trainee + manager','In-app, email, push',S.certs.filter(expiringSoon).length]];
  return `<div class="card">${table('rem',[{k:0,label:'Reminder',f:r=>`<b style="font-weight:500">${r[0]}</b>`},{k:1,label:'Schedule'},{k:2,label:'Recipients'},{k:3,label:'Channels'},{k:4,label:'Queued for next run',f:r=>`<b>${r[4]}</b>`},{k:5,label:'Status',ns:1,f:()=>badge('Active')}],rows,{nopage:1})}
  <div style="padding:14px 16px">${note('info',`Next reminder run: ${fD(addDays(now(),1))} at ${N.digest} CT. Change schedules in <a onclick="go('ef-settings',{tab:'notif'})">Settings → Training Center → Training Notifications</a>.`)}
  <div class="flex"><span class="small muted">Delivery log (last 24 h): 42 delivered · 1 failed (push token expired – retry queued)</span><span class="sp"></span><button class="btn sm" onclick="toast('Reminder job run: '+${rows[1][4]+rows[2][4]}+' reminders sent, duplicates suppressed')">${ic('play')}Run reminders now</button></div></div></div>`; }
</script>
<script>
/* ===================== REPORTS & ANALYTICS ===================== */
function exportDlg(title, data){ closeDD(); if(!can('export')){ toast('Exporting is not available for your role','inf'); return; } S._ex={fmt:'csv',title,data}; const toCSV=()=>[data.cols,...data.rows].map(r=>r.map(v=>{v=String(v??''); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\n');
  openModal({title:'Export – '+title,size:'lg',icon:'download',body:()=>`<div class="ptabs">${[['csv','CSV'],['xlsx','Excel (.xlsx)']].map(([k,l])=>`<span class="tb ${S._ex.fmt===k?'on':''}" onclick="S._ex.fmt='${k}';render()">${l}</span>`).join('')}</div>
   <div class="small muted" style="margin-bottom:10px"><b>${data.rows.length}</b> rows · <span class="mono">${title.toLowerCase().replace(/[^a-z0-9]+/g,'_')}_${toISO(now())}.${S._ex.fmt}</span></div>
   ${S._ex.fmt==='csv'?`<textarea id="csvbox" readonly style="width:100%;height:260px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;white-space:pre">${esc(toCSV())}</textarea>`:`<div class="tblw" style="max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:6px"><table class="tbl" style="font-size:12px"><thead><tr><th>#</th>${data.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${data.rows.slice(0,50).map((r,i)=>`<tr><td class="muted">${i+2}</td>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="small muted" style="margin-top:6px">Sheet “Report” · header row frozen · ${data.rows.length>50?'first 50 rows shown':''}</div>`}`,
   foot:()=>`<span class="small muted" style="margin-right:auto"></span><button class="btn" onclick="try{navigator.clipboard.writeText(document.getElementById('csvbox')?.value||'').then(()=>toast('CSV copied to clipboard'),()=>toast('Copy blocked – select the text and copy manually','inf'))}catch(e){toast('Copy blocked','inf')}" ${S._ex.fmt==='csv'?'':'disabled'}>${ic('copy')}Copy CSV</button><button class="btn pri" onclick="logAudit('Exported report','${esc(title)}');toast('Export generated: '+${data.rows.length}+' rows (${S._ex.fmt.toUpperCase()}) – download simulated');closeModal()">${ic('download')}Download</button>`}); }
const REPORTS = [
 ['progress','Employee Training Progress','users'],['course','Course Completion','library'],['results','Assessment Results','clipboard-list'],['passfail','Assessment Pass/Fail','badge-check'],
 ['certs','Certificate Status','award'],['expiring','Expiring Certificates','hourglass'],['asgstatus','Course Enrollment Status','clipboard-check'],['activity','Individual Trainee Activity','activity']];
function rptData(r, f){ const m=metrics(f); const ids=m._ids; const [from,to]=[m._from,m._to]; const inR=d=>d&&d>=from&&d<=to;
  const asg=S.assignments.filter(a=>ids.has(a.emp)&&inR(a.assigned)&&(!f.course||a.item===f.course)&&(!f.st||aStatus(a)===f.st));
  if(r==='progress'){ const rows=[...ids].map(id=>{ const xs=asg.filter(a=>a.emp===id); const c=xs.filter(a=>a.completedAt).length; return {emp:id,team:team(emp(id).team).name,n:xs.length,c,p:xs.filter(a=>aStatus(a)==='In Progress').length,ns:xs.filter(a=>aStatus(a)==='Not Started').length,rate:pctOf(c,xs.length)}; }).filter(x=>x.n||!f.st);
    return {kpis:[['Trainees',rows.length],['Enrollments',asg.length],['Completed',asg.filter(a=>a.completedAt).length],['Completion rate',p1(pctOf(asg.filter(a=>a.completedAt).length,asg.length))]],
     chart:bars(rows.slice(0,14).map(x=>empName(x.emp).split(' ')[0]),[{n:'Completed',v:rows.slice(0,14).map(x=>x.c),c:C.green},{n:'In progress',v:rows.slice(0,14).map(x=>x.p),c:C.blue},{n:'Not started',v:rows.slice(0,14).map(x=>x.ns),c:C.grey}],{stack:1,legend:1}),
     cols:[{k:'emp',label:'Employee',f:x=>empCell(x.emp),sv:x=>empName(x.emp)},{k:'team',label:'Team'},{k:'n',label:'Enrolled'},{k:'c',label:'Completed'},{k:'p',label:'In progress'},{k:'ns',label:'Not started'},{k:'rate',label:'Completion',f:x=>prog(x.rate||0),sv:x=>x.rate}],rows,
     exp:{cols:['Employee','Team','Enrolled','Completed','In progress','Not started','Completion %'],rows:rows.map(x=>[empName(x.emp),x.team,x.n,x.c,x.p,x.ns,x.rate==null?'':Math.round(x.rate*10)/10])}}; }
  if(r==='course'){ const cs=m._casg.filter(a=>!f.st||aStatus(a)===f.st); const rows=S.courses.filter(c=>cs.some(a=>a.item===c.id)).map(c=>{const xs=cs.filter(a=>a.item===c.id); const d=xs.filter(a=>a.completedAt).length; return {c:c.id,title:c.title,n:xs.length,d,p:xs.filter(a=>learnStatus(a)==='In Progress').length,ns:xs.filter(a=>learnStatus(a)==='Not Started').length,rate:pctOf(d,xs.length)};});
    return {kpis:[['Course enrollments',m._casg.length],['Completed',m.completed],['Course completion rate',p1(m.completionRate)],['In progress',m._casg.filter(a=>!a.completedAt&&learnStatus(a)==='In Progress').length]],chart:bars(rows.map(x=>x.title.split(' ').slice(0,2).join(' ')),[{n:'Completion rate',v:rows.map(x=>x.rate||0),c:C.blue}],{pct:1}),
     cols:[{k:'title',label:'Course'},{k:'n',label:'Enrolled'},{k:'d',label:'Completed'},{k:'p',label:'In progress'},{k:'ns',label:'Not started'},{k:'rate',label:'Completion rate',f:x=>prog(x.rate||0),sv:x=>x.rate}],rows,
     exp:{cols:['Course','Enrolled','Completed','In progress','Not started','Completion rate %'],rows:rows.map(x=>[x.title,x.n,x.d,x.p,x.ns,Math.round((x.rate||0)*10)/10])}}; }
  if(r==='results'||r==='passfail'){ let at=m._att; if(f.st) at=at.filter(t=>(f.st==='Completed'));
    if(r==='results'){ const rows=at.map(t=>({...t,title:assess(t.aid).title})); const buckets=[0,0,0,0,0]; at.forEach(t=>buckets[Math.min(4,Math.floor(t.pct/20.0001))]++);
     return {kpis:[['Graded attempts',at.length],['Average score',p1(m.avgScore)],['Pass rate',p1(m.passRate)],['Trainees assessed',new Set(at.map(t=>t.emp)).size]],chart:bars(['0–20%','20–40%','40–60%','60–80%','80–100%'],[{n:'Attempts',v:buckets,c:C.purple}]),
      cols:[{k:'emp',label:'Employee',f:x=>empCell(x.emp),sv:x=>empName(x.emp)},{k:'title',label:'Assessment'},{k:'no',label:'Attempt'},{k:'submittedAt',label:'Date',f:x=>fD(x.submittedAt)},{k:'got',label:'Marks',f:x=>`${x.got}/${x.tot}`},{k:'pct',label:'Score',f:x=>p1(x.pct)},{k:'passed',label:'Result',f:x=>badge(x.passed?'Passed':'Failed'),sv:x=>x.passed?1:0},{k:'mins',label:'Time',f:x=>x.mins+' min'}],rows,click:x=>`viewAttempt('${x.id}')`,
      exp:{cols:['Employee','Assessment','Attempt','Date','Marks','Total','Score %','Passing %','Result','Time (min)'],rows:rows.map(x=>[empName(x.emp),x.title,x.no,fD(x.submittedAt),x.got,x.tot,Math.round(x.pct*10)/10,assess(x.aid).pass,x.passed?'Passed':'Failed',x.mins])}}; }
    const rows=S.assessments.filter(a=>at.some(t=>t.aid===a.id)).map(a=>{const xs=at.filter(t=>t.aid===a.id); const p=xs.filter(t=>t.passed).length; return {id:a.id,title:a.title,n:xs.length,p,fl:xs.length-p,rate:pctOf(p,xs.length),avg:xs.reduce((s,t)=>s+t.pct,0)/xs.length};});

     cols:[{k:'title',label:'Assessment'},{k:'n',label:'Attempts'},{k:'p',label:'Passed'},{k:'fl',label:'Failed'},{k:'rate',label:'Pass rate',f:x=>p1(x.rate)},{k:'avg',label:'Average score',f:x=>p1(x.avg)}],rows,
     exp:{cols:['Assessment','Attempts','Passed','Failed','Pass rate %','Average score %'],rows:rows.map(x=>[x.title,x.n,x.p,x.fl,Math.round(x.rate*10)/10,Math.round(x.avg*10)/10])}}; }
  if(r==='overdue'){ const rows=S.assignments.filter(a=>ids.has(a.emp)&&isOverdue(a)&&inR(a.due)&&(!f.course||a.item===f.course)).map(a=>({...a,days:Math.floor((now()-a.due)/DAY),name:itemName(a)}));

    return {kpis:[['Overdue assignments',rows.length],['Of which mandatory',rows.filter(a=>a.mandatory).length],['Employees affected',new Set(rows.map(a=>a.emp)).size],['Average days overdue',rows.length?Math.round(rows.reduce((s,a)=>s+a.days,0)/rows.length):0]],chart:bars(S.teams.map(t=>t.name),[{n:'Overdue',v:byTeam,c:C.red}]),

     exp:{cols:['Employee','Training item','Type','Mandatory','Due date','Days overdue','Progress %'],rows:rows.map(x=>[empName(x.emp),x.name,x.type,x.mandatory?'Yes':'No',fD(x.due),x.days,Math.round(aProgress(x))])}}; }

function aiUpload(inp){ [...inp.files].forEach(f=>{ const ext=(f.name.split('.').pop()||'').toLowerCase(); const ok=['pdf','docx','doc','ppt','pptx','txt','rtf','odt','md'].includes(ext);

/* ---------- Generation (simulated) ---------- */
function aiGenerate(){ const a=S.ai; a.err={}; const sel=AI_FORDER.filter(k=>a.fmts[k]); if(!sel.length){ a.err.fmt='Select at least one format'; toast('Select at least one format','err'); render(); return; }
  if(!a.req.topic.trim()||!a.req.desc.trim()){ a.stage='req'; aiNext(); return; }
  a.stage='gen'; a.job={step:0,pct:0,sel,start:now()}; aiStop(); render();
  a._t=setInterval(()=>{ const j=S.ai&&S.ai.job; if(!j){ aiStop(); return; } j.pct+=4; j.step=Math.min(5,Math.floor(j.pct/20)); if(j.pct>=100){ aiStop(); aiBuild(); return; } if(S.modal) render(); },110); }
function aiStop(){ if(S.ai&&S.ai._t){ clearInterval(S.ai._t); S.ai._t=null; } if(S.ai&&S.ai._p){ clearInterval(S.ai._p); S.ai._p=null; if(S.ai.play) S.ai.play.on=false; } }
function aiCancelGen(){ aiStop(); S.ai.job=null; S.ai.stage='fmt'; toast('Generation cancelled – nothing was created','inf'); render(); }
function aiGen(){ const j=S.ai.job; const hasRef=S.ai.refs.some(f=>f.st==='ready');
  return `<div class="aigen"><div class="aigl">${ic('sparkles')}</div><div class="aih2" style="text-align:center">Generating training content…</div><div class="small muted" style="text-align:center;margin-bottom:18px">${esc(S.ai.req.topic)} · ${j.sel.map(k=>AIF[k][0]).join(', ')}</div>
   <div class="prog lg" style="max-width:520px;margin:0 auto 22px"><i style="width:${j.pct}%"></i></div>
   <div class="aigs">${AI_STEPS.map((l,i)=>{ const st=i<j.step?'done':i===j.step?'on':''; const skip=i===1&&!hasRef; return `<div class="${st} ${skip?'skip':''}"><span>${st==='done'?ic('check'):st==='on'?'<i class="spin"></i>':''}</span>${l}${skip?' <em>– no files uploaded, general guidance will be used</em>':''}${i===3&&st==='on'?`<em> – ${j.sel.map(k=>AIF[k][0]).join(' · ')}</em>`:''}</div>`; }).join('')}</div></div>`; }

const AI_FIRE=[
 ['Introduction to Fire Safety',[['Introduction to Fire Safety','Why fire safety matters on every post, the guard\u2019s role and the fire triangle (heat, fuel, oxygen).',['Fires spread in minutes – early detection saves lives','Guards are often first on scene and must act calmly','Remove one side of the fire triangle to stop a fire','Know your site\u2019s fire plan before your first shift']],['Understanding Fire Hazards','How to recognise common ignition sources and fuel loads during patrols.',['Overloaded sockets and damaged cables','Blocked or wedged-open fire doors','Flammable materials stored near heat sources','Smoking in non-designated areas','Report every hazard in the patrol log']]]],
 ['Fire Prevention',[['Fire Prevention Procedures','Daily prevention checks guards carry out on patrol.',['Check fire exits are clear and unlocked from inside','Confirm extinguishers are in place and the pressure gauge is green','Look for heat, smoke or burning smells','Record findings with a photo in the patrol report','Escalate unresolved hazards to the site supervisor']],['Fire Safety Guidelines','Company guidelines for housekeeping, hot work and storage.',['Keep corridors and stairwells free of storage','Hot work needs a permit and a fire watch','Store flammables in approved cabinets only','Never disable or cover detectors']]]],

 ['Evacuation Procedures',[['Evacuation Guidelines','Guiding occupants safely out of the building.',['Follow the posted evacuation routes','Assist people with mobility needs to refuge points','Never use lifts during a fire','Sweep assigned areas only if it is safe','Do not re-enter until the fire service gives the all-clear']],['Emergency Evacuation Summary','A short recap of the full evacuation sequence.',['Alarm → call → evacuate → assemble → account','Head-count at the assembly point','Report missing persons to the fire service','Complete an incident report after the event']]]]];
function aiPlan(){ const r=S.ai.req, T=r.topic.trim(); const fire=/fire/i.test(T)&&!r.topics.some(t=>!/fire|extinguisher|alarm|evacuat|hazard|assembly|communication/i.test(t));

  const tops=r.topics.length?r.topics:[`Introduction to ${T}`,`Key risks and responsibilities`,`Procedures and best practice`,`Reporting and follow-up`];
  const secs=[]; const per=tops.length>4?2:1; for(let i=0;i<tops.length;i+=per) secs.push(tops.slice(i,i+per));
  return secs.slice(0,4).map((g,si)=>[si===0&&!r.topics.length?`Getting started`:g[0],[].concat(...g.map(t=>[
    {t:t.length>60?t.slice(0,57)+'…':t.replace(/^./,c=>c.toUpperCase()),sum:`What ${aiAud().toLowerCase()} need to know about ${t.toLowerCase()} in the context of ${T.toLowerCase()}.`,pts:[`Understand why ${t.toLowerCase()} matters on site`,`Follow the agreed steps every time`,`Recognise warning signs early`,`Know who to contact and how to report`,`Apply it confidently during a real shift`]},

function aiContentEn(type,L){ const lang='English'; const r=S.ai.req, src=S.ai.refs.filter(f=>f.st==='ready'), cite=src.length?`Based on ${src[0].name}${L.si!=null?`, section ${L.si+1}.${(L.li||0)+1}`:''}`:''; const es=false;

  const bars=Array.from({length:64},(_,i)=>8+Math.abs(Math.sin(i*1.7)+Math.cos(i*.6))*14); const pi=Math.min(c.script.length-1,Math.floor(pl.t/secs*c.script.length));
  return `<div class="aiaud"><span class="icb aiab" onclick="aiPlay('${x.id}',${secs})">${ic(pl.on?'pause':'play')}</span><div class="aiwave" onclick="aiSeek(event,'${x.id}',${secs})">${bars.map((h,i)=>`<i style="height:${h}px;${i/64<pl.t/secs?'background:var(--blue)':''}"></i>`).join('')}</div><span class="small">${mmss(pl.t)} / ${mmss(secs)}</span></div>

function aiPlay(id,secs){ const a=S.ai; if(!a.play||a.play.id!==id) a.play={id,t:0,on:false}; const pl=a.play; pl.on=!pl.on; if(a._p){ clearInterval(a._p); a._p=null; }
  if(pl.on){ if(pl.t>=secs) pl.t=0; a._p=setInterval(()=>{ pl.t=Math.min(secs,pl.t+1); if(pl.t>=secs){ pl.on=false; clearInterval(a._p); a._p=null; } if(S.modal) render(); },250); } render(); }
function aiSeek(e,id,secs){ const r=e.currentTarget.getBoundingClientRect(); const a=S.ai; if(!a.play||a.play.id!==id) a.play={id,t:0,on:false}; a.play.t=Math.round(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*secs); render(); }

const AI_REF=[['Simplify the language','pencil'],['Add practical examples','lightbulb'],['Add step-by-step procedures','list-ordered'],['Make it shorter','minus'],['Add a summary','file-text'],['Translate to Spanish','languages']];
function aiRefine(x){ const a=S.ai, es=aiLangOf(x)==='Spanish'; const chips=AI_REF.map(([l,i])=>l==='Translate to Spanish'&&es?['Translate back to English',i]:[l,i]);
  return `<div class="airef2"><div class="aibh">${ic('sparkles')}Ask AI to change this item${es?' <span class="bd b-blue nodot" style="margin-left:6px">Spanish</span>':''}</div>
  <div class="aichips">${chips.map(([l,i])=>`<span class="aichip" onclick="aiPropose('${x.id}','${l}')">${ic(i)}${l}</span>`).join('')}</div>
  <div class="flex" style="gap:8px;margin-top:10px"><input type="text" id="airin" placeholder="Or type your own instruction, e.g. “Make it more detailed for supervisors”" value="${esc(a.refineIn)}" oninput="S.ai.refineIn=this.value" onkeydown="if(event.key==='Enter'&&this.value.trim())aiPropose('${x.id}',this.value.trim())" style="flex:1"><button class="btn" onclick="const v=S.ai.refineIn.trim(); if(!v){toast('Describe the change you want','err');return;} aiPropose('${x.id}',v)">${ic('send')}Send</button></div></div>`; }
function aiKind(L){ return /french|hindi|german|arabic|portuguese|chinese|italian|fran[cç]ais/.test(L)?'lang' : /english|ingl[eé]s/.test(L)?'en' : /spanish|espa[nñ]ol|transl/.test(L)?'es' : /short|brief|concise|reduce|less|trim|cut/.test(L)?'short' : /simpl|easy|plain|simple|clear/.test(L)?'simple' : /example/.test(L)?'ex' : /step|procedure|checklist|how to/.test(L)?'steps' : /summar|recap/.test(L)?'sum' : /supervisor|manager/.test(L)?'sup' : /guard/.test(L)?'guard' : 'other'; }
function aiTxtIns(h,frag){ const re=/<h3>(Key takeaways|Puntos clave)<\/h3>/; return re.test(h)?h.replace(re,frag+'$&'):h.replace(/(<p class="aicite">[\s\S]*<\/p>)?$/,frag+'$1'); }
function aiSlideIns(c,sl){ const k=c.slides.findIndex(s=>/^(Key takeaways|Puntos clave)$/.test(s.t)); c.slides.splice(k>=0?k:Math.max(1,c.slides.length-1),0,sl); }
function aiSceneIns(c,sc){ c.scenes.splice(Math.max(1,c.scenes.length-1),0,sc); c.secs=c.scenes.reduce((s,x)=>s+x.s,0); }
function aiParaIns(c,p){ c.script.splice(Math.max(1,c.script.length-1),0,p); c.secs=Math.max(60,c.script.length*14); }
function aiPropose(id,ins){ aiStop(); const a=S.ai, x=aiIt(id); const L=ins.toLowerCase(); const es=aiLangOf(x)==='Spanish'; const T=s=>es?aiES(s):s; const k=aiKind(L), ty=x.type;
  let c=JSON.parse(JSON.stringify(x.content)), what='', title=x.title; const before=JSON.stringify(c);
  const site=['the Austin Central Depot','Cedar Park Data Center','Round Rock Logistics Hub'][x.title.length%3];
  const ex=T(`Example: on a weekend shift at ${site}, a guard applies this by stopping, recording what they saw and informing the supervisor.`);
  const steps=['Stop and assess the situation','Raise the alarm or call for help on the radio','Act only if it is safe to do so','Record what happened and report it to your supervisor'].map(T);
  const pts=(aiSrcFrom(x).pts||[]).slice(0,3);
  const stop=m=>{ toast(m,'inf'); a.refineIn=''; render(); };
  if(k==='lang') return stop('In this prototype items can be translated to Spanish and back to English');
  if(k==='es'){ if(es) return stop('This item is already in Spanish'); c=aiToLang(ty,c,'Spanish'); title=aiES(x.title); what=`Translated the whole item into Spanish – title, headings and all body text${ty==='video'?', scene narration and subtitles; voice changed to Sofia (Spanish)':ty==='audio'?' and the narration script; voice changed to Sofia (Spanish)':''}.`; }
  else if(k==='en'){ if(!es) return stop('This item is already in English'); c=aiToLang(ty,c,'English'); title=aiEN(x.title); what='Translated the item back to English.'; }
  else if(k==='simple'){ c=aiMapText(ty,c,aiSimpler); if(ty==='video') c.scenes.forEach((s,i)=>{ if(i>0&&i<c.scenes.length-1) s.n=s.n.split(/(?<=\.)\s/)[0]; }); if(JSON.stringify(c)===before) return stop('The wording is already plain – nothing to simplify'); what='Replaced harder words with everyday ones and removed long or extra sentences.'; }
  else if(k==='short'){ const rm=[];
    if(ty==='text'){ const d=document.createElement('div'); d.innerHTML=c.html; const del=(e,l)=>{ if(e){ e.remove(); if(l) rm.push(l); } };
      d.querySelectorAll('h3').forEach(h=>{ if(/^(Do and don|Qué hacer y qué no)/.test(h.textContent)){ del(h.nextElementSibling&&h.nextElementSibling.tagName==='TABLE'?h.nextElementSibling:null); del(h,'the Do/Don’t table'); } });
      del(d.querySelector('blockquote'),'the note');
      d.querySelectorAll('p').forEach(p=>{ const b=p.querySelector('b'); if(b&&/^(Example|Ejemplo|Practical|Additional|Detalle)/.test(b.textContent)) del(p,'the example'); });
      d.querySelectorAll('ol,ul').forEach(l=>{ const li=[...l.children]; if(li.length>3){ li.slice(3).forEach(e=>e.remove()); if(!rm.includes('extra list points')) rm.push('extra list points'); } });
      c.html=d.innerHTML; }
    else if(ty==='presentation'){ if(c.slides.length>5){ const n=c.slides.length; c.slides=c.slides.filter((s,i)=>i<2||i>=n-2||i%2===0); rm.push(`${n-c.slides.length} slides`); } }
    else if(ty==='document'){ c.pages.forEach(p=>{ for(let i=p.b.length-1;i>=0;i--){ const b=p.b[i]; if(b[0]==='h'&&/^(Scope|Alcance|Example|Ejemplo)$/.test(b[1])){ p.b.splice(i,2); rm.push(b[1].toLowerCase()+' section'); } else if(Array.isArray(b[1])&&b[1].length>3){ b[1]=b[1].slice(0,3); } } }); if(c.pages.length>2){ const last=c.pages.pop(); c.pages[c.pages.length-1].b.push(['h',last.h],...last.b.filter(b=>b[0]!=='c')); rm.push('one page'); } }
    else if(ty==='video'){ if(c.scenes.length>3){ const n=c.scenes.length; c.scenes=c.scenes.filter((s,i)=>i===0||i===n-1||i%2===1); rm.push(`${n-c.scenes.length} scenes`); } c.scenes.forEach(s=>{ s.n=s.n.split(/(?<=\.)\s/)[0]; s.s=Math.max(8,Math.round(s.s*.7)); }); c.secs=c.scenes.reduce((t,s)=>t+s.s,0); rm.push('shorter narration'); }
    else { if(c.script.length>4){ const n=c.script.length; c.script=c.script.filter((p,i)=>i<2||i===n-1||i%2===0); c.secs=Math.max(60,c.script.length*14); rm.push(`${n-c.script.length} paragraphs`); } }
    if(!rm.length) return stop('This item is already short – nothing to remove'); what=`Shortened: removed ${rm.join(', ')}.`; }
  else if(k==='ex'||k==='other'||k==='guard'||k==='sup'){
    const head=k==='sup'?T('For supervisors'):k==='guard'?T('For security guards on post'):k==='ex'?T('Practical example'):T('Additional detail');
    const exB=esUc(ex.replace(/^(Example|Ejemplo): /,'')); const body=k==='sup'?T('Supervisors should check that this is followed on every shift and coach anyone who misses a step.')+' '+ex:k==='other'?`${esc(ins)} – ${exB}`:exB;
    if(ty==='text') c.html=aiTxtIns(c.html,`<p><b>${head}:</b> ${body}</p>`);
    else if(ty==='presentation') aiSlideIns(c,{t:head,b:[ex.replace(/^(Example|Ejemplo): /,'').slice(0,110),T('Discuss with your supervisor'),T('Apply it on your next shift')],i:'lightbulb'});
    else if(ty==='document') c.pages[Math.min(1,c.pages.length-1)].b.push(['h',head],['p',body]);
    else if(ty==='video') aiSceneIns(c,{t:head,n:body,s:20});
    else aiParaIns(c,`${head}: ${body}`);
    what=k==='ex'?'Added a practical, site-specific example.':k==='sup'?'Added guidance for supervisors.':k==='guard'?'Added a section written for security guards on post.':`Added detail following your instruction: “${esc(ins)}”.`; }
  else if(k==='steps'){
    if(ty==='text') c.html=aiTxtIns(c.html,`<h3>${T('Checklist')}</h3><ol>${steps.map(s=>`<li>${s}.</li>`).join('')}</ol>`);
    else if(ty==='presentation') aiSlideIns(c,{t:T('Step by step'),b:steps,i:'list-ordered'});
    else if(ty==='document') c.pages.splice(Math.max(1,c.pages.length-1),0,{h:T('Step-by-step checklist'),b:[['ol',steps]]});
    else if(ty==='video') aiSceneIns(c,{t:T('Step by step'),n:[T('Here is the procedure step by step.'),...['First, stop and assess the situation.','Second, raise the alarm or call for help.','Third, act only if it is safe.','Finally, record what happened and report it.'].map(T)].join(' '),s:24});
    else aiParaIns(c,[T('Here is the procedure step by step.'),...['First, stop and assess the situation.','Second, raise the alarm or call for help.','Third, act only if it is safe.','Finally, record what happened and report it.'].map(T)].join(' '));
    what='Added a four-step procedure.'; }
  else if(k==='sum'){
    if(ty==='text') c.html=aiTxtIns(c.html,`<h3>${T('Quick summary')}</h3><ul>${pts.map(p=>`<li>${esc(p)}</li>`).join('')}<li>${T('Report and record every action')}</li></ul>`);
    else if(ty==='presentation') aiSlideIns(c,{t:T('Quick summary'),b:[...pts,T('Report and record every action')],i:'list-checks'});
    else if(ty==='document') c.pages[c.pages.length-1].b.push(['h',T('Quick summary')],['ul',[...pts,T('Report and record every action')]]);
    else if(ty==='video') aiSceneIns(c,{t:T('Recap'),n:`${T('Let’s recap the key points.')} ${pts.join('; ')}.`,s:16});
    else aiParaIns(c,`${T('Let’s recap the key points.')} ${pts.join('; ')}.`);
    what='Added a short summary of the key points.'; }
  a.prop={id,ins,content:c,title,what}; a.refineIn=''; render(); setTimeout(()=>{ const r=document.querySelector('.airvr'), e=document.querySelector('.aiprop'); if(r&&e) r.scrollTop+=e.getBoundingClientRect().top-r.getBoundingClientRect().top-8; },40); }
function aiPropBox(x){ const a=S.ai, pr=a.prop; if(pr.id!==x.id) return ''; return `<div class="aiprop"><div class="aibh">${ic('sparkles')}Proposed revision <span class="small muted" style="font-weight:400">“${esc(pr.ins)}”</span></div><div class="small" style="margin-bottom:8px">${pr.what}${pr.title&&pr.title!==x.title?`<div style="margin-top:4px"><b>New title:</b> ${esc(pr.title)}</div>`:''}</div>
  <div class="aiprv">${aiPreview(x,pr.content,false)}</div><div class="flex" style="gap:8px;margin-top:10px"><span class="sp"></span><button class="btn" onclick="S.ai.prop=null;render()">Discard</button><button class="btn pri" onclick="aiApplyProp()">${ic('check')}Apply as revision ${x.rev+1}</button></div></div>`; }

 ['Which of the following are common fire hazards on a client site? Select all that apply.','multiple',['Overloaded sockets','Blocked fire doors','Closed fire doors','Flammables stored near heat'],[0,1,3],'Closed fire doors slow the spread of fire – they are not a hazard.'],

function aiQuizOpen(){ const a=S.ai; a.quiz={scope:'all',sec:0,les:{},n:10,level:a.req.level,dist:{single:4,multiple:3,tf:3},qs:null,mkA:true}; a.stage='quiz'; aiStop(); render(); }
function aiQuiz(){ const a=S.ai, q=a.quiz, o=a.out;
  if(!q.qs) return `<div style="max-width:760px"><div class="aih2">Generate Assessment with AI</div><div class="small muted" style="margin-bottom:14px">AI writes questions from the generated content. Nothing is published – you review every question first.</div>

   <div class="row"><div class="fld"><label>Number of questions</label><select onchange="const n=+this.value;S.ai.quiz.n=n;const s=Math.round(n*.4),m=Math.round(n*.3);S.ai.quiz.dist={single:s,multiple:m,tf:n-s-m};render()">${[5,10,15,20].map(n=>`<option ${q.n===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="fld"><label>Difficulty</label><select onchange="S.ai.quiz.level=this.value">${['Beginner','Intermediate','Advanced'].map(l=>`<option ${q.level===l?'selected':''}>${l}</option>`).join('')}</select></div></div>

  return `<div class="aih2">Review generated questions <span class="small muted" style="font-weight:400">${q.qs.filter(x=>x.inc).length} of ${q.qs.length} selected · ${q.qs.filter(x=>x.inc).reduce((s,x)=>s+x.marks,0)} marks</span></div>
   ${q.qs.map((x,i)=>`<div class="aiq ${x.inc?'':'off'}"><div class="flex" style="gap:10px;align-items:flex-start"><input type="checkbox" ${x.inc?'checked':''} onchange="S.ai.quiz.qs[${i}].inc=this.checked;render()" style="margin-top:9px"><div style="flex:1;min-width:0"><div class="flex" style="gap:8px"><b class="asmqn">${i+1}</b><input type="text" value="${esc(x.text)}" oninput="S.ai.quiz.qs[${i}].text=this.value" style="flex:1"><span class="bd b-grey nodot">${QTYPE[x.type]}</span><input type="number" min="1" max="10" value="${x.marks}" style="width:64px" title="Marks" oninput="S.ai.quiz.qs[${i}].marks=+this.value"></div>

     <input type="text" class="small" value="${esc(x.expl)}" placeholder="Explanation" oninput="S.ai.quiz.qs[${i}].expl=this.value" style="margin-top:6px;width:100%"></div></div></div>`).join('')}`; }

function aiQuizGen(){ const q=S.ai.quiz, d=q.dist; if(d.single+d.multiple+d.tf!==q.n){ toast(`The distribution adds up to ${d.single+d.multiple+d.tf} – it must equal ${q.n}`,'err'); return; } if(q.scope==='les'&&!Object.values(q.les).some(Boolean)){ toast('Select at least one item','err'); return; }
  const fire=/fire/i.test(S.ai.req.topic); const pts=[].concat(...Object.values(S.ai.out.items).filter(x=>q.scope==='all'||(q.scope==='sec'&&S.ai.out.sections[q.sec].ids.flatMap(id=>aiTree(id).map(t=>t[0].id)).includes(x.id))||(q.scope==='les'&&q.les[x.id])).map(x=>aiSrcFrom(x).pts||[]));
  const pool={single:[],multiple:[],tf:[]}; if(fire) AI_QF.forEach(z=>pool[z[1]].push(z));

const esName=t=>'«'+t.replace(/\b[a-z]/g,c=>c.toUpperCase())+'»';
function esWords(t){ let s=' '+t+' '; Object.keys(ES_W).sort((a,b)=>b.length-a.length).forEach(w=>{ s=s.replace(new RegExp(`([\\s(])${w}(?=[\\s,.;:)!?])`,'gi'),(_,p)=>p+ES_W[w]); }); s=s.trim(); return /^[A-Z]/.test(t)?esUc(s):s; }
function esT(t){ if(!t||!/[a-z]/i.test(t)) return t; if(AI_BACK[t]!=null) return t; let r=esLookup(t); if(r!=null) return r;
  for(const [re,fn] of ES_P){ const m=t.match(re); if(m) return fn(m); }
  const pm=t.match(/^(.*?)([.:;?!…]+)$/); if(pm&&pm[1]){ return esT(pm[1])+pm[2]; }
  const parts=t.split(/(?<=[.!?])\s+/); if(parts.length>1) return parts.map(esT).join(' ');
  for(const [re,fn] of ES_G){ const m=t.match(re); if(m) return fn(m); }
  if(t.length>=18){ const pk=Object.keys(ES_D).find(k=>k.startsWith(t)); if(pk) return ES_D[pk]; const sk=[...AI_SRCS].find(k=>k.startsWith(t)&&k!==t); if(sk) return esT(sk); }
  /* not in the generated vocabulary (e.g. a topic typed by the admin): keep it as a named topic */
  return t.split(' ').length<=6&&!/[,.]/.test(t)?esName(t):t; }
function aiES(s){ if(s==null||!/[a-z]/i.test(s)) return s; const lead=s.match(/^\s*/)[0], trail=s.match(/\s*$/)[0], core=s.trim(); const out=esT(core); if(out!==core) AI_BACK[out]=core; return lead+out+trail; }
function aiEN(s){ if(s==null) return s; const lead=s.match(/^\s*/)[0], trail=s.match(/\s*$/)[0], core=s.trim(); return lead+(AI_BACK[core]!=null?AI_BACK[core]:core)+trail; }
/* apply a string function to every piece of text in an item's content */
function aiMapText(type,c,fn){ c=JSON.parse(JSON.stringify(c));
  if(type==='text'){ const d=document.createElement('div'); d.innerHTML=c.html; const w=document.createTreeWalker(d,NodeFilter.SHOW_TEXT); const ns=[]; while(w.nextNode()) ns.push(w.currentNode); ns.forEach(n=>{ if(n.parentElement&&n.parentElement.closest('svg')) return; n.nodeValue=fn(n.nodeValue); }); c.html=d.innerHTML; }
  else if(type==='document') c.pages.forEach(p=>{ p.h=fn(p.h); p.b.forEach(b=>{ if(Array.isArray(b[1])) b[1]=b[1].map(fn); else b[1]=fn(b[1]); }); });
  else if(type==='presentation') c.slides.forEach(s=>{ s.t=fn(s.t); s.b=s.b.map(fn); });
  else if(type==='video') c.scenes.forEach(s=>{ s.t=fn(s.t); s.n=fn(s.n); });
  else c.script=c.script.map(fn);
  return c; }
const AI_ES_VOICE='Sofia – Spanish, female';
function aiToLang(type,c,lang){ const es=lang==='Spanish'; const out=aiMapText(type,c,es?aiES:aiEN); out.lang=es?'Spanish':'English';
  if(type==='video'||type==='audio'){ if(es){ out._voiceEn=out.voice&&out.voice!==AI_ES_VOICE?out.voice:(out._voiceEn||AI_VOICES[0]); out.voice=AI_ES_VOICE; } else { out.voice=c._voiceEn||(c.voice===AI_ES_VOICE?AI_VOICES[0]:c.voice); delete out._voiceEn; } }
  return out; }
const aiLangOf=x=>(x.content&&x.content.lang)||'English';
/* simplification */
const AI_SIMPLE=[[/\bUnderstand why\b/g,'Know why'],[/\bRecognise\b/g,'Spot'],[/\brecognise\b/g,'spot'],[/\bEscalate\b/g,'Pass on'],[/\bescalate\b/g,'pass on'],[/\boccupants\b/g,'people'],[/\bAssist\b/g,'Help'],[/\bassist\b/g,'help'],[/\bnon-designated\b/g,'no-smoking'],[/\bdesignated\b/g,'marked'],[/\bConfirm\b/g,'Check'],[/\bactivate\b/g,'press'],[/\brefuge points\b/g,'safe waiting areas'],[/\bunresolved\b/g,'open'],[/\bignition sources\b/g,'things that can start a fire'],[/\bfuel loads\b/g,'things that burn'],[/\bagreed\b/g,'same'],[/\bconfidently\b/g,'with confidence'],[/\bmobility needs\b/g,'trouble walking'],[/\bapproved\b/g,'safe'],[/\bcarry out\b/g,'do'],[/\bin the context of\b/g,'for'],[/\bwalkthrough\b/g,'guide'],[/\brealistic\b/g,'real'],[/\btypical\b/g,'common'],[/\bresponders\b/g,'emergency teams'],[/\bmust act calmly\b/g,'must stay calm'],[/\bdetection\b/g,'spotting'],[/\bwhere they are more specific than this lesson\b/g,'if they say something different'],[/\bwhere more specific\b/g,'if they are different'],[/\bunsure about\b/g,'not sure about'],[/\bimmediately\b/g,'right away'],[/\bapproximately\b/g,'about'],[/\bensure\b/g,'make sure'],[/\bEnsure\b/g,'Make sure'],[/\bsubsequently\b/g,'then'],[/\bprior to\b/g,'before'],[/\butilise\b|\butilize\b/g,'use'],
 [/\bComprender por qué\b/g,'Saber por qué'],[/\bEscale\b/g,'Pase'],[/\bescale\b/g,'pase'],[/\bocupantes\b/g,'personas'],[/\bdetección temprana\b/g,'detectarlo pronto'],[/\bpuntos de refugio\b/g,'zonas seguras'],[/\bfuentes de ignición\b/g,'cosas que pueden iniciar un incendio']];
function aiSimpler(s){ let o=s; AI_SIMPLE.forEach(([re,v])=>{ o=o.replace(re,v); }); o=o.replace(/ This lesson is written for [^.]*\./,'').replace(/ Esta lección está dirigida a [^.]*\./,''); return o; }

  return {xs,od,open,exp,soon,done:xs.filter(a=>a.completedAt).length,label: od? ['Overdue','red'] : exp? ['Cert expired','red'] : soon? ['Cert expiring','amber'] : open? ['Pending','blue'] : ['Up to date','green']}; }

  <div class="card" style="margin:8px 0 16px"><div class="card-b flex" style="gap:18px;padding:20px">${av(e.id,'lg')}<div style="flex:1"><h1 style="font-size:21px;margin:0">${esc(e.name)}</h1><div class="muted">${esc(e.role)} · ${esc(team(e.team).name)} · ${esc(e.dept)} · ${esc(site(e.site).name)}</div><div class="small muted" style="margin-top:4px">${e.id} · Joined ${fD(e.hire)} · ${esc(e.phone)}</div></div>${trainChip(e.id)}${NEW}${can('assign')&&inScope(e.id)?`<button class="btn pri" onclick="assignToEmp('${e.id}')">${ic('user-plus')}Assign course${NEW}</button>`:''}</div></div>
  <div class="tabs">${[['overview','Overview'],['training','Training'],['schedule','Schedule'],['docs','Documents']].map(([k,l])=>`<span class="tb ${tab===k?'on':''}" onclick="S.route.p.tab='${k}';render()">${l}${k==='training'?NEW:''}</span>`).join('')}</div>
  ${tab==='overview'?`<div class="grid g2"><div class="card"><div class="card-h"><h3>Profile</h3></div><div class="card-b kv2">${[['Employee ID',e.id],['Email',e.email],['Phone',e.phone],['Team',team(e.team).name],['Supervisor',empName(team(e.team).sup)],['Primary job site',site(e.site).name],['Status',badge(e.status)]].map(([k,v])=>`<div class="k">${k}</div><div>${v}</div>`).join('')}</div></div><div class="card"><div class="card-h"><h3>Training snapshot</h3>${NEW}<div class="r"><a class="small" onclick="S.route.p.tab='training';render()">Open training tab</a></div></div><div class="card-b grid g2">${[['Open enrollments',s.open],['In progress',s.xs.filter(a=>!a.completedAt&&learnStatus(a)==='In Progress').length],['Valid certificates',cs.filter(c=>certStatus(c)==='Valid').length],['Expired (unrenewed)',s.exp]].map(([k,v])=>`<div><div style="font-size:22px;font-weight:700">${v}</div><div class="small muted">${k}</div></div>`).join('')}</div></div></div>`:''}
  ${tab==='training'?`
   <div class="grid g4" style="margin-bottom:16px">${[['Enrolled courses',xs.filter(a=>a.cycle==='2026'||!a.completedAt).length],['Completed courses',xs.filter(a=>a.type==='course'&&a.completedAt).length],['Pending training',s.open],['Certificates (valid / total)',`${cs.filter(c=>certStatus(c)==='Valid').length} / ${cs.length}`]].map(([k,v])=>`<div class="card" style="padding:14px 16px"><div style="font-size:21px;font-weight:700">${v}</div><div class="small muted">${k}</div></div>`).join('')}</div>
   <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Enrolled & completed courses</h3></div>${table('pf-asg',[{k:'n',label:'Course',f:a=>esc(itemName(a)),sv:a=>itemName(a)},{k:'assigned',label:'Enrolled',f:a=>fD(a.assigned)},{k:'p',label:'Progress',f:a=>prog(aProgress(a)),sv:aProgress},{k:'s',label:'Status',f:a=>badge(aStatus(a)),sv:aStatus},{k:'completedAt',label:'Completed',f:a=>fD(a.completedAt)},{k:'cycle',label:'Cycle'}],xs,{sort:'assigned',dir:-1,size:6})}</div>
   <div class="grid g2"><div class="card"><div class="card-h"><h3>Assessment results</h3></div>${table('pf-at',[{k:'aid',label:'Assessment',f:t=>esc(assess(t.aid).title)},{k:'no',label:'#'},{k:'submittedAt',label:'Date',f:t=>fD(t.submittedAt)},{k:'pct',label:'Score',f:t=>p1(t.pct)},{k:'passed',label:'Result',f:t=>badge(t.passed?'Passed':'Failed')+(t.practice?' <span class="small muted">practice</span>':'')}],at,{sort:'submittedAt',dir:-1,size:5,click:t=>`viewAttempt('${t.id}')`})}</div>
   <div class="card"><div class="card-h"><h3>Certificates & expiration status</h3></div>${table('pf-ct',[{k:'def',label:'Certificate',f:c=>esc(certDef(c.def).name)},{k:'issued',label:'Issued',f:c=>fD(c.issued)},{k:'expires',label:'Expires',f:c=>fD(c.expires)},{k:'st',label:'Status',f:c=>badge(certLabel(c)),sv:certLabel}],cs,{sort:'issued',dir:-1,size:5,click:c=>`viewCert('${c.id}')`})}</div></div>`:''}
  ${tab==='schedule'?`<div class="card">${table('pf-sh',[{k:'date',label:'Date',f:x=>fD(x.date)},{k:'time',label:'Shift'},{k:'site',label:'Site',f:x=>esc(site(x.site).name)},{k:'job',label:'Job',f:x=>x.job||'—'}],S.shifts.filter(x=>x.emp===e.id),{nopage:1,empty:'No upcoming shifts.'})}</div>`:''}
  ${tab==='docs'?`<div class="card"><div class="empty-st">${ic('folder')}<div>Existing EntraField documents module (unchanged).</div></div></div>`:''}</div>`; };
PAGES['ef-teams'] = () => { if(!can('viewOthers')) return denied('view teams'); const ts=S.teams.filter(t=>S.role!=='sup'||S.users.sup.teams.includes(t.id));
  return `<div class="pg">${pageHead('Teams','Team › Teams · training performance by team')}
  <div class="grid g3">${ts.map(t=>{ const m=metrics({range:'all',team:t.id}); const mem=S.emps.filter(e=>e.team===t.id&&e.status==='Active'&&!e.syncError); return `<div class="card" style="cursor:pointer" onclick="go('ef-team',{id:'${t.id}'})"><div class="card-h"><span class="kic t-blue" style="width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center">${ic('users')}</span><div><h3>${esc(t.name)}</h3><div class="small muted">${esc(t.dept)} · ${mem.length} members · Supervisor ${esc(empName(t.sup))}</div></div></div>
   <div class="small muted" style="padding:10px 18px 0;display:flex;align-items:center">Training performance${NEW}</div><div class="card-b grid g3">${[['Completion',p1(m.completionRate)],['In progress',m._casg.filter(x=>!x.completedAt&&learnStatus(x)==='In Progress').length],['Expiring certs',m.expiring]].map(([k,v])=>`<div><div style="font-size:19px;font-weight:700">${v}</div><div class="small muted">${k}</div></div>`).join('')}</div></div>`;}).join('')}</div></div>`; };
PAGES['ef-team'] = p => { const t=team(p.id); if(S.role==='sup'&&!S.users.sup.teams.includes(t.id)) return denied('view this team'); const mem=S.emps.filter(e=>e.team===t.id&&e.status==='Active'&&!e.syncError); const m=metrics({range:'all',team:t.id});
  return `<div class="pg">${pageHead(esc(t.name),`${esc(t.dept)} · Supervisor ${esc(empName(t.sup))} · ${mem.length} members`,`<button class="btn" onclick="go('tc-reports',{r:'progress',team:'${t.id}'})">${ic('chart-line')}Team report</button>`,crumbs(['Teams','ef-teams'],[t.name]))}
  <div class="flex" style="margin-bottom:8px"><b>Training performance</b>${NEW}</div><div class="grid g4" style="margin-bottom:16px">${[['Course completion rate',p1(m.completionRate)],['Courses in progress',m._casg.filter(x=>!x.completedAt&&learnStatus(x)==='In Progress').length],['Assessment pass rate',p1(m.passRate)],['Certificates expiring',m.expiring]].map(([k,v])=>`<div class="card" style="padding:14px 16px"><div style="font-size:21px;font-weight:700">${v}</div><div class="small muted">${k}</div></div>`).join('')}</div>
  <div class="card">${table('tm-mem',[{k:'n',label:'Member',f:e=>empCell(e.id),sv:e=>e.name},{k:'site',label:'Job site',f:e=>esc(site(e.site).name)},{k:'a',label:'Enrolled',f:e=>empTrainSummary(e.id).xs.length,sv:e=>empTrainSummary(e.id).xs.length},{k:'d',label:'Completed',f:e=>empTrainSummary(e.id).done,sv:e=>empTrainSummary(e.id).done},{k:'s',label:'Training status'+NEW,ns:1,f:e=>trainChip(e.id)}],mem,{click:e=>`go('ef-worker',{id:'${e.id}',tab:'training'})`})}</div></div>`; };

/* ---------- Event-driven rule evaluation (Scheduler, Job Orders, onboarding) ---------- */
function fireEvent(type, empId, ctx={}){ const ev={site:'EmployeeSiteAssigned',job:'EmployeeJobAssigned',onboarding:'EmployeeCreated'}[type]; const out=[];
  S.rules.filter(r=>r.trigger===type).forEach(r=>{ const matchCtx = type==='site'? r.site===ctx.site : type==='job'? r.jobType===ctx.jobType : true; if(!matchCtx) return;
    if(!r.active){ out.push({rule:r,result:'Skipped – rule inactive'}); return; }
    if(!audResolve(r.aud).includes(empId)){ out.push({rule:r,result:'Skipped – not in audience'}); return; }
    const due=toISO(addDays(now(),r.dueDays)); const res=createAssignments({type:r.item.type,item:r.item.id,emps:[empId],mandatory:r.mandatory,assignDate:toISO(now()),due,notify:r.notify,by:'Rule: '+r.name,rule:r.id});
    const result = res.ok.length?'Created':res.dup.length?'Skipped – duplicate':'Failed'; const detail = res.ok[0]?.[1] || res.dup[0]?.[1] || res.fail[0]?.[1] || res.inel[0]?.[1];
    S.runs.unshift({id:'RUN-'+(S.seq++ +2000),rule:r.id,at:now(),event:ev,emp:empId,result,detail,notif:res.ok.length?(res.notifFail.length?'Failed – push token expired':'Delivered'):'—'}); out.push({rule:r,result,detail}); });
  return {ev,out}; }
function eventResultModal(title, empId, r){ const n=r.out.filter(o=>o.result==='Created').length; const base=title.includes('Shift')?'Shift assigned':'Worker assigned to job'; toast(n?`${base} · ${n} training item${n===1?'':'s'} assigned to <b>${esc(empName(empId))}</b>`:base); }
PAGES['ef-scheduler'] = () => { if(S.role==='emp'||S.role==='pa') return denied('use the Scheduler');
  return `<div class="pg">${pageHead('Schedule Board','Scheduler › Schedule Board · Training status shown for information '+NEW,`<button class="btn pri" onclick="newShift()">${ic('calendar-plus')}Assign shift</button>`)}
  <div class="card">${table('sch',[{k:'date',label:'Date',f:x=>fD(x.date)},{k:'time',label:'Shift'},{k:'emp',label:'Field worker',f:x=>empCell(x.emp),sv:x=>empName(x.emp)},{k:'site',label:'Job site',f:x=>esc(site(x.site).name)},{k:'job',label:'Job order',f:x=>x.job?`<a onclick="event.stopPropagation();go('ef-job',{id:'${x.job}'})">${x.job}</a>`:'—'},{k:'tr',label:'Training status'+NEW,ns:1,f:x=>trainChip(x.emp)},{k:'st',label:'Shift',ns:1,f:()=>badge('Assigned')}],S.shifts,{sort:'date',dir:1})}</div></div>`; };
function newShift(){ S._sh={emp:'E009',site:'S3',date:toISO(addDays(now(),2)),time:'06:00 – 14:00'}; openModal({title:'Assign shift',icon:'calendar-plus',body:()=>{ const x=S._sh; const rs=S.rules.filter(r=>r.trigger==='site'&&r.site===x.site);
  return `<div class="fld"><label>Field worker</label><select onchange="S._sh.emp=this.value;render()">${scopeEmps().map(e=>`<option value="${e.id}" ${x.emp===e.id?'selected':''}>${esc(e.name)} – ${esc(site(e.site).name)}</option>`).join('')}</select></div>
  <div class="fld"><label>Job site</label><select onchange="S._sh.site=this.value;render()">${optSites().map(([v,l])=>`<option value="${v}" ${x.site===v?'selected':''}>${l}</option>`).join('')}</select></div>
  <div class="row"><div class="fld"><label>Date</label><input type="date" value="${x.date}" onchange="S._sh.date=this.value"></div><div class="fld"><label>Shift</label><select onchange="S._sh.time=this.value">${['06:00 – 14:00','14:00 – 22:00','22:00 – 06:00'].map(t=>`<option ${x.time===t?'selected':''}>${t}</option>`).join('')}</select></div></div>
  <div class="small muted">${NEW} Training status of ${esc(empName(x.emp))}: ${trainChip(x.emp)}</div>`; },
  foot:()=>`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveShift()">${ic('check')}Assign shift</button>`}); }
function saveShift(){ const x=S._sh; S.shifts.unshift({id:'SH-'+(S.seq++),emp:x.emp,site:x.site,date:new Date(x.date+'T09:00:00+05:30'),time:x.time,job:null}); const r=fireEvent('site',x.emp,{site:x.site}); S.modal=null; eventResultModal('Shift',x.emp,r); }
PAGES['ef-jobs'] = () => { if(S.role==='emp'||S.role==='pa') return denied('view job orders'); return `<div class="pg">${pageHead('Job Orders','Job-specific knowledge and training requirements are shown on each job.')}
  <div class="card">${table('jobs',[{k:'id',label:'Job order',f:j=>`<span class="mono">${j.id}</span>`},{k:'title',label:'Title',f:j=>`<b style="font-weight:500">${esc(j.title)}</b>`},{k:'type',label:'Job type'},{k:'client',label:'Client'},{k:'site',label:'Site',f:j=>esc(site(j.site).name)},{k:'start',label:'Start',f:j=>fD(j.start)},{k:'l',label:'Training requirements'+NEW,ns:1,f:j=>`<span class="flex">${ic('graduation-cap')}${j.links.length}</span>`},{k:'status',label:'Status',f:j=>badge(j.status==='Scheduled'?'Assigned':j.status)}],S.jobs,{click:j=>`go('ef-job',{id:'${j.id}'})`,nopage:1})}</div></div>`; };
PAGES['ef-job'] = p => { const j=S.jobs.find(x=>x.id===p.id); const rule=S.rules.find(r=>r.trigger==='job'&&r.jobType===j.type);
  return `<div class="pg">${pageHead(esc(j.title),`<span class="mono">${j.id}</span> · ${esc(j.type)} · ${esc(j.client)} · ${esc(site(j.site).name)} · starts ${fD(j.start)}`,`<button class="btn pri" onclick="assignJobWorker('${j.id}')">${ic('user-plus')}Assign field worker</button>`,crumbs(['Job Orders','ef-jobs'],[j.id]))}
  <div class="grid g2"><div class="card"><div class="card-h">${ic('graduation-cap')}<h3>Training & knowledge requirements</h3>${NEW}<div class="r">${can('courseManage')||can('articleEdit')?`<button class="btn sm" onclick="linkJobItem('${j.id}')">${ic('link')}Link item</button>`:''}</div></div><div class="card-b">
   ${j.links.map((l,i)=>{const it=l.type==='course'?course(l.id):article(l.id); return `<div class="media-ph">${ic(l.type==='course'?'library':'file-text')}<div style="flex:1"><b style="font-weight:500">${esc(it.title)}</b><div class="small muted">${l.type==='course'?'Course':'Knowledge article'} · ${it.status}</div></div><a class="small" onclick="go('${l.type==='course'?'tc-course':'tc-article'}',{id:'${l.id}'})">Open</a>${can('courseManage')?`<span class="icb" onclick="S.jobs.find(x=>x.id==='${j.id}').links.splice(${i},1);render()">${ic('x')}</span>`:''}</div>`;}).join('')||'<div class="muted small">No linked items.</div>'}
</div></div>
  <div class="card"><div class="card-h">${ic('users')}<h3>Assigned field workers</h3></div><div class="card-b list">${j.workers.map(w=>`<div class="li">${av(w)}<div class="lt2"><b>${esc(empName(w))}</b><span>${esc(emp(w).role)}</span></div>${j.links.map(l=>{const a=S.assignments.filter(x=>x.emp===w&&x.item===l.id).sort((x,y)=>y.assigned-x.assigned)[0]; return `<span class="bd b-${!a?'grey':a.completedAt?'green':isOverdue(a)?'red':'blue'} nodot" title="${esc(l.id)}">${l.type==='course'?'C':'A'}: ${!a?'Not assigned':a.completedAt?'Done':isOverdue(a)?'Overdue':'Pending'}</span>`;}).join(' ')}</div>`).join('')}
   <div class="small muted" style="margin-top:8px">${ic('info')} Informational only – job acceptance is not blocked by training in this release.</div></div></div></div></div>`; };
function assignJobWorker(jid){ const j=S.jobs.find(x=>x.id===jid); S._jw=scopeEmps().find(e=>!j.workers.includes(e.id))?.id; openModal({title:'Assign field worker to '+jid,size:'sm',body:()=>`<div class="fld"><label>Field worker</label><select onchange="S._jw=this.value">${scopeEmps().filter(e=>!j.workers.includes(e.id)).map(e=>`<option value="${e.id}" ${S._jw===e.id?'selected':''}>${esc(e.name)} – ${esc(e.role)}</option>`).join('')}</select></div>`,
  foot:()=>`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="const j=S.jobs.find(x=>x.id==='${jid}');j.workers.push(S._jw);const r=fireEvent('job',S._jw,{jobType:j.type});S.modal=null;eventResultModal('Job',S._jw,r)">Assign</button>`}); }
function linkJobItem(jid){ S._li=itemOpts()[0]?.[0]; openModal({title:'Link training to job',size:'sm',body:()=>`<div class="fld"><label>Published course</label><select onchange="S._li=this.value">${[...S.courses.filter(c=>c.status==='Published').map(c=>['course:'+c.id,'Course · '+c.title])].map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join('')}</select></div>`,
  foot:()=>`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="const [t,i]=S._li.split(':');const j=S.jobs.find(x=>x.id==='${jid}');if(j.links.some(l=>l.id===i)){toast('Already linked','inf');return;}j.links.push({type:t,id:i});S.modal=null;toast('Linked to job requirements');render()">Link</button>`}); }

/* ===================== BOOT ===================== */
function boot(){ try{ localStorage.removeItem('entrafield-tc-proto-v1'); }catch(e){} initState('ca'); const h=(location.hash||'').slice(1); if(h && PAGES[h]){ if(h.startsWith('my-')||h.startsWith('l-')) S.role='emp'; S.route={n:h,p:{}}; } lastSync=snapData(); let nav='navigate'; try{ nav=(performance.getEntriesByType('navigation')[0]||{}).type||(performance.navigation&&performance.navigation.type===1?'reload':'navigate'); }catch(e){} if(nav==='reload') syncReset(); else if(BC) BC.postMessage({t:'hello'}); render();
  window.addEventListener('hashchange',()=>{ const h=(location.hash||'').slice(1); if(h&&PAGES[h]&&h!==S.route.n){ S.route={n:h,p:{}}; render(); } }); }
boot();
</script>
