<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EntraField – Training Center Prototype v2.12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>if(!window.lucide)document.write('<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"><\/script>')</script>
<style>
:root{--blue:#1d5bd8;--blue-d:#1747b0;--blue-l:#eef3ff;--blue-m:#dbe6ff;--ink:#1c2740;--ink2:#46536b;--mut:#8590a6;--line:#e7eaf0;--line2:#f0f2f6;--bg:#f7f8fb;
--green:#16a34a;--green-l:#e8f7ee;--red:#dc2626;--red-l:#fdecec;--amber:#c47a06;--amber-l:#fff5e0;--purple:#7c3aed;--purple-l:#f2ecff;--cyan:#0e8fb0;--cyan-l:#e5f7fc;--grey-l:#f1f3f7}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);font-size:14px;background:#fff;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none;cursor:pointer}
button{font-family:inherit}
.ic{width:18px;height:18px;stroke-width:1.8;flex-shrink:0;vertical-align:middle}
svg.lucide{width:18px;height:18px;stroke-width:1.8;flex-shrink:0;vertical-align:middle}
svg.lucide-fb{fill:currentColor;stroke:none}
.app{display:flex;height:100vh;overflow:hidden}
/* Sidebar */
.sb{width:300px;border-right:1px solid var(--line);flex-shrink:0;overflow-y:auto;background:#fff;transition:width .15s}
.sb::-webkit-scrollbar{width:6px}.sb::-webkit-scrollbar-thumb{background:#dfe3ea;border-radius:3px}
.logo{height:94px;display:flex;align-items:center;padding-left:40px}
.nav{padding:4px 0 30px}
.nav .it{display:flex;align-items:center;gap:20px;height:52px;margin:8px 28px 8px 16px;padding:0 16px 0 20px;border-radius:8px;color:var(--ink);font-weight:500;font-size:15px;cursor:pointer;position:relative;user-select:none}
.nav .it svg{width:26px;height:26px;stroke-width:1.6;color:#2a3550}
.nav .it:hover{background:#f6f8fc}
.nav .it.on{background:linear-gradient(90deg,#edf2ff 0%,#f6f8ff 60%,#fff 100%);color:var(--blue);box-shadow:inset 2px 0 0 var(--blue)}
.nav .it.on svg{color:var(--blue)}
.nav .it .chev{margin-left:auto;width:18px;height:18px;color:#6b7590;transition:transform .15s}
.nav .it.exp .chev{transform:rotate(90deg)}
.nav .it .new{margin-left:auto;font-size:10px;background:var(--blue-l);color:var(--blue);padding:2px 6px;border-radius:10px;font-weight:700}
.sub{margin:-4px 28px 6px 62px;border-left:1px solid var(--line);padding-left:6px}
.sub .si{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:6px;color:var(--ink2);font-size:14px;cursor:pointer}
.sub .si svg{width:16px;height:16px}
.sub .si:hover{background:#f6f8fc;color:var(--ink)}
.sub .si.on{color:var(--blue);background:var(--blue-l);font-weight:500}
.sb.col{width:96px}.sb.col .logo{padding-left:22px}.sb.col .lt,.sb.col .chev,.sb.col .new,.sb.col .sub{display:none}.sb.col .nav .it{margin:8px 12px;justify-content:center;padding:0}
/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
.hdr{height:78px;border-bottom:1px solid var(--line2);display:flex;align-items:center;padding:0 40px 0 40px;flex-shrink:0;box-shadow:0 1px 3px rgba(20,30,60,.03)}
.hdr .hb{cursor:pointer;color:#4a556e}.hdr .hb svg{width:26px;height:26px;stroke-width:1.6}
.hdr .rt{margin-left:auto;display:flex;align-items:center;gap:30px}
.hdr .hi{position:relative;cursor:pointer;color:#5a6680;display:flex}
.hdr .hi svg{width:25px;height:25px;stroke-width:1.6}
.hdr .bdg{position:absolute;top:-8px;right:-7px;background:#1fbf6b;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.hdr .prof{display:flex;align-items:center;gap:14px;cursor:pointer;position:relative}
.ava{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fff}
.hdr .pn{text-align:center;line-height:1.35}.hdr .pn b{font-weight:500;font-size:14px;display:block}.hdr .pn span{font-size:14px;color:var(--ink)}
.content{flex:1;overflow-y:auto;background:#fff}
.content::-webkit-scrollbar{width:10px}.content::-webkit-scrollbar-thumb{background:#d6dae2;border-radius:5px}
.pg{padding:28px 38px 96px;max-width:1600px}
/* Page header */
.ph{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph h1{font-size:22px;font-weight:700;margin:0 0 4px}
.ph .sub2{color:var(--mut);font-size:13.5px}
.ph .acts{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.crumb{font-size:12.5px;color:var(--mut);margin-bottom:6px}.crumb a{color:var(--mut)}.crumb a:hover{color:var(--blue)}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:1px solid #d5dbe6;background:#fff;color:var(--blue);border-radius:6px;font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f6f8fd;border-color:#c5cee0}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue-d)}
.btn.dng{color:var(--red);border-color:#f1c4c4}.btn.dng:hover{background:var(--red-l)}
.btn.dngf{background:var(--red);border-color:var(--red);color:#fff}
.btn.gh{border-color:transparent;background:transparent;color:var(--ink2)}.btn.gh:hover{background:var(--grey-l)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.xs{height:26px;padding:0 8px;font-size:12px;gap:4px}
.btn:disabled,.btn.dis{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.icb{width:30px;height:30px;border-radius:6px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2)}
.icb:hover{background:var(--grey-l)}.icb svg{width:16px;height:16px}
.icb:disabled{opacity:.3;cursor:default}
/* Cards */
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(20,30,60,.03)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.card-h h3{margin:0;font-size:15px;font-weight:600}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1300px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}.sb{width:96px}.sb .lt,.sb .chev,.sb .sub,.sb .new{display:none}.sb .nav .it{margin:8px 12px;justify-content:center;padding:0}.sb .logo{padding-left:22px}}
/* KPI */
.kpi{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;transition:box-shadow .12s,border-color .12s;min-width:0}
.kpi:hover{border-color:#c9d6f3;box-shadow:0 2px 8px rgba(29,91,216,.07)}
.kpi .kic{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi .kic svg{width:20px;height:20px}
.kpi .kv{font-size:22px;font-weight:700;line-height:1.1}
.kpi .kl{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.3}
.kgrid{display:grid;gap:12px;grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1150px){.kgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kgrid .kpi{flex-direction:column;align-items:flex-start;gap:10px;padding:14px}
.kgrid .kpi .kic{width:34px;height:34px;border-radius:8px}.kgrid .kpi .kic svg{width:17px;height:17px}
.kgrid .kpi .kv{font-size:21px}.kgrid .kpi .kl{font-size:12.3px}.kgrid .kpi .kc{font-size:11px}
.kpi .kc{font-size:11.5px;margin-top:3px;color:var(--mut)}
.up{color:var(--green)!important}.dn{color:var(--red)!important}
.efk{display:flex;gap:14px;align-items:center;padding:18px 16px;border:1px solid var(--line);border-radius:14px;height:103px;cursor:pointer;min-width:0}.efk>div:last-child{min-width:0}
.efk .kic{flex-shrink:0;width:52px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.efk .kv{font-size:24px;font-weight:700}.efk .kl{font-size:16px;font-weight:500;margin-top:4px;white-space:nowrap}
.efg{display:grid;gap:18px;grid-template-columns:repeat(6,minmax(0,1fr))}@media(max-width:1700px){.efg{grid-template-columns:repeat(3,minmax(0,1fr))}}
.t-blue{background:#e8efff;color:var(--blue)}.t-green{background:#e3f8ea;color:#16a34a}.t-purple{background:#f0e9ff;color:#7c3aed}.t-cyan{background:#dff7fb;color:#0891b2}.t-amber{background:#fff4d9;color:#d48806}.t-red{background:#fde8ea;color:#e11d48}.t-grey{background:#eef1f5;color:#5b667c}.t-navy{background:#e7ebf4;color:#24365f}
/* Tables */
.tblw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.2px}
.tbl th{text-align:left;font-weight:500;color:var(--ink2);background:#f8f9fc;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
.tbl th.sortable{cursor:pointer}.tbl th.sortable:hover{color:var(--blue)}
.tbl th .sa{font-size:10px;margin-left:3px;color:var(--blue)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
.tbl td.wr{white-space:normal;min-width:240px;max-width:420px}.tbl td.wr2{white-space:normal;min-width:160px;max-width:300px}
.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover td{background:#fafbfe}
.tbl td.empty{text-align:center;color:var(--mut);padding:36px}
.tbl .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--ink2)}
.pager{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line2)}
.pager .r{margin-left:auto;display:flex;gap:4px;align-items:center}
.pager select{height:28px;border:1px solid var(--line);border-radius:5px;font-size:12px}
.pager .pb{min-width:28px;height:28px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer;font-size:12px;color:var(--ink2)}
.pager .pb.on{background:var(--blue);color:#fff;border-color:var(--blue)}.pager .pb:disabled{opacity:.4;cursor:default}
/* Badges */
.bd{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.8px;font-weight:500;white-space:nowrap;line-height:1.3}
.bd::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.bd.nodot::before{display:none}
.b-green{background:var(--green-l);color:#15803d}.b-red{background:var(--red-l);color:#c02424}.b-amber{background:var(--amber-l);color:#b06c00}.b-blue{background:var(--blue-l);color:var(--blue)}.b-grey{background:var(--grey-l);color:#5b667c}.b-purple{background:var(--purple-l);color:#6d28d9}.b-cyan{background:var(--cyan-l);color:#0b7894}
.nw{display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:4px;background:#1d5bd8;color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.06em;line-height:1;vertical-align:middle;margin-left:6px;flex-shrink:0;font-family:Roboto,sans-serif}
.nav .it .lt{white-space:nowrap}.sub .si{white-space:normal;line-height:1.3;height:auto;min-height:36px;padding-top:6px;padding-bottom:6px}.sub{margin:-4px 16px 6px 52px}.sub .si{padding:0 8px 0 10px;font-size:13.5px}.btn.pri .nw{background:#fff;color:var(--blue)}
.nav .it .nw{margin-left:auto}.nav .it .nw+.chev{margin-left:8px}.sub .si .nw{margin-left:auto;height:15px;font-size:8.5px;padding:0 5px}
.sb.col .nav .it .nw{position:absolute;top:6px;right:8px;margin:0;height:13px;font-size:8px;padding:0 4px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:5px;background:var(--grey-l);color:var(--ink2);font-size:11.8px;margin:1px 3px 1px 0}
.tag .x{cursor:pointer;opacity:.6}.tag .x:hover{opacity:1}
/* Filters & forms */
.fcard{padding:12px 16px 16px;margin-bottom:16px}.fhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13.5px;min-height:30px}.fhead svg{color:var(--mut)}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(var(--n,6),minmax(0,1fr))}.fgrid select{width:100%;max-width:none;min-width:0;height:38px;font-size:13px}
@media(max-width:1350px){.fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line2)}
.fbar.oneline{display:flex;flex-wrap:nowrap;gap:8px;align-items:center}.fbar.oneline select{flex:1 1 0;min-width:0;width:auto;padding:0 4px 0 8px;font-size:12.5px}.fbar.oneline .btn.gh{padding:0 8px}.fbar.oneline .btn,.fbar.oneline .icb{flex:none}.fbar.oneline .sp{display:none}
.fbar.fx{display:flex;flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:10px}
.fbar .fg{align-content:start;flex:none;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.fbar .fg>*{min-width:0;width:100%;max-width:none!important}
.fbar .fg .srch{grid-column:span 2;flex:none;height:34px}.fbar .fg .srch input{height:34px;font-size:13px}.fbar .fg .srch .ic,.fbar .fg .srch svg{top:9px}
.fbar .fg .fa{grid-column:1 / -1;min-width:0;flex-wrap:nowrap}.fbar .fg .fa.one .btn{max-width:100%;overflow:hidden}
.fbar .fa{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.fbar .fa:empty{display:none}.fbar .fa .sp{display:none}.fbar .fa .fnote{margin-right:auto}
.srch{position:relative;flex:1;min-width:220px;max-width:340px}
.srch .ic{position:absolute;left:10px;top:11px}.srch svg{position:absolute;left:10px;top:10px;width:16px;height:16px;color:var(--mut)}
.srch input{padding-left:34px!important;width:100%}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=search],input[type=time],select,textarea{height:38px;border:1px solid #d9dee8;border-radius:6px;padding:0 10px;font-size:13.5px;font-family:inherit;color:var(--ink);background:#fff;outline:none}
textarea{height:auto;padding:9px 10px;resize:vertical;min-height:80px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,91,216,.12)}
.fbar select{height:34px;font-size:12.8px;min-width:0;width:100%;padding:0 8px}.fbar .fa .btn{height:32px}.fbar{padding:12px 14px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.fld>label{font-size:12.8px;font-weight:500;color:var(--ink2)}
.fld>label .rq{color:var(--red)}
.fld .hint{font-size:12px;color:var(--mut)}
.fld .err{font-size:12px;color:var(--red)}
.fld input,.fld select,.fld textarea{width:100%}
.fld.inv input,.fld.inv select,.fld.inv textarea,.fld.inv .rte{border-color:var(--red)}
.chk{display:flex;align-items:flex-start;gap:9px;cursor:pointer;font-size:13.5px;line-height:1.4}
.chk input{margin:2px 0 0;width:16px;height:16px;accent-color:var(--blue);flex-shrink:0}
.sw{position:relative;width:38px;height:22px;flex-shrink:0;display:inline-block}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#cfd5e1;border-radius:22px;cursor:pointer;transition:.15s}
.sw span::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--blue)}.sw input:checked+span::before{transform:translateX(16px)}
.sw input:disabled+span{opacity:.5;cursor:not-allowed}
.setrow{display:flex;gap:20px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line2)}
.setrow:last-child{border-bottom:none}
.setrow .sl{flex:1}.setrow .sl b{font-weight:500;display:block;margin-bottom:3px}.setrow .sl span{font-size:12.8px;color:var(--mut)}
.setrow .sc{min-width:240px;display:flex;justify-content:flex-end;align-items:center;gap:8px}
.row{display:flex;gap:14px;align-items:flex-start}.row>*{flex:1;min-width:0}.row>.btn,.row>button,.row>.icb{flex:0 0 auto}
/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs .tb{padding:10px 16px;cursor:pointer;color:var(--ink2);font-weight:500;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs .tb:hover{color:var(--ink)}
.tabs .tb.on{color:var(--blue);border-bottom-color:var(--blue)}
.tabs .tb .cnt{background:var(--grey-l);color:var(--ink2);border-radius:10px;padding:0 7px;font-size:11px}
.tabs .tb.on .cnt{background:var(--blue-l);color:var(--blue)}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.ptabs .tb{padding:7px 14px;border:1px solid var(--line);border-radius:20px;cursor:pointer;font-size:13px;color:var(--ink2);background:#fff}
.ptabs .tb.on{background:var(--blue);color:#fff;border-color:var(--blue)}
/* Stepper */
.stepper{display:flex;align-items:center;gap:0;margin-bottom:22px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;overflow-x:auto}
.stp{display:flex;align-items:center;gap:10px;cursor:pointer;white-space:nowrap}
.stp .n{width:28px;height:28px;border-radius:50%;border:1.5px solid #cfd6e3;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:var(--mut);background:#fff}
.stp .t{font-size:13.5px;color:var(--mut);font-weight:500}
.stp.on .n{background:var(--blue);border-color:var(--blue);color:#fff}.stp.on .t{color:var(--ink)}
.stp.dn .n{background:var(--green-l);border-color:#9bd8b2;color:var(--green)}.stp.dn .t{color:var(--ink2)}
.stp-l{flex:1;min-width:24px;height:1.5px;background:var(--line);margin:0 14px}
/* Modal */
.mbg{position:fixed;inset:0;background:rgba(17,24,39,.42);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;overflow-y:auto}
.mdl{background:#fff;border-radius:14px;width:560px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;margin:auto 0}
.mdl.lg{width:820px}.mdl.xl{width:1100px}.mdl.sm{width:440px}
.mdl .mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line2)}
.mdl .mh h3{margin:0;font-size:16.5px;font-weight:600}
.mdl .mh .x{margin-left:auto}
.mdl .mb{padding:18px 20px;max-height:calc(100vh - 220px);overflow-y:auto}
.mdl .mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line2);background:#fafbfd;border-radius:0 0 14px 14px}
.mdl .mf .l{margin-right:auto;display:flex;gap:10px;align-items:center}
/* Toasts */
.toasts{position:fixed;bottom:76px;right:24px;flex-direction:column-reverse!important;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:#1c2740;color:#fff;padding:11px 16px;border-radius:8px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;gap:10px;align-items:center;max-width:420px;animation:tin .18s}
.toast.ok{background:#0f5132}.toast.err{background:#8a1c1c}.toast.inf{background:#1c3f8a}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}

.flex{display:flex;align-items:center;gap:8px}.sp{flex:1}

.sbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#edf0f5;margin:12px 0 8px}.sbar i{display:block;height:100%}.slg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2)}.slg b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.ovstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}.ovst{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}.ovst .kic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 40px}

.rsec{margin-bottom:22px}.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}.rcard{border:1px solid var(--line);border-radius:12px;padding:20px 22px;cursor:pointer;background:#fff;transition:box-shadow .15s,border-color .15s}.rcard:hover{border-color:var(--blue-m);box-shadow:0 2px 10px rgba(29,91,216,.08)}.rcard .rh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:16px}.rcard .rd{color:var(--mut);font-size:14px;line-height:1.7;margin-top:6px}.rstar{color:#8590a6;font-size:20px;line-height:1}.rstar.on{color:#f5c400}.rtags{display:flex;gap:10px;margin-top:12px}.rtag{font-size:12px;font-weight:700;padding:5px 8px;border-radius:5px}.rtag.t-amber{background:#fff4e5;color:#e68a00}.rtag.t-red{background:#fdecec;color:#e03131}
.logo-fld{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin:0 0 12px}.logo-prev{width:96px;height:56px;flex:0 0 96px;border-radius:8px;background:#f3f5f9;display:flex;align-items:center;justify-content:center;gap:4px;overflow:hidden;padding:6px}.logo-fld .flex{flex-wrap:wrap}.logo-prev img{max-width:100%;max-height:100%;object-fit:contain}.logo-prev svg{width:20px;height:22px}.logo-prev span{font-size:9px;font-weight:700;color:#13265c;line-height:1.1}

const snapData = () => { const o={}; DATA_KEYS.forEach(k=>o[k]=S[k]); return JSON.stringify(o); };
function syncOut(){ if(!BC) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>{ try{ const j=snapData(); if(j!==lastSync){ lastSync=j; BC.postMessage({t:'data',j}); } }catch(e){} }, 200); }
function syncReset(){ if(BC) try{ BC.postMessage({t:'reset'}); }catch(e){} }

function aStatus(a){ if(a.completedAt) return 'Completed'; if(a.due && a.due < now()) return 'Overdue'; if(learnStatus(a)==='In Progress') return 'In Progress'; return 'Not Started'; }
function learnStatus(a){ if(a.completedAt) return 'Completed'; if(a.type==='course'){ const c=course(a.item); const att = c.assessment? S.attempts.some(t=>t.emp===a.emp&&t.aid===c.assessment.id&&t.submittedAt>=a.assigned):false; return (a.lessonsDone.length||att)?'In Progress':'Not Started'; } return a.viewed?'In Progress':'Not Started'; }
const isOverdue = a => !a.completedAt && a.due && a.due < now();
function aProgress(a){ if(a.type==='article') return a.completedAt?100:0; const n=lessonsOf(course(a.item)).length; return n? a.lessonsDone.length/n*100 : 0; }
function certStatus(c){ if(c.revoked) return 'Revoked'; if(c.expires && c.expires < now()) return 'Expired'; if(isRenewed(c)) return 'Superseded'; return 'Valid'; }
const expiringSoon = c => certStatus(c)==='Valid' && c.expires && (c.expires - now()) <= S.settings.expWindow*DAY;
const certLabel = c => expiringSoon(c)? 'Expiring Soon' : certStatus(c);
function isRenewed(c){ return S.certs.some(x=>x!==c && x.emp===c.emp && x.def===c.def && x.issued>c.issued && !x.revoked); }

/* ---------- Metric engine: ONE set of definitions shared by dashboard, reports & profiles ---------- */
const RANGES = {'30d':['Last 30 days',30],'90d':['Last 90 days',90],'6m':['Last 6 months',183],'ytd':['Year to date',null],'all':['All time',null]};
function rangeBounds(k, shift=0){ const n=now(); if(k==='all') return [new Date(0), n]; let from; if(k==='ytd') from=new Date(n.getFullYear(),0,1); else from=addDays(n,-RANGES[k][1]);
  if(shift){ const len=n-from; return [new Date(from-len), from]; } return [from, n]; }
const ETYPES=[['fw','Field workers'],['bo','Back office employees']]; const etOf = e => e.kind==='bo'?'bo':'fw';
function filterCtx(f){ // f: {range, et, emp, team, dept, site, course}
  let es = scopeEmps(); if(f.et) es=es.filter(e=>etOf(e)===f.et); if(f.emp) es=es.filter(e=>e.id===f.emp); if(f.team) es=es.filter(e=>e.team===f.team); if(f.dept) es=es.filter(e=>e.dept===f.dept); if(f.site) es=es.filter(e=>e.site===f.site);
  return new Set(es.map(e=>e.id)); }
function metrics(f, shift=0){
  const ids = filterCtx(f); const [from,to] = rangeBounds(f.range||'6m', shift);
  const inR = d => d && d>=from && d<=to;
  let asg = S.assignments.filter(a=>ids.has(a.emp) && inR(a.assigned));
  if(f.course) asg = asg.filter(a=>a.type==='course' && a.item===f.course);
  const casg = asg.filter(a=>a.type==='course');
  const ccomp = casg.filter(a=>a.completedAt);
  const aidF = f.course? course(f.course)?.assessment?.id : null;
  const att = S.attempts.filter(t=>ids.has(t.emp) && !t.practice && t.status!=='In Progress' && inR(t.submittedAt) && (!f.course || t.aid===aidF));
  const passed = att.filter(t=>t.passed);
  const cdefF = f.course? S.certDefs.find(d=>d.course===f.course)?.id : null;
  const certsAll = S.certs.filter(c=>ids.has(c.emp) && (!f.course || c.def===cdefF));
  const issued = certsAll.filter(c=>inR(c.issued));
  const active = new Set();
  S.assignments.forEach(a=>{ if(ids.has(a.emp) && (inR(a.lastActivity)||inR(a.completedAt))) active.add(a.emp); });
  att.forEach(t=>active.add(t.emp));
  const overdue = S.assignments.filter(a=>ids.has(a.emp) && a.mandatory && isOverdue(a) && inR(a.due) && (!f.course || a.item===f.course));
  return {
    learners: new Set([...asg.map(a=>a.emp),...active]).size, active: active.size,
    published: f.course? 1 : S.courses.filter(c=>c.status==='Published').length,
    assignments: asg.length, completed: ccomp.length, completionRate: pctOf(ccomp.length, casg.length),
    avgScore: att.length? att.reduce((s,t)=>s+t.pct,0)/att.length : null, passRate: pctOf(passed.length, att.length),
    overdue: overdue.length, issued: issued.length,
    expiring: certsAll.filter(expiringSoon).length,
    expired: certsAll.filter(c=>certStatus(c)==='Expired' && !isRenewed(c) && inR(c.expires)).length,
    // supporting sets
    _casg:casg, _att:att, _certs:certsAll, _overdue:overdue, _ids:ids, _asg:asg, _from:from, _to:to
  };
}

/* ---------- Table component (search/sort/pagination handled here) ---------- */
function setT(id,k,v){ const t=S.T[id]; t[k]=v; if(k!=='page') t.page=1; render(); }
function sortT(id,k){ const t=S.T[id]; if(t.sort===k) t.dir*=-1; else { t.sort=k; t.dir=1; } render(); }
const WRAP_RE=/^(article title|question|course name|assessment title|title|topic|prototype assumption|capability|detail|training item|course \/ article|activity|certificate name|item)$/i;
const WRAP2_RE=/^(course|assessment|certificate|article|rule|linked course|category|visibility|assigned by|job site|client|job type)$/i;
function table(id, cols, rows, o={}){
  const t = S.T[id] || (S.T[id]={sort:o.sort||null,dir:o.dir||1,page:1,size:o.size||10});
  let rs = rows.slice();
  if(t.sort){ const c=cols.find(c=>c.k===t.sort); if(c){ const fn=c.sv||(r=>r[c.k]); rs.sort((a,b)=>{ let x=fn(a), y=fn(b); if(x instanceof Date) x=+x; if(y instanceof Date) y=+y; if(x==null) return 1; if(y==null) return -1; return (typeof x==='string'? x.localeCompare(y): x-y)*t.dir; }); } }
  const total=rs.length, pages=Math.max(1,Math.ceil(total/t.size)); if(t.page>pages) t.page=pages;
  const view = rs.slice((t.page-1)*t.size, t.page*t.size);
  const pgBtns = []; for(let i=1;i<=pages;i++){ if(pages>7 && i>2 && i<pages-1 && Math.abs(i-t.page)>1){ if(pgBtns[pgBtns.length-1]!=='…') pgBtns.push('…'); continue;} pgBtns.push(i); }
  return `<div class="tblw"><table class="tbl"><thead><tr>${cols.map(c=>`<th ${c.ns?'':`class="sortable" onclick="sortT('${id}','${c.k}')"`} ${c.w?`style="width:${c.w}"`:''}>${c.label}${t.sort===c.k?`<span class="sa">${t.dir>0?'▲':'▼'}</span>`:''}</th>`).join('')}</tr></thead>
  <tbody>${view.length? view.map(r=>`<tr ${o.click?`class="clk" onclick="${o.click(r)}"`:''}>${cols.map(c=>`<td class="${c.cls||(c.wr?'wr':WRAP_RE.test(c.label)?'wr':WRAP2_RE.test(c.label)?'wr2':'')}">${c.f? c.f(r) : esc(r[c.k])}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}" class="empty">${ic('inbox')}<div style="margin-top:6px">${o.empty||'No records match the current filters.'}</div></td></tr>`}</tbody></table></div>
  ${o.nopage?'':`<div class="pager"><span>Showing ${total? (t.page-1)*t.size+1:0}–${Math.min(total,t.page*t.size)} of ${total}</span><span class="muted">·</span><span>Rows <select onchange="setT('${id}','size',+this.value)">${[5,10,20,50].map(n=>`<option ${n===t.size?'selected':''}>${n}</option>`).join('')}</select></span>
  <div class="r"><button class="pb" ${t.page<=1?'disabled':''} onclick="setT('${id}','page',${t.page-1})">‹</button>${pgBtns.map(i=>i==='…'?'<span class="muted">…</span>':`<button class="pb ${i===t.page?'on':''}" onclick="setT('${id}','page',${i})">${i}</button>`).join('')}<button class="pb" ${t.page>=pages?'disabled':''} onclick="setT('${id}','page',${t.page+1})">›</button></div></div>`}`;
}

/* ---------- Charts (SVG) ---------- */
function donut(segs, size=150, center){ const tot=segs.reduce((s,x)=>s+x.v,0)||1; let a=-Math.PI/2; const R=size/2-8, r0=R-18, cx=size/2, cy=size/2;
  const arcs=segs.filter(s=>s.v>0).map(s=>{ const a2=a+(s.v/tot)*Math.PI*2*0.9999; const L=a2-a>Math.PI?1:0; const p=`M${cx+R*Math.cos(a)} ${cy+R*Math.sin(a)} A${R} ${R} 0 ${L} 1 ${cx+R*Math.cos(a2)} ${cy+R*Math.sin(a2)} L${cx+r0*Math.cos(a2)} ${cy+r0*Math.sin(a2)} A${r0} ${r0} 0 ${L} 0 ${cx+r0*Math.cos(a)} ${cy+r0*Math.sin(a)}Z`; a=a2; return `<path d="${p}" fill="${s.c}"><title>${esc(s.l)}: ${s.v}</title></path>`; }).join('');
  return `<div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${segs.every(s=>!s.v)?`<circle cx="${cx}" cy="${cy}" r="${R-9}" fill="none" stroke="#eef1f5" stroke-width="18"/>`:arcs}<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2740">${center?.[0]??tot}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="11" fill="#8590a6">${center?.[1]??'total'}</text></svg>
  <div style="display:flex;flex-direction:column;gap:8px;font-size:13px">${segs.map(s=>`<div class="flex"><i class="dot" style="background:${s.c}"></i><span style="min-width:110px">${esc(s.l)}</span><b>${s.v}</b><span class="muted small">${p1(s.v/tot*100)}</span></div>`).join('')}</div></div>`; }
function bars(labels, series, o={}){ const W=o.w||560, H=o.h||200, pl=34, pb=24, pt=10; const iw=W-pl-10, ih=H-pb-pt; const max=Math.max(1,...labels.map((_,i)=> o.stack? series.reduce((s,x)=>s+x.v[i],0) : Math.max(...series.map(x=>x.v[i])))); const nice = o.pct?100: niceMax(max);
  const gw=iw/labels.length, bw=o.stack? Math.min(34,gw*.55) : Math.min(22,gw*.7/series.length);
  let g=''; for(let i=0;i<=4;i++){ const y=pt+ih-ih*i/4; g+=`<line x1="${pl}" x2="${W-10}" y1="${y}" y2="${y}" stroke="#eef0f4"/><text x="${pl-6}" y="${y+4}" font-size="10" fill="#8590a6" text-anchor="end">${Math.round(nice*i/4)}${o.pct?'%':''}</text>`; }
  labels.forEach((l,i)=>{ const x0=pl+gw*i+gw/2; let acc=0; series.forEach((s,j)=>{ const v=s.v[i]||0; const h=ih*v/nice; if(o.stack){ g+=`<rect x="${x0-bw/2}" y="${pt+ih-acc-h}" width="${bw}" height="${h}" fill="${s.c}" rx="2"><title>${esc(s.n)} – ${esc(l)}: ${o.pct?p1(v):v}</title></rect>`; acc+=h; } else { const x=x0-(series.length*bw)/2+j*bw; g+=`<rect x="${x+1}" y="${pt+ih-h}" width="${bw-2}" height="${h}" fill="${s.c}" rx="2"><title>${esc(s.n)} – ${esc(l)}: ${o.pct?p1(v):v}</title></rect>`; } }); g+=`<text x="${x0}" y="${H-6}" font-size="10.5" fill="#8590a6" text-anchor="middle">${esc(l)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:${H+10}px">${g}</svg>${series.length>1||o.legend?`<div class="legend" style="margin-top:6px">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div>`:''}`; }
function line(labels, series, o={}){ const W=o.w||560, H=o.h||200, pl=34, pb=24, pt=12; const iw=W-pl-14, ih=H-pb-pt; const vals=series.flatMap(s=>s.v).filter(v=>v!=null); const max=o.max||Math.max(1,...vals); const nice=o.pct?100:niceMax(max);
  let g=''; for(let i=0;i<=4;i++){ const y=pt+ih-ih*i/4; g+=`<line x1="${pl}" x2="${W-14}" y1="${y}" y2="${y}" stroke="#eef0f4"/><text x="${pl-6}" y="${y+4}" font-size="10" fill="#8590a6" text-anchor="end">${Math.round(nice*i/4)}${o.pct?'%':''}</text>`; }
  const X=i=>pl+(labels.length===1?iw/2:iw*i/(labels.length-1)), Y=v=>pt+ih-ih*v/nice;
  const every=Math.ceil(labels.length/8); labels.forEach((l,i)=>{ if(i%every && i!==labels.length-1) return; g+=`<text x="${X(i)}" y="${H-6}" font-size="10.5" fill="#8590a6" text-anchor="middle">${esc(l)}</text>`; });
  series.forEach(s=>{ const pts=s.v.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean); g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linejoin="round"/>`; s.v.forEach((v,i)=>{ if(v!=null) g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="#fff" stroke="${s.c}" stroke-width="2"><title>${esc(s.n)} – ${esc(labels[i])}: ${o.pct?p1(v):v}</title></circle>`; }); });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:${H+10}px">${g}</svg><div class="legend" style="margin-top:6px">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div>`; }
const C = {blue:'#1d5bd8',green:'#22a55a',amber:'#e3a008',red:'#e5484d',grey:'#c7cdd9',purple:'#7c3aed',cyan:'#0ea5c6',navy:'#24365f'};
/* Time buckets that follow the selected date range: 30d → weeks, 90d → weeks, 6m/YTD → months, All time → quarters */
function periodBuckets(rk){ const [from,to]=rangeBounds(rk||'6m'); const out=[]; const t=now();
  const sod=d=>{ const x=new Date(d); x.setHours(0,0,0,0); return x; };
  if(rk==='30d'||rk==='90d'){ let s=sod(from); while(s<t){ const e=new Date(Math.min(addDays(s,7).getTime(),t.getTime()+1)); out.push({from:s,to:e,label:`${s.getDate()} ${MON[s.getMonth()]}`}); s=addDays(s,7); } return out; }
  if(rk==='all'){ const first=[...S.assignments.map(a=>a.assigned),...S.attempts.map(a=>a.submittedAt).filter(Boolean)].reduce((m,d)=>d<m?d:m,t); let y=first.getFullYear(), q=Math.floor(first.getMonth()/3);
    while(new Date(y,q*3,1)<=t){ const s=new Date(y,q*3,1), e=new Date(y,q*3+3,1); out.push({from:s,to:e,label:`Q${q+1} ${String(y).slice(2)}`}); q++; if(q>3){q=0;y++;} } return out; }
  let s=new Date(from.getFullYear(),from.getMonth(),1); if(rk==='6m') s=new Date(t.getFullYear(),t.getMonth()-5,1);
  while(s<=t){ const e=new Date(s.getFullYear(),s.getMonth()+1,1); out.push({from:s,to:e,label:MON[s.getMonth()]}); s=e; } return out; }
const inB = (d,b) => d && d>=b.from && d<b.to;
const niceMax = v => { if(v<=0) return 4; const raw=v/4, p=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/p; const step=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; return step*4; };
function monthsBack(n){ const out=[]; const t=now(); for(let i=n-1;i>=0;i--){ const d=new Date(t.getFullYear(), t.getMonth()-i, 1); out.push(d);} return out; }
const sameMonth = (a,b) => a && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth();

function audPicker(path, opts={}){ const aud = getPath(path); const kinds = opts.kinds || ['etype','role','dept','team','site','emp'];
  const optsFor = k => k==='etype'? ETYPES : k==='role'? [...new Set(S.emps.map(e=>e.role))].sort().map(x=>[x,x]) : k==='dept'? S.depts.map(x=>[x,x]) : k==='team'? optTeams() : k==='site'? optSites() : (opts.scoped? scopeEmps(): S.emps).map(e=>[e.id,e.name+(e.status!=='Active'?' (inactive)':'')+(e.syncError?' (sync error)':'')]);
  const kSel = kinds.includes(S._audK)? S._audK : kinds[0];
  const count = audResolve(aud).length;
  return `<div class="card" style="padding:14px">
   ${opts.noAll?'':`<label class="chk" style="margin-bottom:12px"><input type="checkbox" ${aud.all?'checked':''} onchange="setPath('${path}.all',this.checked);render()"> <span><b>All field workers and back office employees</b><div class="small muted">Everyone in ${esc(S.ORG.name)} who has Training Center access</div></span></label>`}
   ${aud.all?'':`<div class="row" style="gap:8px;margin-bottom:10px"><select style="max-width:160px" onchange="S._audK=this.value;render()">${kinds.map(k=>`<option value="${k}" ${k===kSel?'selected':''}>${({etype:'Employee type',role:'Category',dept:'Department',team:'Team',site:'Job Site',emp:'Individual employee'})[k]}</option>`).join('')}</select>
   <select id="audv" style="flex:2">${optsFor(kSel).map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select>
   <button class="btn" onclick="audAdd('${path}','${kSel}',document.getElementById('audv').value)">${ic('plus')}Add</button></div>
   <div class="chips">${aud.targets.map((t,i)=>`<span class="chip">${esc(tLabel(t))}<span class="x" onclick="audDel('${path}',${i})">${ic('x')}</span></span>`).join('') || '<span class="small muted">No groups or employees selected yet.</span>'}</div>`}
   <div class="small muted" style="margin-top:10px">${ic('users')} Resolves to <b>${count}</b> employee${count===1?'':'s'}</div></div>`; }
function getPath(p){ return p.split('.').reduce((o,k)=>o?.[k], window); }
function setPath(p,v){ const ks=p.split('.'); const last=ks.pop(); ks.reduce((o,k)=>o[k], window)[last]=v; }
function audAdd(path,k,v){ const aud=getPath(path); if(!v) return; if(aud.targets.some(t=>t.k===k&&t.v===v)) return toast('Already in the audience','inf'); aud.targets.push({k,v}); render(); }
function audDel(path,i){ getPath(path).targets.splice(i,1); render(); }
const lucName = n => n.replace(/(^\w|-\w)/g, m=>m.replace('-','').toUpperCase());
function icons(){ try{ if(window.lucide && lucide.icons){ // any name missing from this Lucide version uses the built-in fallback icon instead of logging a warning
    document.querySelectorAll('i[data-lucide]').forEach(el=>{ const n=el.getAttribute('data-lucide'); if(!lucide.icons[lucName(n)]) el.setAttribute('data-fb','1'); });
    fbIcons('i[data-lucide][data-fb]'); lucide.createIcons({attrs:{}}); return; } }catch(e){} fbIcons(); }
function fbIcons(sel){ const NS='http://www.w3.org/2000/svg'; document.querySelectorAll(sel||'i[data-lucide]').forEach(el=>{ const n=el.getAttribute('data-lucide'); const p=ICONS_FB[n]||ICONS_FB['circle']||[]; const s=document.createElementNS(NS,'svg'); s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('class','lucide lucide-fb lucide-'+n+' '+(el.getAttribute('class')||'')); if(el.getAttribute('style')) s.setAttribute('style',el.getAttribute('style')); p.forEach(d=>{ const q=document.createElementNS(NS,'path'); q.setAttribute('d',d); s.appendChild(q); }); el.replaceWith(s); }); }

/* Docked section menu (EntraField pattern): the page's side menu sits flush against the main sidebar, full height,

function dockNav(){ if(S.mobile) return; const pg=document.querySelector('.content > .pg'); if(!pg) return;
  const nav=pg.querySelector(':scope > .vtw > .vtnav, :scope > .setwrap > .setnav'); if(!nav) return; const holder=nav.parentElement;
  nav.remove(); [...holder.childNodes].forEach(n=>holder.parentNode.insertBefore(n,holder)); holder.remove();
  const main=document.createElement('div'); main.className='dockmain'; while(pg.firstChild) main.appendChild(pg.firstChild);
  nav.classList.add('docknav'); pg.classList.add('docked'); pg.appendChild(nav); pg.appendChild(main); }
/* Section menus: every page-level tab strip is shown as a vertical sub-menu beside the content (EntraField pattern) */
function vtabs(){ document.querySelectorAll('.content .pg > .tabs, .content .pg > .ptabs').forEach(t=>{ const pg=t.parentElement;
  const h=pg.querySelector('h1'); const title=h?h.textContent.trim():'';
  const nav=document.createElement('nav'); nav.className='vtnav'; nav.innerHTML=title?`<div class="vth" title="${esc(title)}">${esc(title)}</div>`:'';
  t.querySelectorAll('.tb').forEach(tb=>{ const it=document.createElement('div'); it.className='vti'+(tb.classList.contains('on')?' on':''); it.setAttribute('onclick',tb.getAttribute('onclick')||'');
    const c=tb.cloneNode(true); let cnt=''; const cs=c.querySelector('.cnt'); if(cs){ cnt=cs.textContent.trim(); cs.remove(); } c.querySelectorAll('svg,i[data-lucide]').forEach(x=>x.remove());
    let html=c.innerHTML.trim(); const m=c.textContent.trim().match(/^(.*?)\s*\((\d+)\)\s*$/); if(m&&!cnt){ cnt=m[2]; html=html.replace(/\s*\(\d+\)\s*/,''); }
    it.innerHTML=`<span class="vtl">${html}</span>${cnt!==''?`<span class="vtc">${cnt}</span>`:''}`; nav.appendChild(it); });
  const body=document.createElement('div'); body.className='vtbody'; while(t.nextSibling) body.appendChild(t.nextSibling);
  const wrap=document.createElement('div'); wrap.className='vtw'; wrap.appendChild(nav); wrap.appendChild(body); t.replaceWith(wrap); }); }
/* Place Clear/Export etc. in the free space at the end of the last filter row; wrap only when it does not fit */
function fitFilterActions(){ document.querySelectorAll('.fbar .fg').forEach(g=>{ const fa=g.querySelector(':scope>.fa'); if(!fa) return;
  const cols=getComputedStyle(g).gridTemplateColumns.split(' ').filter(Boolean); const n=cols.length, cw=parseFloat(cols[0])||150, gap=parseFloat(getComputedStyle(g).columnGap)||8;
  let used=0; [...g.children].forEach(c=>{ if(c!==fa) used+= c.classList.contains('srch')? Math.min(2,n) : 1; });
  const r=used%n, free= r? n-r : 0; fa.style.gridColumn='1 / -1'; const need=[...fa.children].reduce((s,c)=>s+c.getBoundingClientRect().width+8,0)-8;
  if(free && free*cw+(free-1)*gap>=need) fa.style.gridColumn=`span ${free} / -1`; }); }

  bar.appendChild(fg); fa.querySelectorAll(':scope>.sp').forEach(x=>x.remove()); if(fa.childNodes.length){ if(fa.children.length===1) fa.classList.add('one'); (fa.querySelector('.fnote')&&fa.children.length===1? bar : fg).appendChild(fa); } bar.classList.add('fx'); }); }

<script>

/* ---------- Training Center Overview: summary of the Training Center sections (full analytics live in Analytics → Training) ---------- */

  const active=new Set(enr.filter(a=>(a.lastActivity&&a.lastActivity>=wk)||(a.completedAt&&a.completedAt>=wk)).map(a=>a.emp)).size;

     tile('Assessment pass rate',p1(m.passRate),'badge-check','t-green',"go('tc-reports',{r:'passfail',range:'30d'})",delta('passRate',1)),
     tile('Certificates expiring soon',soon.length,'hourglass','t-amber',"go('tc-certs',{tab:'issued',st:'Expiring Soon'})",note_('Next '+S.settings.expWindow+' days – renew')),
     tile('Expired certificates',expd.length,'calendar-x','t-red',"go('tc-certs',{tab:'issued',st:'Expired'})",note_('Not yet renewed'))]]];
  const grp=([t,i,go_,tiles])=>`<div class="ovg" style="grid-column:span ${tiles.length}"><div class="ovgh">${ic(i)}<span>${t}</span><a class="small" onclick="${go_}">View</a></div><div class="ovgt" style="grid-template-columns:repeat(${tiles.length},minmax(0,1fr))">${tiles.join('')}</div></div>`;
  const man=(icon,t,title,sum,route,act)=>`<div class="card ovm"><div class="card-b"><span class="kic ${t}">${ic(icon)}</span><div style="flex:1;min-width:0;cursor:pointer" onclick="${route}"><div class="b">${title} ${ic('chevron-right')}</div><div class="small muted">${sum}</div></div>${act?`<button class="icb" title="${act[0]}" onclick="${act[1]}">${ic('plus')}</button>`:''}</div></div>`;
  return `<div class="pg">${pageHead('Overview','Key training figures for the last 30 days, compared with the previous 30 days.',`<button class="btn" onclick="go('an-training')">${ic('chart-column')}View full analytics</button>${can('courseManage')?`<button class="btn pri" onclick="newCourse()">${ic('plus')}Create Course</button>`:''}`)}
  <div class="ovk">${G.flatMap(g=>g[3]).join('')}</div>

   <div class="card"><div class="card-h"><h3>Certificates expiring soon</h3><div class="r"><a class="small" onclick="go('tc-certs',{tab:'issued',st:'Expiring Soon'})">View all</a></div></div><div class="card-b list">${soon.slice(0,5).map(c=>{ const d=Math.ceil((c.expires-now())/DAY); return `<div class="li" style="cursor:pointer" onclick="viewCert('${c.id}')"><div style="width:210px;flex:0 0 210px">${empCell(c.emp)}</div><div class="lt2" style="flex:1"><b>${esc(certDef(c.def).name)}</b><span>Expires ${fD(c.expires)}</span></div><span class="bd ${d<=7?'b-red':'b-amber'} nodot">${d} day${d===1?'':'s'}</span></div>`; }).join('')||'<div class="muted small">No certificates expire in the next '+S.settings.expWindow+' days.</div>'}</div></div>
  </div>
  <div style="display:grid;gap:16px">
   <div class="card"><div class="card-h"><h3>Course performance</h3><div class="r"><a class="small" onclick="go('tc-courses')">View all</a></div></div><div class="card-b list">${rowsC.map(x=>`<div class="li" style="cursor:pointer" onclick="go('tc-course',{id:'${x.c.id}'})"><span class="kic ${x.c.color}" style="width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center">${ic(x.c.icon)}</span><div class="lt2" style="flex:1;min-width:0"><b>${esc(x.c.title)}</b><span>${x.n} enrolled · ${x.ip} in progress · ${x.d} completed</span></div><div style="width:150px">${prog(x.rate||0)}</div></div>`).join('')}</div></div>
  </div></div>`; };
/* ---------- EntraField → Activity: activity feed (same pattern as the existing Activities page) ---------- */
const ACT_T={assign:['Course-Assigned','#e0f2fe','#0369a1'],enrol:['Enrolled','#e8efff','#2f55d4'],course:['Course-Completed','#dcfce7','#15803d'],pass:['Assessment-Passed','#d1fae5','#047857'],fail:['Assessment-Failed','#fee2e2','#b91c1c'],cert:['Certificate-Issued','#f3e8ff','#7e22ce'],expired:['Certificate-Expired','#ffedd5','#c2410c']};
const actKind = x => x.kind==='assess'? (x.st==='Passed'?'pass':'fail') : x.kind;
const actDT = d => { const p=n=>String(n).padStart(2,'0'); let h=d.getHours(); const ap=h>=12?'PM':'AM'; h=h%12||12; return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(h)}:${p(d.getMinutes())} ${ap}, <b style="font-weight:500;color:var(--ink)">India Standard Time</b>`; };
function actText(x){ const n=`'${esc(empName(x.emp))}'`, it=`'${esc(x.item)}'`;
  switch(actKind(x)){ case 'enrol': return `${n} has enrolled in course ${it}.`; case 'assign': return `${n} has been assigned course ${it} by '${esc(x.by||'')}'.`; case 'course': return `${n} has completed course ${it}.`;
    case 'pass': return `${n} has passed assessment ${it} with ${Math.round(x.pct)}% (attempt ${x.no}${x.practice?', practice':''}).`;
    case 'fail': return `${n} did not pass assessment ${it} – scored ${Math.round(x.pct)}% (attempt ${x.no}${x.practice?', practice':''}).`;
    case 'cert': return `${n} has been issued certificate ${it}.`; case 'expired': return `Certificate ${it} of ${n} has expired.`; } return `${n} ${esc(x.act)} ${it}.`; }
function latestActCard(rows, viewAll, title, empty){ S._laRows=rows; return `<div class="card latact"><div class="card-h"><h3>${title||'Latest Activity'}</h3><div class="r"><button class="vabtn" onclick="${viewAll}">View All</button></div></div><div class="laboby">${rows.length?rows.map((x,i)=>{ const [l,bg,fg]=ACT_T[actKind(x)]; return `<div class="larow" onclick="actOpen(${i},'la')">${av(x.emp,'avl')}<div class="latx"><div>${actText(x)}</div><div class="ladt">${laDT(x.at)}</div></div><span class="actpill" style="background:${bg};color:${fg}">${l}</span><span class="icb" title="Open">${ic('square-arrow-out-up-right')}</span></div>`; }).join(''):`<div class="muted small" style="padding:18px">${empty||'No recent training activity.'}</div>`}</div></div>`; }
function actOpen(i,src){ const x=(src==='la'?S._laRows:S._actRows)[i]; if(!x) return; const k=actKind(x);

  if(x.cid&&can('courseManage')) return go('tc-course',{id:x.cid}); go('ef-worker',{id:x.emp,tab:'training'}); }
const laDT = d => { const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], p=n=>String(n).padStart(2,'0'); let h=d.getHours(); const ap=h>=12?'PM':'AM'; h=h%12||12; return `${M[d.getMonth()]} ${p(d.getDate())}, ${d.getFullYear()} ${p(h)}:${p(d.getMinutes())} ${ap}, India Standard Time`; };
function actMarkAll(){ S.actReadAt=now(); toast('All activities marked as read'); render(); }
PAGES['ef-activity'] = p => { if(!can('activity')) return denied('view activities'); applyP('act',p,['emp','type']); const f=F('act'); if(!f.range) f.range='30d';
  if(!S.actReadAt) S.actReadAt=addDays(now(),-2);

  S._actRows=rows; const lim=f.lim||25; const unread=rows.filter(x=>x.at>S.actReadAt).length;

  ${rows.length? rows.slice(0,lim).map((x,i)=>{ const [l,bg,fg]=ACT_T[actKind(x)]; return `<div class="actrow ${x.at>S.actReadAt?'unr':''}" onclick="actOpen(${i})">${av(x.emp,'avl')}<div class="acttx"><div>${actText(x)}</div><div class="actdt">${actDT(x.at)}</div></div><span class="actpill" style="background:${bg};color:${fg}">${l}</span><span class="icb" title="Open">${ic('square-arrow-out-up-right')}</span></div>`; }).join('')

PAGES['an-training'] = p => {

  const ids = m._ids; const allA = S.assignments.filter(a=>ids.has(a.emp) && (!f.course||a.item===f.course));

  const cc = {valid:m._certs.filter(c=>certStatus(c)==='Valid'&&!expiringSoon(c)).length, exp:m.expiring, expd:m.expired, rev:m._certs.filter(c=>c.revoked).length, sup:m._certs.filter(c=>certStatus(c)==='Superseded').length};
  // recent & attention

  const att = attentionRows(ids, f.course); const at = F('ov').at||'all';
  const attF = att.filter(x=>at==='all'||x.kind===at);
  return `<div class="pg">${pageHead('Training Analytics','Training performance across your organization – trainees, courses, assessments and certifications.')}

function recentActivity(ids, cf){ const out=[];
  S.assignments.filter(a=>ids.has(a.emp)&&a.completedAt&&(!cf||a.item===cf)).forEach(a=>out.push(a.type==='course'?{kind:'course',emp:a.emp,act:'Completed course',item:itemName(a),at:a.completedAt,st:'Completed',cid:a.item}:{kind:'ack',emp:a.emp,act:'Acknowledged article',item:itemName(a)+` (rev ${a.ackRev})`,at:a.completedAt,st:'Acknowledged'}));
  S.assignments.filter(a=>ids.has(a.emp)&&a.type==='course'&&(!cf||a.item===cf)).forEach(a=>out.push(a.source==='assigned'?{kind:'assign',emp:a.emp,act:'Assigned course',item:itemName(a),at:a.assigned,st:'Assigned',cid:a.item,by:a.by}:{kind:'enrol',emp:a.emp,act:'Enrolled in course',item:itemName(a),at:a.assigned,st:'Enrolled',cid:a.item}));
  S.attempts.filter(t=>ids.has(t.emp)&&t.status!=='In Progress'&&(!cf||t.aid===course(cf)?.assessment?.id)).forEach(t=>out.push({kind:'assess',emp:t.emp,act:`Submitted assessment (attempt ${t.no})${t.practice?' – practice':''}`,item:assess(t.aid).title,at:t.submittedAt,st:t.passed?'Passed':'Failed',ref:t.id,aid:t.aid,no:t.no,pct:t.pct,practice:t.practice}));
  S.certs.filter(c=>ids.has(c.emp)&&(!cf||certDef(c.def).course===cf)).forEach(c=>out.push({kind:'cert',emp:c.emp,act:'Certificate issued',item:certDef(c.def).name,at:c.issued,st:certLabel(c),ref:c.id}));
  S.certs.filter(c=>ids.has(c.emp)&&c.expires&&c.expires<=now()&&(!cf||certDef(c.def).course===cf)).forEach(c=>out.push({kind:'expired',emp:c.emp,act:'Certificate expired',item:certDef(c.def).name,at:c.expires,st:'Expired',ref:c.id}));
  return out.filter(x=>x.at<=now()).sort((a,b)=>b.at-a.at); }
function attentionRows(ids, cf){ const out=[];
  S.assignments.filter(a=>ids.has(a.emp)&&a.mandatory&&isOverdue(a)&&(!cf||a.item===cf)).forEach(a=>out.push({kind:'overdue',emp:a.emp,item:itemName(a),issue:'Overdue',date:a.due,ref:a.id}));
  S.assignments.filter(a=>ids.has(a.emp)&&a.type==='course'&&!a.completedAt&&(!cf||a.item===cf)).forEach(a=>{ const c=course(a.item); if(!c.assessment) return; const ts=attemptsFor(a.emp,c.assessment.id).filter(t=>t.submittedAt>=a.assigned); const last=ts.sort((x,y)=>y.submittedAt-x.submittedAt)[0]; if(last&&!last.passed) out.push({kind:'failed',emp:a.emp,item:assess(c.assessment.id).title,issue:ts.length>=assess(c.assessment.id).attempts?'Attempts exhausted':'Failed',date:last.submittedAt,ref:last.id}); });
  S.certs.filter(c=>ids.has(c.emp)&&certStatus(c)==='Expired'&&!isRenewed(c)&&(!cf||certDef(c.def).course===cf)).forEach(c=>out.push({kind:'expired',emp:c.emp,item:certDef(c.def).name,issue:'Expired',date:c.expires,ref:c.id}));

function articleActions(a, inline){
  const acts=[]; const pub=can('articlePublish'), ed=can('articleEdit');
  acts.push(['eye','View',`go('tc-article',{id:'${a.id}'})`]);
  if(ed && a.status!=='Archived') acts.push(['pencil','Edit',`go('tc-article-edit',{id:'${a.id}'})`]);
  if(ed && a.status==='Draft') acts.push(['send','Submit for Approval',`artTransition('${a.id}','submit')`]);
  if(pub && (a.status==='Pending Approval')) acts.push(['circle-check','Approve & Publish',`artTransition('${a.id}','approve')`],['undo-2','Return to Draft',`artTransition('${a.id}','return')`]);
  if(pub && a.status==='Draft') acts.push(['globe','Publish',`artTransition('${a.id}','publish')`]);
  if(can('assign') && a.status==='Published' && a.ack) acts.push(['user-plus','Assign as Mandatory Reading',`go('tc-assign-new',{type:'article',item:'${a.id}'})`]);
  if(pub && a.status==='Published') acts.push(['archive','Archive',`artTransition('${a.id}','archive')`,1]);
  if(pub && a.status==='Archived') acts.push(['archive-restore','Restore to Draft',`artTransition('${a.id}','restore')`]);
  if(inline) return acts;
  return `<details class="dd" onclick="event.stopPropagation()"><summary class="icb">${ic('ellipsis')}</summary><div class="ddm">${acts.map(([i,l,f,d])=>`<a class="${d?'dng':''}" onclick="${f}">${ic(i)}${l}</a>`).join('')}</div></details>`;
}
function artValidate(a, forPublish){ const e={}; if(!a.title?.trim()) e.title='Title is required'; if(!a.cat) e.cat='Category is required';
  if(forPublish){ const txt=(a.content||'').replace(/<[^>]*>/g,'').trim(); if(!txt && !/<img|media-ph|<table/.test(a.content||'')) e.content='Content must not be empty before publication'; if(!a.vis.all && !a.vis.targets.length) e.vis='Select at least one audience'; }
  return e; }
function artTransition(id, act){ const a=article(id); closeDD();
  const doIt = () => { const t=now();
    if(act==='submit'){ const e=artValidate(a,true); if(Object.keys(e).length){ toast('Cannot submit: '+Object.values(e).join(', '),'err'); return; } a.status='Pending Approval'; a.updated=t; logAudit('Submitted article for approval',id); notify('ca',`Article "${a.title}" is awaiting approval`,'file-check'); toast('Submitted for approval – approvers notified'); }
    if(act==='approve'||act==='publish'){ const e=artValidate(a,true); if(Object.keys(e).length){ toast('Cannot publish: '+Object.values(e).join(', '),'err'); return; } a.status='Published'; a.rev=(a.rev||0)+1; a.published=t; a.updated=t; a.revisions.push({rev:a.rev,at:t,by:me().name,note:act==='approve'?'Approved and published':'Published'}); logAudit(`Published article revision ${a.rev}`,id); toast(`Published as revision ${a.rev} – now visible to: ${esc(audLabel(a.vis))}`); }
    if(act==='return'){ a.status='Draft'; a.updated=t; logAudit('Returned article to draft',id); toast('Returned to author for changes'); }
    if(act==='archive'){ a.status='Archived'; a.updated=t; logAudit('Archived article',id); toast('Article archived – existing acknowledgment records preserved'); }
    if(act==='restore'){ a.status='Draft'; a.updated=t; logAudit('Restored article to draft',id); toast('Restored to Draft for editing'); }
    S.modal=null; render(); };
  if(act==='archive') confirmDlg({title:'Archive article?',msg:`<b>${esc(a.title)}</b> will be removed from the published listing and can no longer be newly assigned. All ${S.assignments.filter(x=>x.item===id&&x.completedAt).length} acknowledgment records are preserved.`,danger:1,ok:'Archive',onOk:doIt});
  else if(act==='approve'||act==='publish') confirmDlg({title:act==='approve'?'Approve & publish?':'Publish article?',msg:`<b>${esc(a.title)}</b> will become visible to <b>${esc(audLabel(a.vis))}</b> (${audResolve(a.vis).length} employees).`,ok:'Publish',icon:'globe',onOk:doIt});
  else doIt(); }
